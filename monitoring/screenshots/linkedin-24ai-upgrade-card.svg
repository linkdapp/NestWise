<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#13293d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c74634"/>

  <text x="70" y="96" fill="#8fb8d6" font-size="20" letter-spacing="3">ORACLE ENTERPRISE MANAGER</text>
  <text x="70" y="158" fill="#ffffff" font-size="52" font-weight="600">13.5.0.33 to 24ai Release 1</text>
  <text x="70" y="204" fill="#f0b429" font-size="30">Out of place, patched to RU12 before the window opened</text>

  <!-- Band 1 -->
  <rect x="70" y="258" width="700" height="132" rx="10" fill="#16394f" stroke="#2d6a8f" stroke-width="2"/>
  <text x="96" y="296" fill="#7fd1a6" font-size="19" letter-spacing="2">NO DOWNTIME &#183; 13.5 STILL SERVING THE CONSOLE</text>
  <text x="96" y="336" fill="#ffffff" font-size="24">Stage &#8594; Prerequisite Kit &#8594; Software only install</text>
  <text x="96" y="372" fill="#ffffff" font-size="24">&#8594; omspatcher apply -bitonly &#8594; binaries at RU12</text>

  <!-- Band 2 -->
  <rect x="800" y="258" width="330" height="132" rx="10" fill="#3a1f24" stroke="#c74634" stroke-width="2"/>
  <text x="826" y="296" fill="#ff9e8a" font-size="19" letter-spacing="2">THE WINDOW</text>
  <text x="826" y="336" fill="#ffffff" font-size="24">Stop the stack</text>
  <text x="826" y="372" fill="#ffffff" font-size="24">Run ConfigureGC.sh</text>

  <!-- Divider -->
  <line x1="70" y1="432" x2="1130" y2="432" stroke="#2d6a8f" stroke-width="1"/>

  <!-- Facts -->
  <text x="70" y="482" fill="#8fb8d6" font-size="19" letter-spacing="2">THE GOTCHA</text>
  <text x="70" y="524" fill="#ffffff" font-size="25">Starting at 13.5 RU28 or later, the 24ai target must be RU06 or later.</text>
  <text x="70" y="560" fill="#ffffff" font-size="25">Upgrade End-to-End configures at base 24.1, so it cannot get you there.</text>

  <text x="70" y="600" fill="#6f9fc0" font-size="19">Home lab &#183; 203 targets &#183; 6 agents &#183; non-CDB repository on 19.32</text>
