---
# ---------------------------------------------------------------------------
# Single source of truth for hostnames, paths, versions. Every template and
# response file in this repo reads from here — edit here, not in ten places.
#
# OS: Oracle Linux 7 — see docs/known-risks.md #1 for the certification boundary
# this project is deliberately working within (right for this phase and Phase 2,
# not certified for the later 26ai upgrade — that migration is planned, not
# solved, in this phase).
# ---------------------------------------------------------------------------

# --- Cluster identity -------------------------------------------------------
cluster_name: usatclust1
db_name: apexdb
db_unique_name: apexdb
sid_prefix: apexdb          # instances become apexdb1 / apexdb2

domain: usat.com

# --- Node network (must match docs/network-and-hosts.md exactly) -----------
# OL7 uses classic eth-style interface naming, not enp0sN.
# eth0: NAT, DHCP — admin/internet access only, not part of the Oracle design
# eth1: Host-Only Adapter — PUBLIC cluster network (public_ip/vip_ip below),
#       gateway 192.168.56.1, DNS search domain usat.com
# eth2: Internal Network "intnet" — PRIVATE interconnect (priv_ip below), no
#       gateway. Must be the exact same internal network NAME string on both
#       VMs (VirtualBox host-side VBoxManage setting, not an Ansible/guest-OS
#       var) — see docs/known-risks.md #11: if it doesn't match, the
#       private interconnect silently doesn't work at all.
nodes:
  - { name: oradbserv05, public_ip: 192.168.56.181, vip_name: oradbserv05-vip, vip_ip: 192.168.56.191, priv_name: oradbserv05-priv, priv_ip: 192.168.2.181 }
  - { name: oradbserv06, public_ip: 192.168.56.182, vip_name: oradbserv06-vip, vip_ip: 192.168.56.192, priv_name: oradbserv06-priv, priv_ip: 192.168.2.182 }

public_gateway: 192.168.56.1
public_netmask: 255.255.255.0
private_netmask: 255.255.255.0

scan_name: scan-usatclust1
# 3 real IPs, all resolving to the same name via BIND round-robin — see
# ansible/roles/dns_bind. This is what actually gives SCAN its load-balancing/failover
# behavior; a single static IP does not.
scan_ips:
  - 192.168.56.201
  - 192.168.56.202
  - 192.168.56.203
scan_port: 1521

# primary_scan_ips / primary_nodes — stable, NEVER-overridden duplicates of the
# values above/below, needed so roles/os_prep/templates/hosts.j2 can render the
# PRIMARY cluster's SCAN + node/VIP entries unconditionally on every host,
# including standby_nodes ones. `nodes`/`scan_ips` themselves get redirected by
# group_vars/standby_nodes.yml to mean "this host's own cluster" — referencing
# them here via "{{ nodes }}"/"{{ scan_ips }}" would NOT work as a stable alias:
# Jinja resolves that reference at USE time against each host's already-merged
# variables, so it would silently pick up the override too. A literal duplicate
# is the only safe option — see docs/known-risks.md #86 for the bug this fixes
# (oradbserv09/10's /etc/hosts was missing usatclust1's SCAN entries entirely,
# because the template's only "primary SCAN" source was the redirected scan_ips/
# scan_name, which means "usatclust2" by the time it's evaluated on a standby
# host — TNS-12545 on every primary-side TNS alias from oradbserv09/10 until
# James diagnosed it by hand).
primary_scan_ips:
  - 192.168.56.201
  - 192.168.56.202
  - 192.168.56.203
primary_nodes:
  - { name: oradbserv05, public_ip: 192.168.56.181, vip_name: oradbserv05-vip, vip_ip: 192.168.56.191, priv_name: oradbserv05-priv, priv_ip: 192.168.2.181 }
  - { name: oradbserv06, public_ip: 192.168.56.182, vip_name: oradbserv06-vip, vip_ip: 192.168.56.192, priv_name: oradbserv06-priv, priv_ip: 192.168.2.182 }

# --- Standby cluster (Data Guard target, Phase 2) ---------------------------
# Documented now so the addressing scheme isn't lost, but NOT built by this phase's
# playbooks — phase-01 only provisions the primary cluster above. Same 3-NIC pattern.
standby_cluster_name: usatclust2
standby_nodes:
  - { name: oradbserv09, public_ip: 192.168.56.184, vip_name: oradbserv09-vip, vip_ip: 192.168.56.194, priv_name: oradbserv09-priv, priv_ip: 192.168.2.184 }
  - { name: oradbserv10, public_ip: 192.168.56.185, vip_name: oradbserv10-vip, vip_ip: 192.168.56.195, priv_name: oradbserv10-priv, priv_ip: 192.168.2.185 }
standby_scan_name: scan-usatclust2
standby_scan_ips:
  - 192.168.56.211
  - 192.168.56.212
  - 192.168.56.213

# --- Data Guard naming convention (Phase 2 build — RMAN duplicate, Net config, -----
# Broker, FSFO — SOP sections 10-13 / uploaded standby_dataguard_creation.txt) -----
# Primary's DB_UNIQUE_NAME stays apexdb (same as db_unique_name above), NOT the
# uploaded SOP's proposed apexdb_pri rename — James confirmed keeping it rather
# than take on a full srvctl remove/re-add cycle (the real, documented procedure
# for renaming DB_UNIQUE_NAME on an already-registered RAC database — a plain
# bounce alone, as the SOP's section 5.4 literally says, leaves CRS still
# tracking the old name) purely for a naming preference. The SOP's own section
# 5.4 explicitly allows this: "If you cannot change DB_UNIQUE_NAME now, keep the
# existing value... just ensure the standby uses a different DB_UNIQUE_NAME." See
# docs/known-risks.md #76.
#
# Every other name below substitutes the SOP's "apexdb_pri" for plain "apexdb"
# throughout (TNS alias, redo transport service, dg_broker_config_file paths) —
# db_unique_name/db_name above already ARE apexdb, so nothing new to define for
# the primary side; these vars exist for the STANDBY-side and shared (broker,
# role service) names only.
dg_standby_db_unique_name: apexdb_stby
dg_primary_role_service_rw: "{{ db_name }}_rw"                # apexdb_rw
dg_primary_role_service_ro: "{{ db_name }}_ro"                # apexdb_ro
dg_broker_config_name: "{{ db_name }}_dg"                     # apexdb_dg — DGMGRL
# configuration name, a different namespace from any tnsnames.ora alias — not a
# real collision, and it's the standard real-world Data Guard naming convention,
# not sloppiness.
#
# REMOVED: dg_primary_redo_service ("apexdb_dg") / dg_standby_redo_service
# ("apexdb_stby_dg") — these used to feed log_archive_dest_2 on both sides.
# James tested live and found the plain aliases (apexdb / apexdb_stby) work
# correctly for redo transport once apexdb_stby itself also carries (UR=A) —
# see dataguard_net_config's tnsnames.ora block below — so the separate _dg
# suffixed service names are no longer needed for this purpose. Removed
# outright rather than left unused, per this project's own precedent (see
# docs/known-risks.md #75 for the same "remove, don't just stop calling it"
# reasoning). log_archive_dest_2 on both roles now references
# db_unique_name / dg_standby_db_unique_name directly. See known-risks.md #115.

# --- Phase 2 (Oracle Net config) support vars --------------------------------
# dataguard_net_config runs against BOTH clusters at once (dg_db_nodes = rac_nodes
# + standby_nodes) and every node needs BOTH clusters' SCAN addresses in its
# tnsnames.ora — so these can't reuse scan_name/standby_scan_name as-is.
# standby_scan_name is already stable (never overridden by any group_vars file),
# but scan_name IS overridden by group_vars/standby_nodes.yml to equal
# standby_scan_name for hosts in that group — using it here would silently give
# the wrong value depending on which host evaluates the template. primary_scan_name
# is a new, deliberately never-overridden var for exactly this reason.
primary_scan_name: scan-usatclust1
dg_primary_scan_fqdn: "{{ primary_scan_name }}.{{ domain }}"    # scan-usatclust1.usat.com

# dg_standby_scan_fqdn — now the LIVE target for apexdb_stby/apexdb_stby_DGMGRL
# once apexdb_stby is CRS-registered (Phase 6, dataguard_convert_rac, has
# run). Originally deliberately unused: James confirmed directly (real test,
# managed recovery working) that SCAN did NOT work for apexdb_stby before
# Phase 6 ran — the standby database wasn't CRS-registered yet, so nothing
# had dynamically registered apexdb_stby's service with usatclust2's SCAN
# listeners (known-risks.md #105/#106/#115). dataguard_net_config now checks
# apexdb_stby's real CRS registration state at run time (srvctl config
# database, delegated to the standby's own node1 — see that role's own
# comment block) and picks this var once registered, dg_standby_node1_fqdn
# before. James's own live failover test (killing oradbserv09, redo shipping
# to apexdb_stby breaking entirely rather than failing over to oradbserv10)
# is exactly why this switch matters — SCAN is what makes redo transport
# actually RAC-aware. See docs/known-risks.md #134.
dg_standby_scan_fqdn: "{{ standby_scan_name }}.{{ domain }}"    # scan-usatclust2.usat.com

# The standby's own node hostname — what apexdb_stby/apexdb_stby_DGMGRL connect
# through BEFORE apexdb_stby is CRS-registered (see dg_standby_scan_fqdn's
# comment above for the full switch logic). standby_nodes[0] is oradbserv09
# — the same node dataguard_standby_prep starts the auxiliary instance on
# and dataguard_duplicate's AUXILIARY connection already targets directly by
# IP for the same underlying reason (known-risks.md #105/#106). This is that
# same node, referenced by hostname for tnsnames.ora rather than by raw IP.
dg_standby_node1_fqdn: "{{ standby_nodes[0].name }}.{{ domain }}"  # oradbserv09.usat.com

# --- Standby password file method (known-risks.md #116) ---------------------
# copy_from_primary (default): scp the PRIMARY's real, already-working
# password file out of its own ASM storage onto each standby node's local
# filesystem — James's direct fix, and the textbook-correct Data Guard
# approach (Oracle's own docs describe copying the primary's password file
# to every standby, specifically so SYS's hash and any other privileged-user
# entries stay identical across primary and standby — a freshly `orapwd`'d
# file only ever has SYS, with whatever password was passed at creation
# time). orapwd (the previous approach, known-risks.md #108) is kept as an
# explicit, selectable fallback, not deleted — set
# `-e dg_pwfile_method=orapwd` to use it instead. Do not confuse this with
# the ASM-tagged pwcopy/pwcreate chain #108/#112 already removed — that
# approach tried to make the STANDBY's own ASM storage discoverable via
# db_unique_name tagging, which needs a CRS resource that doesn't exist yet;
# this approach only ever touches the PRIMARY's ASM (already CRS-registered,
# already working) to read a file, then writes it to the standby's plain OS
# filesystem — the same $ORACLE_HOME/dbs/orapw$ORACLE_SID location #108
# confirmed the kernel actually authenticates against, just with real
# copied content instead of freshly generated content.
dg_pwfile_method: copy_from_primary

# How long (minutes) Flashback Database can rewind — James increased this
# from the original 24h (1440) to 3 days (4320) on both the primary and the
# standby after Phase 4. A plain int, not a dg_*-namespaced name, since it's
# a general database setting rather than a Data-Guard-specific naming
# convention like the vars above it.
dg_flashback_retention_minutes: 4320  # 3 days (was 1440 / 24h)

# dg_local_db_unique_name — same redirection pattern as scan_name: this file's
# default (apexdb) is correct for rac_nodes; group_vars/standby_nodes.yml
# overrides it to dg_standby_db_unique_name (apexdb_stby). Used to build each
# node's own GLOBAL_DBNAME in its static _DGMGRL listener.ora entry — that name
# has to match the LOCAL cluster's db_unique_name, not the other cluster's.
dg_local_db_unique_name: "{{ db_unique_name }}"

# --- Standby Redo Logs (MAA formula — SOP section 4) -------------------------
# (max ORL groups per thread + 1) x threads = (2 + 1) x 2 = 6 SRL groups.
# Single-member (performance best practice, per SOP), same size as the existing
# ORLs (128MB), placed on +RECO01 only (fastest recovery-tier diskgroup in this
# lab, per the SOP's own reasoning) — not multiplexed.
dg_srl_size_mb: 128
dg_srl_groups_per_thread: 3
dg_srl_diskgroup: "{{ asm_diskgroup_reco }}"          # RECO01
# Group numbers 11-16, deliberately well clear of the primary's existing ORL
# groups (1-4, confirmed live via v$log earlier) so there's no numbering
# collision on either side.
dg_srl_group_start: 11
# Precomputed rather than left as inline arithmetic inside a Jinja string that
# also carries literal text (a task name, a PL/SQL FOR loop bound) — see
# docs/known-risks.md #79, where exactly that pattern let an unrelated YAML
# mistake silently turn dg_srl_group_start into a string instead of erroring
# loudly. Each of these is its own single-expression var, which Ansible
# evaluates as a real Jinja expression (preserving int type) rather than a
# string template with embedded arithmetic.
dg_srl_group_end: "{{ dg_srl_group_start + (dg_srl_groups_per_thread * 2) - 1 }}"    # 16
dg_srl_thread2_start: "{{ dg_srl_group_start + dg_srl_groups_per_thread }}"          # 14 — first thread-2 group number

# --- DNS (BIND) — see docs/network-and-hosts.md and ansible/roles/dns_bind ---
dns_master: oradbserv05        # primary NS, authoritative for {{ domain }}
dns_secondary: oradbserv06     # secondary NS
dns_master_ip: 192.168.56.181  # must match nodes[0].public_ip above

# --- ASMLib disk marking — which node in the cluster does it -----------------------
# Deliberately its OWN variable, not a reuse of dns_master, even though they're the
# same node (oradbserv05) for usatclust1 today. roles/asmlib_disks used to gate its
# marking tasks directly on `inventory_hostname == dns_master` — worked fine for a
# single cluster, but silently skipped ALL disk marking on usatclust2 the first time
# the role ran against standby_nodes (dns_master is oradbserv05 always, which is
# never a member of standby_nodes — the `when:` just never matched, no error, no
# disks marked, `oracleasm listdisks` correctly found 0 afterward). See
# docs/known-risks.md #52. group_vars/standby_nodes.yml overrides this to
# standby_nodes[0].name; every other group inherits oradbserv05 via dns_master here.
asm_marking_node: "{{ dns_master }}"

# --- Chrony — OEM VM is the local time master, both RAC nodes are clients ---
chrony_master_hostname: oemserver01
chrony_master_ip: 192.168.56.65

# --- /u01 storage: dedicated 75GB disk, NOT the root filesystem -------------
# os_prep's "Create OFA directory structure" task only calls `file: state=directory` —
# that creates a path on whatever filesystem currently backs it, root included, with no
# awareness of intent. Without an explicit partition/format/mount step first, /u01 ends
# up carved out of the 50GB root disk (sdb1 in this build) instead of the dedicated 75GB
# disk attached for exactly this purpose — os_prep's partition/format/mount tasks
# handle this explicitly, in order, before any directory gets created.
# u01_device is the whole, unpartitioned disk (confirm with `lsblk` — attach order at
# clone time can shift which /dev/sdX this ends up as, same caveat as asmlib_disks).
u01_device: /dev/sdc
u01_partition: /dev/sdc1
u01_fs_label: ora_soft
u01_mount_point: /u01

# --- OFA directory layout ---------------------------------------------------
oracle_base: /u01/app/oracle
db_home: /u01/app/oracle/product/12.2.0/db_1
inventory_loc: /u01/app/oraInventory

# *** SHARED ORACLE_BASE — grid and oracle share the same base directory. ***
# grid_base = oracle_base = /u01/app/oracle, set 2026-08-09. grid_home
# (/u01/app/grid/19.3.0) is a completely separate top-level path, not a subdirectory of
# this shared base at all — so the "Grid home must not be under an Oracle base
# directory" installer check (INS-32022/INS-32026) doesn't apply by construction, not
# as an accepted risk. os_prep's OFA directory task creates this shared base once
# (owner oracle:oinstall, mode 2775/setgid so grid — a member of oinstall — can write
# into it too), not as two separate oracle_base/grid_base entries.
#
# GI VERSION: 19.3 base + RU 19.24 (directory segment below is 19.3.0, not the
# product/<version>/db_1 shape used for the DB home), NOT 12.2.0.1 — a deliberate,
# independent-version design, not a workaround — see docs/known-risks.md #2. GI and
# DB homes are fully independent, a normal supported Oracle pattern; db_home below
# stays 12.2.0.1.
grid_home: /u01/app/grid/19.3.0
grid_base: /u01/app/oracle

# Staging directory — dual ownership (oracle:oinstall, 2775) so both the oracle and
# grid users can write to it; they share the oinstall group already.
staging_dir: /u01/app/oracle/staging

# verify_baseline's ASMLib package/service checks are only meaningful once the
# asmlib_disks role has actually run — which, per site.yml's build order and
# docs/golden-image-and-cloning.md, is AFTER both of verify_baseline's normal call
# sites. Leave this false for the normal pre-clone/post-clone verify runs (ASMLib gaps
# are still reported, just not treated as failures); pass
# `-e verify_asmlib_disks=true` on the command line once asmlib_disks has run (packages,
# service config, AND disk marking all actually done) and you want that covered too.
verify_asmlib_disks: false

# --- OS accounts -------------------------------------------------------------
# GIDs 54321-54326 and 54330 are NOT free real estate — oracle-database-preinstall-19c
# (installed earlier in this role) creates its own SYSDBA/SYSOPER/SYSBACKUP/SYSDG/SYSKM/
# SYSRAC groups and claims those GIDs before this task ever runs:
#   oinstall=54321  dba=54322  oper=54323  backupdba=54324  dgdba=54325  kmdba=54326  apexdba=54330
# (confirm on any node with `id oracle` right after the preinstall RPM installs). The
# original ASM GIDs here (54323-54326) collided head-on with the RPM's oper/backupdba/
# dgdba/kmdba — that's what produced "groupadd: GID already exists" / "groupmod: GID
# already exists" failures, not an idempotency bug in the group task. asmadmin/asmdba/
# asmoper aren't created by the preinstall RPM at all (it doesn't know this node is
# getting Grid Infrastructure/ASM), so they get the next free block, 54327-54329.
# oper is left pointed at the RPM's own value (54323) instead of being reassigned —
# renumbering a group the preinstall RPM already created and already put the oracle
# user into is unnecessary churn. See docs/known-risks.md for the full writeup.
grid_user: grid
oracle_user: oracle
oinstall_gid: 54321
dba_gid: 54322
oper_gid: 54323       # matches what oracle-database-preinstall-19c already created — do not move
asmadmin_gid: 54327
asmdba_gid: 54328
asmoper_gid: 54329

# vboxsf: created by the VirtualBox Guest Additions installer (VBoxLinuxAdditions.run),
# GID varies by install — os_prep ensures the group exists (idempotent either way) and
# adds oracle/grid to it so both software owners can read/write host-shared folders
# (staging media dropped in via a VirtualBox shared folder, for example).
vboxsf_group: vboxsf

# --- ASM disks — ASMLib -------------------------------------------------------
# Classic ASMLib v2: kmod-oracleasm and oracleasm-support are natively available via
# yum on OL7. oracleasmlib is NOT reliably in the public yum channels — it's only
# guaranteed via ULN (needs an active support subscription) or a manual download from
# oracle.com/linux/downloads; confirmed via a real "No package matching 'oracleasmlib'
# found" failure, corrected in known-risks.md #21. Two competing kmod packages exist
# in principle (kmod-oracleasm for UEK vs kmod-redhat-oracleasm for the Red Hat
# Compatible Kernel) — this project runs UEK, so kmod-oracleasm is correct here.
# Packages install as part of `os_prep` (golden image, once, pre-clone) rather than
# in `asmlib_disks` — only the disk marking/service config genuinely has to wait for
# both real nodes to exist, package installation doesn't. See docs/known-risks.md #4.
use_asmlib: true
asm_disk_size_gb: 50
# Device paths below are placeholders — real /dev/sdX paths depend on attach order at
# clone time (see ../../phase-01-foundation-2node-rac-12cR2/docs/golden-image-and-cloning.md);
# confirm with `lsblk` on the actual node before running the asmlib role.
asmlib_disks:
  - { label: ASMDISK01, device: /dev/sdd }
  - { label: ASMDISK02, device: /dev/sde }
  - { label: ASMDISK03, device: /dev/sdf }
  - { label: ASMDISK04, device: /dev/sdg }
  - { label: ASMDISK05, device: /dev/sdh }
  - { label: ASMDISK06, device: /dev/sdi }
# Normally empty — a one-time from/to relabel pass (`oracleasm renamedisk`) that
# only runs when non-empty. group_vars/standby_nodes.yml sets this to migrate
# usatclust2's disks from this file's ASMDISK0N convention to its own SASMDISK
# convention, since those disks were already createdisk'd under ASMDISK0N
# before that convention was settled. See known-risks.md #74.
asmlib_disks_rename_from: []
# TWO diskgroups only — DATA01 and RECO01. There is no DATA02 in this project's
# design; confirmed directly by James (see docs/known-risks.md #75), and
# consistent with earlier real evidence already in this doc — a real `kfod`
# listing on usatclust1 showed DATA02 never actually existed there either. The
# disk previously earmarked for a DATA02 (ASMDISK04) now goes to RECO01 instead
# — RECO01 is 3 disks (04/05/06), not 2. DATA01 (created during gridSetup.sh
# itself — hosts OCR/voting + primary datafiles, the only diskgroup GI's
# response file can create at install time) is still 3 disks (01/02/03).
# RECO01 is created afterward via asmca, once the cluster is up — see
# grid_silent_install/tasks/main.yml.
#
# asm_redundancy — CHANGED from EXTERNAL to NORMAL. The original reasoning here
# ("single physical host, no real storage-level redundancy underneath either
# way") was WRONG — James confirmed directly that the underlying .vdi files for
# SASMDISK1-6 are actually spread across genuinely separate physical disks on
# the VirtualBox host, not one shared physical disk. That means ASM two-way
# mirroring across failure groups DOES provide real protection here (a single
# physical disk failing only takes out the VDIs on that one drive), the same
# real property DATA01's NORMAL redundancy already relies on. Discovered while
# diagnosing a real ORA-15081/ASMB-stuck failure on oradbserv09 that turned out
# to be host memory exhaustion (unrelated to redundancy), not caused by this —
# but the redundancy mismatch was still worth fixing once the real disk layout
# was confirmed. See docs/known-risks.md #110.
asm_redundancy: NORMAL
# DATA01 gets its own, separate redundancy setting (NORMAL, not EXTERNAL like
# RECO01 above) — a deliberate choice to demonstrate the voting-quorum
# mechanism (see docs/known-risks.md #9) for the certification showcase. NORMAL
# needs 3 failure groups for voting (crsctl replace votedisk requires an odd
# quorum count); grid_install.rsp.j2 derives one failure group per disk
# (FG_<label>) from asm_diskgroup_data_disks below — no separate
# failure-group-name list needed.
asm_diskgroup_data_redundancy: NORMAL
asm_diskgroup_data: DATA01                          # name kept as asm_diskgroup_data — grid_install.rsp.j2 reads this one for the install-time diskgroup
asm_diskgroup_data_disks: [ASMDISK01, ASMDISK02, ASMDISK03]   # 3 disks — NORMAL needs 3 failure groups for voting
# CONFIRMED 2026-08-12 against the real cluster (kfod / crsctl both show it as
# "RECO01", not "RECO" — ora.RECO01.dg is the actual registered resource name).
# See docs/known-risks.md #43 — this var previously said RECO, which doesn't match
# what asmca actually created, and broke dbca_gp_noncdb.rsp.j2 with DBT-06002.
asm_diskgroup_reco: RECO01
asm_diskgroup_reco_disks: [ASMDISK04, ASMDISK05, ASMDISK06]   # FRA — 3 disks, no DATA02 (see #75)

# --- OCR / voting disk / GIMR placement ---------------------------------------
# OCR gets its redundancy from DATA01's own NORMAL setting (3 failure groups,
# same mechanism voting relies on — see docs/known-risks.md #9) — there is no
# second diskgroup to multiplex a further OCR copy into, since there is no
# DATA02 (see #75). This project used to multiplex OCR to a DATA02 that never
# actually existed; that step is removed now, not just skipped.
#
# Voting disks do NOT work the same way — see docs/known-risks.md #9 for the full
# mechanics. `crsctl replace votedisk` targets exactly ONE diskgroup; the number of
# voting files Oracle creates is dictated entirely by THAT diskgroup's own redundancy
# (EXTERNAL=1, NORMAL=3 failure groups, HIGH=5) — there is no "vote #1 in DATA01,
# vote #2 in DATA02" configuration, Oracle doesn't support spanning voting files
# across separate diskgroups. DATA01 runs NORMAL/3 disks here specifically to get 3
# real voting files rather than 1 — on a single VirtualBox host the failure-group
# isolation is largely theoretical (all 3 "failure groups" sit on the same physical
# storage underneath), but it's a deliberate choice to demonstrate the mechanism
# rather than optimize purely for this lab's actual fault-tolerance ceiling.
#
# GIMR (Grid Infrastructure Management Repository / MGMTDB) is disabled — a
# lab-scale resource tradeoff, not a technical requirement either way.
# configure_gimr below is read by grid_install.rsp.j2
# (oracle.install.crs.configureGIMR).
configure_gimr: false

# --- Software / patch staging (populate once you've downloaded from MOS) ---
# GI is 19.3 base media + a 19c RU (NOT 12.2 media — see the grid_home comment above and
# docs/known-risks.md #2). DB stays 12.2.0.1 media + a 12.2 DBPSU.
gi_software_zip: "{{ staging_dir }}/software/LINUX.X64_193000_grid_home.zip"
db_software_zip: "{{ staging_dir }}/software/linuxx64_12201_database.zip"

# GI RU: Patch 39467003 — GI Release Update 19.32.0.0.260721. Still confirm current on
# MOS before a real build — this project deliberately doesn't treat any patch number as
# permanently current (see docs/patching-strategy.md); this is what was on hand as of
# 2026-08-08, not a claim that it stays the latest.
#
# This is a COMBO/bundle patch, not a flat RU — p39467003_190000_Linux-x86-64.zip
# unzips into 39467003/ containing five separate MOS patch numbers as subdirectories:
#   39472050  Database Release Update 19.32.0.0.260721 (Oracle home only if non-RAC;
#             BOTH Oracle home and Grid home for RAC, which this project is)
#   39526364  OCW Release Update 19.32.0.0.260721 (both Oracle home and Grid home)
#   39503034  ACFS Release Update 19.32.0.0.260721 (Grid home only)
#   39107855  Tomcat Release Update 19.0.0.0.0 (Grid home only)
#   39107825  DBWLM Release Update 19.0.0.0.0 (Grid home only)
# gi_ru_patch_path points at the TOP-level 39467003 directory, not any single component
# — gridSetup.sh's -applyRU is designed to auto-discover and apply every component
# patch found inside a combo directory in one pass; no need to enumerate them.
#
# gi_ru_zip is Oracle's OWN MOS download filename (p<patch_id>_<version>_<platform>.zip)
# — patch_before_config checks/unzips THIS, not a renamed "{{ gi_ru_patch_id }}.zip".
# Don't rename what MOS gives you to match the patch ID; update this variable instead
# when the patch number changes (e.g. a newer quarterly GI RU).
gi_ru_patch_id: "39467003"
gi_ru_patch_path: "{{ staging_dir }}/patches/{{ gi_ru_patch_id }}"
gi_ru_zip: "{{ staging_dir }}/patches/p39467003_190000_Linux-x86-64.zip"

# gi_apply_ru — controls whether grid_silent_install's Phase A gridSetup.sh call
# includes -applyRU, and whether the OPatch-update tasks run at all. TRUE here
# (usatclust1/rac_nodes) because that's a genuine fresh install from base media —
# it needs both. group_vars/standby_nodes.yml overrides this to FALSE: usatclust2's
# GI home arrives via gi_db_home_clone (tar/untar from oradbserv05's ALREADY-patched
# home, not fresh media) — there's no RU to apply and no OPatch/RU zip staged on
# oradbserv09/10 at all, so both would be not just redundant but a hard failure
# (the OPatch-zip stat check would fail closed with nothing staged there). See
# docs/known-risks.md #65 for the full reasoning — confirmed against Oracle's 19c
# Clusterware Administration and Deployment Guide's own "Creating a Cluster by
# Cloning Oracle Clusterware" chapter, which describes running gridSetup.sh against
# the already-deployed, already-patched home with no re-patching step.
gi_apply_ru: true

# DB RU: Patch 33559966 — Combo of OJVM Component RU 12.2.0.1.220118 + GI (DB) Jan 2022
# RU 12.2.0.1.220118. Same currency caveat as above — 12.2.0.1 is past Premier Support
# (see docs/known-risks.md #15), so "current" here means the latest that was actually
# available for it, not a moving target the way the 19c GI RU is.
#
# CORRECTED 2026-08-12 (known-risks.md #35/#38) — neither -applyRU nor -applyOneOffs
# is supported by the 12.2.0.1 Database installer at all ([INS-04003], confirmed
# against a real run). db_silent_install now does a plain, unpatched software-only
# install; both components below are applied AFTER install+root.sh, directly against
# the real db_home, via opatchauto (both are System Patches — plain `opatch apply`
# refuses them with "This command doesn't support System Patch", also confirmed
# against a real run) — left as a manual, watched pause in db_silent_install rather
# than an automated Ansible task (see that role's PAUSE task and known-risks.md #38
# for why, and the exact per-node commands):
#   33559966/33583921  the RU/PSU — db_ru_patch_path points at this. Applied via
#                       `opatchauto apply` from GRID_HOME/OPatch, on EACH node.
#   33559966/33561275  OJVM Release Update 12.2.0.1.220118 — db_ojvm_patch_path
#                       points at this. Applied via `opatchauto apply ... -oh
#                       $ORACLE_HOME -nonrolling` from DB_HOME/OPatch, on EACH node
#                       (OJVM is a documented nonrolling patch type). This only
#                       patches db_home's binaries; the SQL-level half (`datapatch`)
#                       runs automatically as part of dbca_noncdb's DBCA call
#                       (documented Oracle behavior for DBCA-created databases since
#                       12.2.0.1 — NOT a separate manual step at that point).
#                       dbca_noncdb verifies that automatic run landed cleanly rather
#                       than assuming it did — see docs/patching-strategy.md
#                       mechanism 3 for why (the General_Purpose.dbc seed-template
#                       caveat).
#
# db_ru_zip, same reasoning as gi_ru_zip above: Oracle's own MOS download filename,
# checked/unzipped as-is by patch_before_config — not renamed to "{{ db_ru_patch_id }}.zip".
db_ru_patch_id: "33559966"
db_ru_patch_path: "{{ staging_dir }}/patches/{{ db_ru_patch_id }}/33583921"
db_ru_zip: "{{ staging_dir }}/patches/p33559966_122010_Linux-x86-64.zip"
db_ojvm_patch_id: "33561275"
db_ojvm_patch_path: "{{ staging_dir }}/patches/{{ db_ru_patch_id }}/{{ db_ojvm_patch_id }}"

# OPatch itself (MOS patch 6880880) — NOT a Release Update, so it does not go through
# patch_before_config's generic patches/ staging + -applyRU flow. Each RU's README
# specifies a minimum OPatch version; the OPatch bundled with the base install media is
# often below that minimum, so this needs to be unzipped INTO the home's OPatch
# directory (overwriting it) before -applyRU runs — grid_silent_install/db_silent_install
# do this right after extracting the software, before invoking gridSetup.sh/runInstaller.
# Download separately per release line from MOS — these are two different zips despite
# sharing the same base patch number:
#   GI (19.3.0): p6880880_230000_LINUX.zip — NOTE this is labeled for the 23.0.0.0.0
#     release line, not 19.0.0.0.0; Oracle's own guidance is normally to select "OPatch
#     for DB 19.0.0.0.0" specifically for a 19c home, but grabbing the newest available
#     OPatch build across release lines is common practice since OPatch itself is
#     largely version-agnostic in recent releases. Confirm with `opatch version` after
#     unzipping into grid_home before trusting this for a real build.
#   DB (12.2.0.1): p6880880_122010_Linux-x86-64v12.2.0.1.40.zip — filename as provided;
#     the "v12.2.0.1.40" suffix is unusual formatting (likely the OPatch version number
#     appended to the filename) — verify this matches the actual file downloaded from
#     MOS patch 6880880 before relying on it.
gi_opatch_zip: "{{ staging_dir }}/patches/p6880880_230000_LINUX.zip"
db_opatch_zip: "{{ staging_dir }}/patches/p6880880_122010_Linux-x86-64v12.2.0.1.40.zip"

# cvuqdisk — cluvfy's own ASM-discovery helper package, NOT part of the preinstall
# RPM's package list and not published in any yum repo (it ships only inside the GI
# media itself, under grid_home/cv/rpm/). Without it, cluvfy fails every run with
# PRVG-11550 "Package cvuqdisk is missing" on BOTH nodes — see docs/known-risks.md
# #7. Filename below is the exact
# one that ships in the 19.3 base GI media used by this project — if the GI base
# media version ever changes, confirm this still matches `ls $GRID_HOME/cv/rpm/`
# before trusting it.
cvuqdisk_rpm_filename: "cvuqdisk-1.0.10-1.rpm"

# --- Target database ---------------------------------------------------------
db_template: General_Purpose.dbc
db_is_cdb: false
db_character_set: AL32UTF8
db_national_character_set: AL16UTF16
db_memory_percentage: 40     # % of node RAM DBCA sizes SGA+PGA to — tune per actual VM RAM

# --- Passwords — placeholders only. Never commit real values. -------------------
# sys_password covers SYS/SYSASM/ASM-monitor (grid_install.rsp.j2) and SYS/DBSNMP
# (dbca_gp_noncdb.rsp.j2); system_password covers SYSTEM. Both were previously
# committed here as literal weak values ("sys"/"system") — fine functionally for a
# fully NAT-isolated lab, but not something to leave sitting in git history on a
# public repo (see docs/known-risks.md #45). Override per-run instead, without
# editing this file:
#   ansible-playbook ... -e sys_password='real_value' -e system_password='real_value'
# or, for something that persists across runs without being committed, create
# group_vars/all_local.yml (gitignored) with just these two keys — Ansible merges
# group_vars files automatically, last-loaded wins. ansible-vault is the correct
# answer for anything beyond a single-host home lab; not set up here since every
# `ansible-playbook` invocation in this SOP would then need --ask-vault-pass too.
sys_password: "CHANGE_ME_sys_password"
system_password: "CHANGE_ME_system_password"

# Data Guard Phase 9 (Fast-Start Failover) — protects the Oracle Wallet on
# oemserver01 that holds the Observer's own sys/apexdb_DGMGRL and
# sys/apexdb_stby_DGMGRL credentials (mkstore's own wallet password, not an
# Oracle account password). Same placeholder-and-assert convention as
# sys_password above — pass the real value via -e dg_observer_wallet_password='...'.
dg_observer_wallet_password: "CHANGE_ME_observer_wallet_password"

# FastStartFailoverThreshold, in seconds — how long both the Observer AND the
# standby must independently lose contact with the primary before an
# automatic failover triggers. 30 is Oracle's own documented default;
# tunable per-lab without any other role/script changes.
dg_fsfo_threshold_seconds: 30

# --- oemserver01 (observer_nodes) vars — live HERE, not in a per-group file -
# Originally in group_vars/observer_nodes.yml, following group_vars/
# standby_nodes.yml's redirection pattern. First real run showed why that
# doesn't work for dataguard_fsfo: it's hosts: localhost + delegate_to (same
# pattern as dataguard_broker/dataguard_role_services), and group_vars/
# <group>.yml only auto-loads for hosts actually IN that inventory group —
# localhost isn't a member of observer_nodes, so a delegated task templating
# fsfo_dir failed with "'fsfo_dir' is undefined" even though the task itself
# correctly ran on oemserver01. db_home/sid_prefix/oracle_user/staging_dir
# above work from localhost-hosted delegate_to roles only because they live
# in this same all.yml, not in a per-group file — same fix applied here.
# See group_vars/observer_nodes.yml for the full explanation.
#
# Deliberately NOT reusing db_home/staging_dir themselves: oemserver01 is a
# pre-existing OEM 13.5 VM outside this project's build, running its own,
# unrelated 19.3.0 Oracle Client (19.19 DGMGRL, confirmed via `dgmgrl`
# banner on 2026-08-18) — reusing db_home here would be actively wrong
# (wrong version, wrong path). New, dedicated names instead, used only by
# roles/dataguard_fsfo.
observer_oracle_home: /u01/app/oracle/product/19.3.0/db_1   # confirmed live via `echo $ORACLE_HOME`

# Observer state/log directory and wallet directory — both already created
# manually on oemserver01 (mkdir -p, chown oracle:oinstall); dataguard_fsfo
# re-asserts both idempotently via the file module (skip if present, create
# if missing) rather than assuming they'll always already be there.
fsfo_dir: /opt/oracle/fsfo
fsfo_wallet_dir: /opt/oracle/wallets

# Explicit observer name, not left anonymous — 12.2 supports up to 3
# simultaneous observers (one master, others backup), and the project's own
# stated plan is a second observer on oradbserv04 later, once that node
# exists. Naming this one now means `SHOW OBSERVERS` can tell them apart
# from day one instead of needing a rename later.
dg_observer_name: oemserver01_observer

use_ignore_prereq: false   # not needed — 19.3 GI base and 12.2.0.1 DB are both natively certified on OL7

# db_silent_install-ONLY, deliberately separate from use_ignore_prereq above (which
# stays false — GI's own OS-level prereq validation is genuinely fine and worth
# keeping). CONFIRMED 2026-08-12 against a real run: the 12.2.0.1 DB installer's
# bundled CVU (CVU_12.2.0.1.0) hard-fails its own mandatory "CRS Integrity" check
# (Severity:CRITICAL) with PRVF-7595/PRVG-2043, because it shells out to the legacy
# crs_stat binary — deprecated and genuinely absent from a 19c GRID_HOME
# (crs_stat: No such file or directory). This is a CVU-vs-GI version mismatch, not a
# real cluster problem: crsctl check cluster -all and crsctl stat res -t both showed
# a fully healthy cluster on both nodes at the exact time this failed. A matching
# oracle-mosc community thread (GI 19c + a 12.x DB home, same crs_stat path pattern,
# same PRVF-7595 text) confirms this isn't specific to this project's environment.
# Left true rather than patched around some other way because there's no narrower
# runInstaller flag to skip just this one check — see docs/known-risks.md #37.
db_ignore_prereq: true

# --- Preinstall RPM ----------------------------------------------------------
# PRIMARY is oracle-database-preinstall-19c — Oracle changed its preinstall-RPM
# naming convention starting with 18c, dropping the older "oracle-database-server-
# <version>-preinstall" shape (still used for 12.2 below) in favor of a flat
# "oracle-database-preinstall-<version>" name; confirmed against the actual RPM
# filename (oracle-database-preinstall-19c-1.0-3.el7.x86_64.rpm) and natively
# available via yum on OL7. Its kernel/ulimit baseline matches 12.2's, so it also
# covers the 12.2.0.1 DATABASE layer that runs on top of this 19c GI — see the
# reconciliation note in ansible/roles/os_prep/tasks/main.yml.
# preinstall_rpm here is what verify_baseline's primary rpm -q check looks for.
preinstall_rpm: oracle-database-preinstall-19c

# TRUE by default — the 12.2-specific preinstall RPM is natively available via yum
# on OL7 (see os_prep's task comment), so there's no reason to skip it: the DB layer
# gets its own native baseline for free instead of only inheriting it via the 19c RPM.
install_local_12cr2_preinstall_rpm: true

# oracleasmlib fallback — TRUE by default now (see docs/known-risks.md #21):
# oracleasmlib genuinely isn't reliably on OL7's public yum channels (ULN with an
# active subscription, or a manual download from oracle.com/linux/downloads, are the
# real distribution paths), confirmed against a real "No package matching
# 'oracleasmlib' found" failure. Path is ON THE MANAGED NODE itself (os_prep just
# `yum install`s it directly from there, no control-node copy step) — matches this
# project's actual workflow of staging manually-downloaded RPMs under /root/rpms on
# each node before running os_prep. Update the filename/version here if a different
# oracleasmlib build gets staged.
oracleasmlib_local_rpm: /root/rpms/oracleasmlib-2.0.15-1.el7.x86_64.rpm

# TRUE by default — see comment above. Set false only if a specific environment's
# yum config genuinely does carry oracleasmlib (e.g. an active ULN subscription
# channel enabled) and the local-file fallback isn't needed.
install_local_oracleasmlib_rpm: true

# compat-libcap1 — cluvfy's PRVF-7532 prereq check (`compat-libcap1-1.10`) — genuinely
# EL7-era, natively available via yum on OL7 (see os_prep's task comment, which
# installs it directly — no local file needed).

# --- Phase 6: 12.2.0.1 -> 19c rolling upgrade (Data Guard / DBMS_ROLLING) ----
# NEW 19c DATABASE home — separate from grid_home (also 19.3.0, already installed
# in Phase 1) and separate from db_home (stays 12.2.0.1 until this phase actually
# completes — db_home itself is NOT touched by this role). Same OFA shape as
# db_home, next major-version segment.
db19c_home: /u01/app/oracle/product/19.3.0/db_1
db19c_target_version: "19"   # AutoUpgrade config: upg1.target_version

# Software + patches staged by James directly (not yet downloaded via any Ansible
# task) — confirm actual presence with the role's own stat/fail-fast check before
# trusting these paths on a real run, same pattern as gi_software_zip/db_software_zip.
db19c_software_zip: "{{ staging_dir }}/software/LINUX.X64_193000_db_home.zip"
db19c_ru_patch_id: "39467003"   # same combo RU already used for GI (19.32.0.0.260721) —
# per GI RU's own comment above, this combo contains 39472050 (Database RU) which
# applies to "both Oracle home and Grid home for RAC" — so no separate DB-only RU
# zip is needed, this same combo directory covers the new 19c DB home too.
db19c_ru_patch_path: "{{ staging_dir }}/patches/{{ db19c_ru_patch_id }}"
db19c_ru_zip: "{{ staging_dir }}/patches/p39467003_190000_Linux-x86-64.zip"
# OPatch for the new 19c DB home — same zip already used for grid_home (gi_opatch_zip)
# is explicitly fine to reuse per that var's own comment ("grabbing the newest
# available OPatch build across release lines is common practice") — confirm with
# `opatch version` in db19c_home after unzipping, same as every other OPatch step
# in this project.
db19c_opatch_zip: "{{ gi_opatch_zip }}"

# AutoUpgrade jar — staged by James. Drives the actual dictionary upgrade against
# the transient logical standby once DBMS_ROLLING.START_PLAN has instantiated it
# (a later phase, not this role) — not used by db19c_software_install itself.
autoupgrade_jar: "{{ staging_dir }}/software/AutoUpgrade_25.6_build_version_25.6.251016.jar"

# =============================================================================
# Phase 7a — OEM repository database patch (roles/oem_repo_patch)
#
# Patches the OEM Management Repository from 19.19.0.0.0 to 19c RU32, because
# Oracle requires the latest database RU on the repository BEFORE upgrading
# Enterprise Manager to 24ai. See monitoring/phase-7a-repository-db-ru32.md.
#
# Reuses the SAME combo RU already downloaded for the GI build (39467003,
# 19.32.0.0.260721) rather than fetching anything new — but applies only ONE
# component of it. 39467003 contains five: 39472050 (Database Release Update),
# 39526364 (OCW), 39503034 (ACFS), 39107855 (Tomcat), 39107825 (DBWLM). The last
# three are Grid-home-only and oemserver01 has no Grid Infrastructure, so only
# 39472050 is in scope. This is NOT the -applyRU flow the GI build uses; that is
# specific to gridSetup.sh.
# =============================================================================
# CHANGED 2026-09-01. Was combo 39467003 (GI+DB, five components). Now combo
# 39618649 — OJVM Component RU 19.32.0.0.260721 + Database Jul 2026 RU
# 19.32.0.0.260721 — which is the correct combo for a database home with no Grid
# Infrastructure. It unzips into exactly two component directories:
#
#   39618649/39472050   Database Release Update
#   39618649/39222882   OJVM Component Release Update
#
# Both are applied to this home, DB RU first, then OJVM, then ONE datapatch run
# covers both. Neither README asks for a datapatch between the two applies.
oem_repo_combo_patch_id: "39618649"
oem_repo_ru_patch_id: "39472050"
oem_repo_ojvm_patch_id: "39222882"

# OJVM is in scope for this window, which settles §0.4's open question.
oem_repo_apply_ojvm: true

# =============================================================================
# Pre-apply rollback of conflicting one-off patches
# =============================================================================
# The conflict check reports ZOP-47: RU32 supersedes RU 19.19 (35042068) but the
# one-off patches layered on top of it are not carried forward. James rolled two
# of them back by hand and confirmed the sequence works:
#
#   opatch rollback -id 29213893     (DBMS_STATS ORA-01422, dbscripts only)
#   opatch rollback -id 35074478     (MERGE on 19.19 of 34932268, rdbms/rsf)
#   startup; ./datapatch; shutdown immediate
#
# ORDER IS SIGNIFICANT and is the order proven by hand — 29213893 first. Both run
# with the database DOWN; 35074478 prompts "Is the local system ready for
# patching?" and the role passes -silent so it answers itself.
#
# Only TWO of the five overlays named in the ZOP-47 report are rolled back here.
# The remaining three (35037877, 34832725, 34340632) are left to OPatch, which
# rolls back subset patches automatically as part of applying a superset — the
# behaviour both patch READMEs describe. If the post-rollback conflict re-check
# still reports a conflict, that assumption was wrong and it stops there.
#
# Set to [] to skip the whole rollback phase.
oem_repo_rollback_patch_ids:
  - "29213893"
  - "35074478"

# Re-run the conflict check after the rollback and BEFORE the apply. The
# pre-window check in the opatch phase necessarily still sees the conflicting
# one-offs, so it cannot be the gate. This one runs against the home as it will
# actually be at apply time, which makes it the meaningful check.
oem_repo_recheck_conflict_after_rollback: true

# oemserver01 is outside the phase-01 build and has its own paths. Deliberately
# NOT reusing staging_dir/db_home — same reasoning as observer_oracle_home above.
oem_repo_staging_dir: /u01/app/oracle/staging
oem_repo_ru_zip: "{{ oem_repo_staging_dir }}/patches/COMBO_OJVM_DBRU_19RU32_p39618649_190000_Linux-x86-64.zip"
oem_repo_ru_patch_path: "{{ oem_repo_staging_dir }}/patches/{{ oem_repo_combo_patch_id }}/{{ oem_repo_ru_patch_id }}"
oem_repo_ojvm_patch_path: "{{ oem_repo_staging_dir }}/patches/{{ oem_repo_combo_patch_id }}/{{ oem_repo_ojvm_patch_id }}"

# CONFIRM BEFORE THE FIRST RUN. emctl status oms -details reports the EM instance
# home beneath this path, which implies the repository database lives here. But
# observer_oracle_home above (same path) is described as an "Oracle Client", and
# inventory/hosts.ini calls it a DB Home "used only for its dgmgrl client". The
# role's preflight proves a database is actually running from it before touching
# anything, rather than trusting either description.
oem_repo_oracle_home: /u01/app/oracle/product/19.3.0/db_1

# OPatch. Reuses gi_opatch_zip by default, matching db19c_opatch_zip's pattern.
#
# RESOLVED 2026-08-31 against 39472050's own README: it names NO minimum OPatch
# version number. §3.1.3 step 3 tells you to run
# `opatch prereq CheckMinimumOPatchVersion` and read the result.
#
# UPDATED 2026-09-01: the OJVM README (39222882 §1.2) DOES name one — OPatch
# **12.2.0.1.51 or later**. That is the binding constraint for this window, since
# both patches go into the same home. The staged zip is v52, which satisfies it.
#
# Note this is its own patch zip now, not gi_opatch_zip: the GI build's OPatch is
# the 23xxxx-line download, and what this home needs is the 19.0.0.0.0 line.
oem_repo_opatch_zip: "{{ oem_repo_staging_dir }}/patches/p6880880_190000v52_Linux-x86-64.zip"
oem_repo_update_opatch: true
oem_repo_opatch_min_version: "12.2.0.1.51"

# 'opatch' or 'opatchauto'. Explicit rather than auto-detected: the two behave
# differently on failure and opatchauto needs root, so a human should decide.
#
# CONFIRMED 'opatch' 2026-08-31 against 39472050's own README, §3.2: for a
# non-RAC environment it says shut down all instances and listeners on the home,
# then `opatch apply`. Plain opatch, no opatchauto.
#
# The earlier note here — "if it refuses with 'This command doesn't support
# System Patch', switch to opatchauto" — was reasoning from this project's 12.2
# GI experience and does not transfer. The COMBO, 39467003, is a system patch;
# 39472050 is the Database RU component inside it, and is applied with plain
# opatch. oemserver01 has no Grid Infrastructure, so the combo's other components
# (ACFS, Tomcat, DBWLM) are not in scope here at all.
#
# 'opatchauto' is kept as an option only because the fallback costs nothing to
# leave in place. It should not be needed.
oem_repo_apply_mechanism: opatch

# ORACLE_BASE on oemserver01. Used to find datapatch's own logs, which Oracle's
# README §3.3.2 places at
#   $ORACLE_BASE/cfgtoollogs/sqlpatch/39472050/<unique patch ID>/
#     39472050_apply_<SID>_<CDB name>_<timestamp>.log
# The <unique patch ID> element is not derivable from the patch number, so the
# role globs the directory rather than constructing the filename.
oem_repo_oracle_base: /u01/app/oracle

# Fail the run if `opatch prereq CheckConflictAgainstOHWithDetail` returns
# non-zero. Oracle's README §3.1.3 makes this the documented gate before applying,
# and its report separates genuine CONFLICTS from SUPERSET patches — a superset is
# not a problem, a conflict needs a resolution patch from My Oracle Support
# (KB145571) before proceeding.
#
# Set false ONLY after reading the report and deciding deliberately that the
# conflict can be ignored, and write down why. It defaults true because this task
# previously swallowed its own result with `|| true`, which made it decoration.
oem_repo_conflict_check_fatal: true

# Run `datapatch -sanity_checks` before `datapatch -verbose`. Oracle's README
# calls it optional in one breath and says "Oracle highly recommends that you
# perform this step" in the next. It reports graded findings rather than
# pass/fail, so the role runs it non-fatally and tees the output into the run log.
oem_repo_datapatch_sanity_checks: true

# The blackout is created BY HAND, not by this role — it needs a SYSMAN login via
# emcli, and those credentials do not belong in this repository. The role pauses,
# you create it, you confirm, and it then verifies via the AGENT's emctl before
# shutting anything down.
#
# This gate stops the run if no blackout is visible at that point. Set false only
# if you have deliberately decided to accept an unplanned-outage record, or if the
# agent reports blackout state in a form the check does not recognise. Read the
# `emctl status blackout` output in the run log before overriding.
oem_repo_require_blackout: true

# Environment scripts already present on oemserver01, used by James interactively.
oem_repo_oms_env: /home/oracle/.env/oms_env
oem_repo_agent_env: /home/oracle/.env/agent_env

oem_repo_blackout_name: "ru32_patch_window"
oem_repo_restore_point: "pre_ru32"

# Logging. Every shell task echoes its commands (set -x) and tees stdout+stderr
# here. A patch you cannot reconstruct afterwards is a patch you cannot defend in
# a post-incident review. lsinventory pre/post snapshots land here too.
oem_repo_log_dir: /u01/app/oracle/logs/oem_repo_patch

# RMAN backup before patching. Compressed backupset, database plus archivelog,
# with controlfile autobackup. The repository holds the entire monitoring history
# for every target — opatch rollback and datapatch -rollback do not cover damage
# to that.
oem_repo_take_rman_backup: true
oem_repo_backup_tag: "PRE_RU32"

# Backup destination, James's call: /u03/backups/rman/<SID>/<run timestamp>.
#
# Deliberately NOT the fast recovery area. Left to RMAN's defaults the pre-patch
# backup lands in the FRA, which on this host is the same storage as the database
# it is protecting — a copy next to the original, not a restorable backup. A dated
# directory per run also means an old set is removed by deleting one directory,
# with no risk of deleting the wrong window's files.
#
# oem_run_ts is set once at the top of the role, so every file from a given run
# shares one directory.
oem_repo_backup_base: /u03/backups/rman
oem_repo_backup_dir: "{{ oem_repo_backup_base }}/{{ oem_repo_sid | default('UNKNOWN_SID') }}/{{ oem_run_ts | default('UNKNOWN_TS') }}"

# Stops the play immediately after starting the blackout and before anything is
# shut down, so the blackout can be verified independently. The blackout cannot
# be started later — `emctl start blackout` needs a live OMS — so this is the
# last moment it can be checked. Set false once the run is trusted unattended.
oem_repo_pause_after_blackout: true

# The RU zip travels oradbserv05 -> oemserver01 as a direct rsync push. The
# oracle-user SSH trust it needs is established by the first play in
# oem-repo-patch.yml, which calls the generalised ssh_equivalence role with
# ssh_equiv_sources/ssh_equiv_targets/ssh_equiv_bidirectional rather than the
# retired cross_cluster_ssh_trust — see docs/known-risks.md #141.
#
# No control-node fallback: routing a multi-GB zip through the controller twice
# is what that trust exists to avoid.

# A guaranteed restore point requires ARCHIVELOG mode and a configured fast
# recovery area. The role attempts it non-fatally; set false if this repository
# is in NOARCHIVELOG, and say so explicitly in the write-up, because the rollback
# path is then opatch/datapatch only, with no flashback fallback.
oem_repo_create_restore_point: true

# Preflight floor. 16G free on /u01 measured 2026-08-31.
oem_repo_min_free_gb: 10

# Baseline for the post-patch comparison. 43 targets reported by
# `emctl status agent` on 2026-08-31. A count that dropped after a patch is a real
# problem wearing the disguise of a successful maintenance window.
oem_repo_expected_targets: 43

# Reported, never auto-remediated. utlrp.sql is a read-and-judge call — see
# docs/patching-strategy.md Mechanism 3 for the MDSYS seed-template signature
# worth checking for.
oem_repo_invalid_threshold: 20

# FSFO must be fully down before DBMS_ROLLING.BUILD_PLAN — the broker rejects any
# attempt to even ENABLE fast-start failover while a rolling upgrade is in
# progress, confirmed against Oracle's own DBMS_ROLLING documentation. James's
# existing script (not written by this project's Ansible, already in place before
# this phase started) — assumed to live on oemserver01 (observer_nodes) since
# that's where the Observer itself runs and where fsfo_dir/fsfo_wallet_dir already
# live; confirm this path is correct on oemserver01 before the first real run.
manage_observer_script: /u01/app/oracle/scripts/monitoring/manage_observer.sh

# Phase 6 post-upgrade (roles/rolling_postupgrade_backup) — RMAN Level 0
# backup taken from apexdb_stby (the standby, post-switchback) per my own
# explicit instruction. /media/sf_rman_backups is a VirtualBox shared-folder
# mount point (sf_<foldername> is VBoxService's own naming convention for
# auto-mounted shared folders — the real shared folder is named
# "rman_backups", so it automounts directly as /media/sf_rman_backups, NOT
# nested under an intermediate /media/sf_hrman path) — assumed already
# mounted on oradbserv09/10; the role does NOT attempt to mount it, only
# fails loudly with a clear message (pointing at VirtualBox Shared Folders /
# vboxsf group membership) if it isn't there or isn't writable. Backup
# pieces land under rman_backup_base_dir/<the connecting instance's SID>
# (apexdb1 — sid_prefix is "apexdb" on BOTH clusters by this project's own
# design, see group_vars/standby_nodes.yml's own note on sid_prefix;
# db_unique_name is what actually differs, apexdb vs apexdb_stby, not the
# SID).
rman_backup_base_dir: /media/sf_rman_backups
rman_channels: 2                # CONFIGURE DEVICE TYPE DISK PARALLELISM — modest on purpose, this is a lab VM
# rman_retention_redundancy is currently DOCUMENTATION ONLY, not applied by
# roles/rolling_postupgrade_backup: that role's RMAN session connects to
# apexdb_stby (the standby), and Oracle does not allow CONFIGURE RETENTION
# POLICY (along with CONFIGURE EXCLUDE / ENCRYPTION / DB_UNIQUE_NAME) to be
# changed except when connected to the PRIMARY with a CURRENT/CREATED
# controlfile — confirmed the hard way (RMAN-05021 "this configuration
# cannot be changed for a BACKUP or STANDBY control file") the first time
# this role actually ran. Real retention therefore still defaults to
# Oracle's own REDUNDANCY 1 for backups taken this way. To actually apply
# REDUNDANCY {{ rman_retention_redundancy }}, run CONFIGURE RETENTION
# POLICY once by hand against apexdb (the primary) — it's a controlfile-wide
# persistent RMAN setting, so it applies regardless of which side (primary
# or standby) later backups connect from. Not automated here — out of scope
# for a standby-side backup job to reach across and change primary-side
# persistent configuration incidentally.
rman_retention_redundancy: 2
