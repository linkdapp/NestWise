[defaults]
inventory = inventory/hosts.ini
remote_user = ansible
host_key_checking = False
retry_files_enabled = False
roles_path = roles
stdout_callback = yaml

# Every run's full task-by-task output (same content that scrolls past in the
# terminal) is also appended to this file — nothing to opt into, it's automatic
# from the next run onward. See ../docs/ansible-architecture-and-debugging.md
# for how to read it and what else is available for troubleshooting a run.
# Gitignored deliberately: response-file diffs (if you ever add --diff) can
# contain the SYS/SYSTEM/SYSASM passwords from group_vars/all.yml.
log_path = ../logs/ansible.log

[privilege_escalation]
become = True
become_method = sudo
become_user = root
