---
# DEPRECATED 2026-08-31 — superseded by ssh_equivalence, which now takes
# sources, targets, users and a bidirectional flag and does exactly what this
# role did.
#
# This role was the same logic as ssh_equivalence hardcoded to a single pair
# (oradbserv05 -> oradbserv09) for db19c_software_install's cross-cluster copy.
# Keeping two roles meant every hard-won detail — PEM keys for gridSetup.sh's
# bundled Java client, the CheckHostIP algorithm-mismatch fix, the
# UserKnownHostsFile /dev/null regression, additive rather than wholesale
# known_hosts writes — had to be remembered and maintained in two places. It
# already drifted once: this role used additive lineinfile for known_hosts while
# ssh_equivalence used a wholesale copy, for the same reason, discovered
# separately.
#
# Migration is a straight swap. This:
#
#   - role: cross_cluster_ssh_trust
#
# becomes:
#
#   - role: ssh_equivalence
#     vars:
#       ssh_equiv_sources: ["{{ groups['rac_node1'][0] }}"]
#       ssh_equiv_targets: ["{{ groups['standby_node1'][0] }}"]
#       ssh_equiv_users: ["{{ oracle_user }}"]
#       ssh_equiv_bidirectional: false
#       ssh_equiv_include_self: false
#       ssh_equiv_manage_system_config: false
#
# Add `ssh_equiv_bidirectional: true` if the reverse direction is ever needed,
# which is what this role's own header said to build "if that changes later".
#
# Left in place rather than deleted so that upgrade-19c-rolling.yml keeps working
# until its call site is updated and re-tested. Delete this role once that is
# done.

- name: Redirect to ssh_equivalence
  debug:
    msg: >-
      cross_cluster_ssh_trust is deprecated and now delegates to ssh_equivalence.
      Update the calling playbook to invoke ssh_equivalence directly with
      ssh_equiv_sources / ssh_equiv_targets — see this file's header for the exact
      swap.

- name: Set up the trust via ssh_equivalence
  include_role:
    name: ssh_equivalence
  vars:
    ssh_equiv_sources: ["{{ ssh_trust_source_host | default(groups['rac_node1'][0]) }}"]
    ssh_equiv_targets: ["{{ ssh_trust_target_host | default(groups['standby_node1'][0]) }}"]
    ssh_equiv_users: ["{{ oracle_user }}"]
    ssh_equiv_bidirectional: false
    ssh_equiv_include_self: false
    ssh_equiv_manage_system_config: false
    ssh_equiv_purpose: "{{ ssh_trust_purpose | default(\"db19c_software_install's cross-cluster file copy\") }}"
