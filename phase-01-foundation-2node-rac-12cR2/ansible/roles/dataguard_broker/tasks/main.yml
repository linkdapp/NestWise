# Update: the switchover test used to live here, gated behind
# dg_broker_test_switchover. Pulled out into its own standalone role
# (roles/dataguard_switchover_test) — James's own call, so the test isn't
# tangled up inside this role's normal idempotent re-run path and can be
# invoked deliberately, on its own, in either direction (switch over, then
# switch back is the SAME command re-run — the role detects current
# primary/standby via SHOW CONFIGURATION rather than hardcoding a
# direction). See that role and site.yml's own "Data Guard Broker —
# switchover test" play.
