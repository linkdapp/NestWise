# ============================================================================
# 7.5 — CREATE CONFIGURATION / ADD DATABASE / ENABLE CONFIGURATION
# ============================================================================
# Update — first real run: this used to be ONE combined script gated on a
# single "does a configuration exist at all" check. That real run created
# the configuration successfully but then ADD DATABASE failed with
# ORA-16571 (see the standby broker-restart fix earlier in this file) — so
# the configuration now genuinely exists, but with only apexdb as a member,
# no standby, MaxPerformance mode by default. The old single gate would
# have permanently skipped ADD DATABASE from here on, since "a
# configuration exists" was already true. Split into three independently
# gated steps instead: CREATE CONFIGURATION gated on whether a
# configuration exists at all; ADD DATABASE gated separately on whether the
# standby specifically is already a member (checked by searching the
# earlier SHOW CONFIGURATION output for its db_unique_name); ENABLE
# CONFIGURATION always attempted last (harmless/idempotent against an
# already-enabled configuration).
- name: "Set fact: is the standby already a member of the Broker configuration (searches the SHOW CONFIGURATION output above for its db_unique_name)"
  set_fact:
    dg_broker_standby_is_member: "{{ dg_broker_show_config_raw.stdout is search(dg_standby_db_unique_name) }}"
  run_once: true

- name: "Write DGMGRL script: CREATE CONFIGURATION (apexdb_DGMGRL connect identifier — any-state connectivity for switchover/failover)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  no_log: true
  copy:
    dest: "{{ staging_dir }}/sql/dg_broker_create.dgc"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0600"
    content: |
      connect sys/{{ sys_password }}@apexdb_DGMGRL as sysdba
      create configuration {{ dg_broker_config_name }} as primary database is {{ db_name }} connect identifier is apexdb_DGMGRL;
      show configuration;
  run_once: true
  when: not dg_broker_config_exists

- name: "Run: CREATE CONFIGURATION"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    {{ db_home }}/bin/dgmgrl < {{ staging_dir }}/sql/dg_broker_create.dgc
  register: dg_broker_create_result
  run_once: true
  when: not dg_broker_config_exists

- name: Show CREATE CONFIGURATION output (password redacted)
  debug:
    msg: "{{ (dg_broker_create_result.stdout | regex_replace('sys/' ~ (sys_password | regex_escape) ~ '@', 'sys/***@')).split('\n') }}"
