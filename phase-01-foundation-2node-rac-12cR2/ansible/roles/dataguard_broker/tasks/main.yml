# ============================================================================
# 7.8 — Validate static connect identifiers (both databases) — DROPPED
# ============================================================================
# Update — first real run: tried twice, both real DGMGRL syntax attempts
# ("VALIDATE STATIC CONNECT IDENTIFIER FOR <db>" then, after getting that
# wrong the first time, the corrected word order "VALIDATE DATABASE <db>
# STATIC CONNECT IDENTIFIER") failed with the identical "Syntax error
# before or at 'static'" both times. Verified via web search rather than
# guessing a third time: "VALIDATE STATIC CONNECT IDENTIFIER FOR <db>" —
# my ORIGINAL syntax — is in fact the real, correct DGMGRL command... but
# it was introduced in Oracle Database 18c. This lab's DGMGRL is 12.2.0.1.0
# (every DGMGRL banner in every real run confirms this), predating the
# command entirely — no wording fix could have made it work on this
# release. Dropped outright rather than left broken: there is no working
# equivalent on 12.2 DGMGRL. The plain TNS-alias connectivity tests
# dataguard_net_config already runs (tnsping + a real sqlplus login via
# apexdb_DGMGRL/apexdb_stby_DGMGRL) are this project's actual static-
# identifier validation on this version — not a DGMGRL-native command, but
# the same practical guarantee (the alias resolves and authenticates).
- name: "Static connect identifier validation — not run: VALIDATE STATIC CONNECT IDENTIFIER FOR <db> requires DGMGRL 18c+, this lab is 12.2.0.1.0 (confirmed from every DGMGRL banner in this role's real runs). dataguard_net_config's own tnsping + sqlplus connectivity tests against apexdb_DGMGRL/apexdb_stby_DGMGRL are the practical equivalent on this version."
  debug:
    msg: "Skipped — see task name."
  run_once: true

