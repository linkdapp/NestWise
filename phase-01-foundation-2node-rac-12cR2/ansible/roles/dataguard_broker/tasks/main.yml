- name: "Write DGMGRL script: ADD DATABASE (apexdb_stby_DGMGRL connect identifier — any-state connectivity for switchover/failover)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
