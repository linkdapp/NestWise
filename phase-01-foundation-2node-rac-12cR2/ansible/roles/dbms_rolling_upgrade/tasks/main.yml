---
# Phase 6 (12.2.0.1 -> 19c rolling upgrade): the actual DBMS_ROLLING
# orchestration. Built and run in small, VERIFIED increments rather than one
# giant unattended playbook — confirmed against Oracle's own DBMS_ROLLING
# Concepts/Administration guide and PL/SQL API reference (both read in full,
# 2026-08-21) that there is NO rollback path once SWITCHOVER has been called
# (ROLLBACK_PLAN only works before that), and this is the only real database
# in this lab. Same "verify against real output, don't guess" discipline this
# project used throughout db19c_software_install, which needed several real
# fixes even for much lower-stakes steps than this.
#
# --- Which database is "the current primary" CHANGES mid-workflow ----------
# All DBMS_ROLLING procedures execute "at the current primary database"
# (Oracle's own words in the API doc). apexdb is primary from INIT_PLAN
# through SWITCHOVER; SWITCHOVER itself promotes apexdb_stby to primary, so
# FINISH_PLAN (built under --tags rolling_finish) runs against apexdb_stby
# instead, on standby_node1, using db19c_home there (already installed and
# patched by db19c_software_install on BOTH clusters — exactly why that role
# targeted both, not just the standby).
#
# --- No sys_password / remote DGMGRL connection needed here -----------------
# Same OS-authenticated `sqlplus / as sysdba` pattern as dataguard_fsfo's
# flashback tasks — these run locally on the primary's own node as the oracle
# OS user, not a remote DGMGRL connection, so there's no embedded password to
# redact in this role's debug output.
#
# --- Build history (kept for context, not current scope) -------------------
# This section originally described only "the safe, fully reversible front
# half": INIT_PLAN, BUILD_PLAN, and a read-only status check (safe to run at
# any point, including before a plan exists). START_PLAN — which converts
# apexdb_stby into a transient logical standby and is where the genuinely
# unverified AutoUpgrade integration begins (James chose AutoUpgrade over
# DBUA 2026-08-21; confirmed against Oracle's own docs that DBUA is the only
# tool DBMS_ROLLING's documentation actually names/validates for the
# transient-logical-standby upgrade step, and AutoUpgrade-in-this-role is
# only informally discussed/tested elsewhere, not Oracle-documented). Each
# subsequent step (rolling_autoupgrade, rolling_switchover) was scoped and
# built only after the step before it had actually run cleanly against this
# real environment and its real output had been reviewed — that discipline
# is why this comment originally said everything past BUILD_PLAN was "not
# built yet" when it was written. As of 2026-08-22: INIT_PLAN, BUILD_PLAN,
# START_PLAN, rolling_autoupgrade (AutoUpgrade against the transient
# logical standby), and rolling_switchover (DBMS_ROLLING.SWITCHOVER) are all
# built and have real run output behind them. FINISH_PLAN (rolling_finish)
# remains NOT built — see the note under "Which database is 'the current
# primary'" below for what it still needs.
#
# No SET_PARAMETER calls here — this is a plain 1-primary/1-standby-group
# topology (no LEADING/TRAILING member complexity, that only matters for 3+
# way configs), so INIT_PLAN's defaults should be sufficient. Add
# SET_PARAMETER tasks here later only if BUILD_PLAN's real output says
# otherwise — not guessed in advance.

- name: "Preflight: fail loudly if dg_standby_db_unique_name isn't what we expect before calling INIT_PLAN with it as future_primary"
  assert:
    that:
      - dg_standby_db_unique_name is defined
      - dg_standby_db_unique_name == "apexdb_stby"
    fail_msg: >-
      dg_standby_db_unique_name is '{{ dg_standby_db_unique_name | default('undefined') }}',
      expected 'apexdb_stby' — double check group_vars/all.yml before calling
      INIT_PLAN with the wrong future_primary.
  tags: [rolling_init]

- name: "Write SQL script: DBMS_ROLLING.INIT_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_init_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading off
      set feedback on
      set serveroutput on
      set tab off
      EXECUTE DBMS_ROLLING.INIT_PLAN(future_primary => '{{ dg_standby_db_unique_name }}');
      exit;
  tags: [rolling_init]

- name: "Run: DBMS_ROLLING.INIT_PLAN (against apexdb, the current primary)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_init_plan.sql
  register: rolling_init_result
  changed_when: "'ORA-' not in rolling_init_result.stdout"
  tags: [rolling_init]

- name: Show INIT_PLAN command and output
  debug:
    msg:
      - "Command (on {{ groups['rac_node1'][0] }}): {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_init_plan.sql"
      - "Script content: EXECUTE DBMS_ROLLING.INIT_PLAN(future_primary => '{{ dg_standby_db_unique_name }}');"
      - "rc: {{ rolling_init_result.rc }}"
      - "Output: {{ rolling_init_result.stdout_lines }}"
  tags: [rolling_init]

- name: "Fail loudly if INIT_PLAN reported an ORA- error (SQL*Plus returns rc 0 even on internal SQL errors — same gap this project's DGMGRL tasks already document)"
  fail:
    msg: "INIT_PLAN reported an ORA- error — read the output above before proceeding to BUILD_PLAN."
  when: "'ORA-' in rolling_init_result.stdout"
  tags: [rolling_init]

# ============================================================================
# Real gap found on the first live run: BUILD_PLAN failed outright —
# ORA-45438 "database is not in mounted mode". apexdb_stby was open
# READ ONLY WITH APPLY (Active Data Guard, confirmed live via `select
# db_unique_name,open_mode from v$database` showing exactly that) — and this
# is a documented, Oracle-acknowledged limitation, not a config mistake:
# Active Data Guard reader-farm instances are not permitted as DBMS_ROLLING
# members (Bug 25882840, "ACTIVE DATA GUARD NOT PERMITTED AS DBMS_ROLLING
# MEMBER" — confirmed via search). ALL participating instances must be in
# plain MOUNT (not open) for BUILD_PLAN to succeed, which means the apexdb_ro
# service (Active Data Guard reader farm, set up by dataguard_role_services)
# necessarily goes offline for the duration of the rolling upgrade — a real,
# expected trade-off, not a bug in this role.
#
# Fix below: reverse of dataguard_role_services' own OPEN sequence (same
# real, tested SQL syntax from that role, just CLOSE instead of OPEN) —
# cancel recovery, ALTER DATABASE CLOSE on EACH standby instance individually
# (RAC — same per-instance reasoning as that role's own OPEN loop, since each
# instance needs its own ALTER DATABASE issued in its own session), then
# resume managed recovery in mounted mode. apexdb_stby's CRS registration
# already has -startoption MOUNT -policy MANUAL (dataguard_convert_rac), so
# this only ever needs a SQL-level open/close toggle, never a full
# srvctl stop/start — nothing about the CRS resource itself changes.
#
# Idempotent: skipped entirely if apexdb_stby is already mounted-only when
# this runs (e.g., a repeat run, or if dataguard_role_services' own ADG
# open was never applied this time).
# ============================================================================
- name: "Write SQL script: check apexdb_stby's real open_mode (all instances) before BUILD_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_stby_open_mode.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      -- DATABASE_ROLE added alongside OPEN_MODE — checking open_mode alone
      -- confirms the instance is MOUNTED, but not that it's still the
      -- PHYSICAL STANDBY we think it is. Cheap, same query, and this is
      -- reused both before AND after the srvctl stop/start instance bounce
      -- above, so a role drift introduced by that bounce (wrong controlfile,
      -- wrong instance, anything unexpected) gets caught by the same check
      -- rather than needing a second query.
      set echo on
      set heading on
      set feedback off
      set linesize 200
      set pagesize 100
      set tab off
      column open_mode format a25
      column database_role format a20
      SELECT inst_id, open_mode, database_role FROM gv$database ORDER BY inst_id;
      exit;
  tags: [rolling_build]

- name: "Check apexdb_stby's real open_mode (gv$database, all instances)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_stby_open_mode.sql
  register: rolling_stby_open_mode_check
  changed_when: false
  tags: [rolling_build]

- name: Show apexdb_stby's current open_mode
  debug:
    var: rolling_stby_open_mode_check.stdout_lines
  tags: [rolling_build]

# Real bug found on the second live run: apexdb_stby was left in a genuine
# MIXED state from a prior partial attempt — instance 1 (oradbserv09) still
# READ ONLY WITH APPLY, instance 2 (oradbserv10) already MOUNTED. The old
# aggregate check below (search the whole combined query output for ANY
# "READ ONLY"/"READ WRITE" string) correctly said "not already mounted," but
# then blindly ran SHUTDOWN IMMEDIATE + STARTUP MOUNT against BOTH instances
# — including instance 2, which was already mounted and not open. Instance 2
# has nothing to shut down "immediately" from, so Oracle correctly returned
# ORA-01109 "database not open" as part of that attempt (harmless in this
# context — the instance still shut down and remounted fine right after),
# but this role's failed_when: "'ORA-' in stdout" treated that benign notice
# as a hard failure. Fixed by tracking open_mode PER INSTANCE and only
# bouncing the instances that are actually OPEN — an already-mounted
# instance is left alone entirely, so this spurious ORA-01109 can't recur.
- name: "Set fact: apexdb_stby's open_mode per instance, parsed from the query above (INST_ID -> OPEN_MODE)"
  set_fact:
    rolling_stby_open_mode_by_instance: "{{ dict(rolling_stby_open_mode_check.stdout | regex_findall('(?m)^\\s*(\\d+)\\s+(.+?)\\s*$')) }}"
  tags: [rolling_build]

# Real gap found on independent code review (2026-08-22, third-pass): this
# block used to derive each instance's real node purely from
# groups['standby_nodes'] LIST POSITION (sid: sid_prefix ~ (idx+1), node:
# the inventory hostname at that same index) — assuming inventory order
# matches real RAC instance numbering. That happens to be true for this
# lab's actual inventory (oradbserv09=instance1, oradbserv10=instance2), but
# nothing in the code itself verified it — unlike this file's own stated
# principle, applied everywhere else including the newer PREFLIGHT/
# remediation logic further down: never assume instance-to-node mapping,
# ask CRS directly. Fixed below by querying `srvctl status database` for
# the REAL sid->node mapping first, the same pattern already used later in
# this file for AutoUpgrade instance discovery — then looping over the
# ACTUAL instance IDs gv$database returned (not an assumed 1..N range) to
# build the bounce list.
- name: "Discover apexdb_stby's real instance-to-node mapping via srvctl (not inventory position)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db_home }}/bin/srvctl status database -d {{ dg_standby_db_unique_name }}"
  register: rolling_stby_srvctl_status
  changed_when: false
  tags: [rolling_build]

- name: "Show srvctl status database output (real instance-to-node mapping)"
  debug:
    var: rolling_stby_srvctl_status.stdout_lines
  tags: [rolling_build]

- name: "Set fact: real sid -> node mapping for apexdb_stby, parsed from srvctl status (not assumed from inventory order)"
  set_fact:
    rolling_stby_node_by_sid: "{{ dict(rolling_stby_srvctl_status.stdout | regex_findall('Instance (\\S+) is running on node (\\S+)')) }}"
  tags: [rolling_build]

- name: "Fail loudly if gv$database and srvctl disagree on which instances exist — something is inconsistent, don't guess"
  fail:
    msg: >-
      gv$database reports instance {{ item }} ({{ sid_prefix ~ item }}), but
      srvctl status database doesn't show that instance as running (real
      mapping found: {{ rolling_stby_node_by_sid }}). Investigate the
      mismatch manually before proceeding.
  loop: "{{ rolling_stby_open_mode_by_instance.keys() | list }}"
  loop_control:
    label: "instance {{ item }}"
  when: (sid_prefix ~ item) not in rolling_stby_node_by_sid
  tags: [rolling_build]

- name: "Set fact: apexdb_stby's individual instances that actually need a graceful bounce (currently OPEN, not just MOUNTED) — mixed-state-safe, node looked up via srvctl not inventory position"
  set_fact:
    rolling_stby_instances_to_bounce: >-
      {{ (rolling_stby_instances_to_bounce | default([])) + (
        [{ 'node': rolling_stby_node_by_sid[sid_prefix ~ item], 'sid': sid_prefix ~ item, 'instid': item }]
        if (rolling_stby_open_mode_by_instance[item] is search('READ ONLY')
            or rolling_stby_open_mode_by_instance[item] is search('READ WRITE'))
        else []
      ) }}
  loop: "{{ rolling_stby_open_mode_by_instance.keys() | list }}"
  loop_control:
    label: "instance {{ item }}"
  tags: [rolling_build]

- name: "Set fact: is apexdb_stby already mounted-only on EVERY instance (nothing needs bouncing)"
  set_fact:
    rolling_stby_already_mounted: "{{ (rolling_stby_instances_to_bounce | default([])) | length == 0 }}"
  tags: [rolling_build]

- name: "Notify — apexdb_stby is open (Active Data Guard); taking it to mounted-only before BUILD_PLAN (ORA-45438 / Bug 25882840 — ADG readers aren't permitted as DBMS_ROLLING members)"
  debug:
    msg: >-
      apexdb_stby is currently OPEN (real output above) — Active Data Guard
      reader-farm instances aren't permitted as DBMS_ROLLING members
      (ORA-45438, Oracle Bug 25882840). Taking it to mounted-only now. The
      apexdb_ro service will have nothing to serve for the rest of this
      rolling upgrade — expected, not a fault.
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

# --- Real gap found on the first live run: plain ALTER DATABASE CLOSE ------
# failed on instance 2 (oradbserv10) with ORA-1093 "Active sessions prevent
# database close operation" — confirmed live via that instance's alert log
# ("Active process ... waiting for 'SQL*Net message from client'"), almost
# certainly a session connected through apexdb_ro (or a leftover manual
# sqlplus/dgmgrl session — this lab has had plenty of those this session).
# Because instance 1 DID close successfully while instance 2 stayed open,
# the two instances ended up in an inconsistent mixed state (1 MOUNTED, 2
# READ ONLY), and the very next task (resume managed recovery) hit
# ORA-10459 "conflicting state detected" and MRP0 shut itself down as a
# direct result of that inconsistency.
#
# Fixed two ways below, not just one:
#   1. Stop the apexdb_ro service FIRST — removes the most likely source of
#      lingering client sessions before we ever attempt to touch open_mode.
#   2. Use SHUTDOWN IMMEDIATE + STARTUP MOUNT instead of ALTER DATABASE
#      CLOSE — IMMEDIATE actively disconnects any remaining sessions and
#      rolls back their work itself, rather than politely requiring them
#      gone first (which is exactly what ALTER DATABASE CLOSE demanded, and
#      why it hit ORA-1093). That sidesteps the same failure ALTER DATABASE
#      CLOSE hit without resorting to SHUTDOWN ABORT: IMMEDIATE still does a
#      clean checkpoint/close/dismount, so the next STARTUP MOUNT doesn't
#      need to run crash (instance) recovery the way it would after an
#      ABORT. Also removes the separate "cancel recovery first" step —
#      IMMEDIATE tears down MRP along with everything else on its own.
#      SHUTDOWN ABORT is not used here at all now; if IMMEDIATE ever hangs
#      (not expected — a standby has no primary-side transactional workload
#      to roll back, so IMMEDIATE should return quickly), that's a manual
#      call for the operator, not something this role escalates to
#      automatically.
#
# Also: apexdb_stby's CRS management policy is currently AUTOMATIC with
# -startoption "read only" (confirmed live via `srvctl config database
# -d apexdb_stby -verbose`) — dataguard_role_services changed it from this
# project's original MOUNT/MANUAL registration (dataguard_convert_rac) to
# support permanent Active Data Guard. Left as AUTOMATIC/"read only" while we
# manually abort+mount an instance, CRS's own oraagent could detect the
# "down" instance and race to auto-restart it back to read-only before our
# STARTUP MOUNT even runs, or fight it immediately after. Temporarily
# reverted to MOUNT/MANUAL (this project's own original convention) before
# touching either instance, specifically to prevent that race — NOT restored
# automatically by this role. Restoring it to "read only"/AUTOMATIC (and
# re-enabling Active Data Guard / apexdb_ro) is a deliberate, separate,
# not-yet-built post-upgrade step, done only once the whole rolling upgrade
# has actually finished.
- name: "Stop the apexdb_ro service (Active Data Guard reader farm) — removes the likely source of lingering sessions"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db_home }}/bin/srvctl stop service -db {{ dg_standby_db_unique_name }} -service {{ dg_primary_role_service_ro }}"
  register: rolling_stop_ro_service
  changed_when: rolling_stop_ro_service.rc == 0
  failed_when: false
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: Show apexdb_ro stop-service output
  debug:
    msg:
      - "rc: {{ rolling_stop_ro_service.rc }}"
      - "Output: {{ (rolling_stop_ro_service.stdout_lines | default([])) + (rolling_stop_ro_service.stderr_lines | default([])) }}"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

# Real hang hit here on the first live run: this command sat for 45+ minutes
# with no output, no error, no CPU — a classic silent-stdin-block signature,
# not a CRSD/OCR lock (crsctl stat res queried fine throughout, resource
# stayed STABLE/ONLINE the entire time — proof CRSD itself was never stuck).
# James's own read of the symptom was right: `srvctl modify database` is
# documented (Oracle 12c/19c Server Control Utility Reference, "srvctl
# modify database", -force parameter: "Force the operation even though the
# some resources might be stopped") to prompt for interactive confirmation
# when the resource is currently online/started and the requested change
# implies it needs to be stopped/restarted to take effect — exactly this
# case, since apexdb_stby was OPEN READ ONLY at the time and we're changing
# -startoption to mount. Ansible's command/shell modules never attach a
# stdin a human could answer, so the prompt blocks forever rather than
# erroring — indistinguishable from a true hang unless you already suspect
# it, which is what made this genuinely worth catching rather than assuming.
# Fixed with -force, which is exactly what that flag exists for.
- name: "Temporarily set apexdb_stby's CRS policy to MOUNT/MANUAL (prevents CRS auto-restarting it back to read-only mid-sequence) — this project's own original registration convention"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: >
    {{ db_home }}/bin/srvctl modify database -db {{ dg_standby_db_unique_name }}
    -startoption mount -policy manual -force
  register: rolling_srvctl_modify_mount
  changed_when: rolling_srvctl_modify_mount.rc == 0
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: Show srvctl modify (mount/manual) output
  debug:
    msg: "rc: {{ rolling_srvctl_modify_mount.rc }} — {{ rolling_srvctl_modify_mount.stdout_lines }}"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

# Real design gap James caught: doing SHUTDOWN IMMEDIATE/STARTUP MOUNT via
# SQL*Plus directly (as this role did until now) bypasses CRS entirely — on
# RAC, CRS/CRSD is the authority that's supposed to track each instance
# resource's actual state. Restarting an instance from inside SQL*Plus,
# outside CRS's own orchestration, is exactly the kind of gap that produces
# split/inconsistent per-instance states like the one that started this
# whole detour (oradbserv09 READ ONLY WITH APPLY, oradbserv10 MOUNTED, from
# an earlier partial attempt) — CRS's bookkeeping and the instance's real
# state can drift apart when CRS isn't the one driving the transition.
# Fixed by using `srvctl stop instance` / `srvctl start instance` instead —
# confirmed real syntax (Oracle 12c RACAD, "srvctl stop instance"/"srvctl
# start instance"): `-db db_unique_name -instance instance_name -stopoption
# stop_options` / `-startoption start_options`. These are the same
# CRS-managed, per-instance operations `dataguard_role_services` already
# relies on for its own open/close sequence, just with `-stopoption
# immediate` / `-startoption mount` instead of its open/close options — CRS
# stays the single source of truth for each instance's state throughout,
# and the srvctl policy/startoption change made just above (MOUNT/MANUAL)
# still matters here: it's what stops CRS's own AUTOMATIC-policy oraagent
# from fighting these srvctl calls or racing to restart an instance back to
# read-only mid-sequence.
#
# The OS-level `pgrep ora_pmon` wait James asked for is kept as a second,
# independent confirmation after the srvctl stop — srvctl itself already
# blocks until CRS reports the resource OFFLINE, so this should normally
# resolve immediately, but it costs nothing and catches the case where CRS's
# own view is somehow stale.
- name: "srvctl stop instance (immediate) — apexdb_stby, once per instance that's actually open ({{ rolling_stby_instances_to_bounce | default([]) | map(attribute='node') | join(', ') }})"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ item.sid }}"
  command: >
    {{ db_home }}/bin/srvctl stop instance -db {{ dg_standby_db_unique_name }}
    -instance {{ item.sid }} -stopoption immediate
  register: rolling_shutdown_result
  changed_when: rolling_shutdown_result.rc == 0
  loop: "{{ rolling_stby_instances_to_bounce | default([]) }}"
  loop_control:
    label: "{{ item.node }} ({{ item.sid }})"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Show srvctl stop instance output (per instance)"
  debug:
    msg:
      - "{{ item.item.node }} ({{ item.item.sid }}): rc={{ item.rc }}"
      - "{{ (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}"
  loop: "{{ rolling_shutdown_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.node }}"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Wait until {{ item.node }} ({{ item.sid }}) has no ora_pmon process left — secondary OS-level confirmation on top of srvctl's own wait"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  command: "pgrep -f ora_pmon_{{ item.sid }}"
  register: rolling_shutdown_pmon_check
  until: rolling_shutdown_pmon_check.rc != 0
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  loop: "{{ rolling_stby_instances_to_bounce | default([]) }}"
  loop_control:
    label: "{{ item.node }} ({{ item.sid }})"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Fail loudly if an instance's pmon process is still running after 60 seconds — CRS reported the instance stopped but the OS disagrees, don't proceed to STARTUP"
  fail:
    msg: >-
      {{ item.item.node }} ({{ item.item.sid }}) still shows an ora_pmon
      process after 60 seconds of waiting, even though srvctl stop instance
      reported success. Investigate before attempting srvctl start instance.
  loop: "{{ rolling_shutdown_pmon_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.node }}"
  when: not rolling_stby_already_mounted and item.rc == 0
  tags: [rolling_build]

- name: "Notify — {{ item.node }} ({{ item.sid }}) shutdown complete (no remaining background processes), starting database mount via srvctl"
  debug:
    msg: "{{ item.node }} ({{ item.sid }}): shutdown complete — no ora_pmon process found. Starting database mount now (srvctl start instance)."
  loop: "{{ rolling_stby_instances_to_bounce | default([]) }}"
  loop_control:
    label: "{{ item.node }} ({{ item.sid }})"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "srvctl start instance (mount) — apexdb_stby, once per instance ({{ rolling_stby_instances_to_bounce | default([]) | map(attribute='node') | join(', ') }})"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ item.sid }}"
  command: >
    {{ db_home }}/bin/srvctl start instance -db {{ dg_standby_db_unique_name }}
    -instance {{ item.sid }} -startoption mount
  register: rolling_startup_result
  changed_when: rolling_startup_result.rc == 0
  loop: "{{ rolling_stby_instances_to_bounce | default([]) }}"
  loop_control:
    label: "{{ item.node }} ({{ item.sid }})"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Show srvctl start instance output (per instance)"
  debug:
    msg:
      - "{{ item.item.node }} ({{ item.item.sid }}): rc={{ item.rc }}"
      - "{{ (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}"
  loop: "{{ rolling_startup_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.node }}"
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

# Real gap found on this live run: this step returned "ORA-01153: an
# incompatible media recovery is active" — apexdb_stby has an active Data
# Guard Broker configuration (apexdb_dg), and Broker's own DMON evidently
# noticed the standby come back up MOUNTED (via srvctl start instance above)
# and auto-resumed managed recovery on its own before this manually-issued
# ALTER DATABASE RECOVER command got a turn — the two collided. This task
# had NO fail-loudly check at all (every other exec step in this role does),
# so that ORA- silently passed through unnoticed; BUILD_PLAN happened to
# succeed anyway since recovery ended up active either way, but that was
# luck, not a designed outcome. Fixed by checking gv$managed_standby FIRST
# (GV$, not V$ — this is a cluster-wide "is recovery running anywhere on
# this standby" check, not a single-instance one) and skipping our own
# resume attempt entirely if Broker (or anything else) already started it,
# rather than racing it. A real ORA- on top of that check now fails loudly,
# instead of being swallowed the way it was this run.
- name: "Write SQL script: check if managed recovery is already active (gv$managed_standby, all instances)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_mrp_active.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback off
      set linesize 200
      set pagesize 100
      set tab off
      column process format a10
      column status format a15
      SELECT inst_id, process, status FROM gv$managed_standby WHERE process LIKE 'MRP%' ORDER BY inst_id;
      exit;
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Check if managed recovery is already active (gv$managed_standby)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_mrp_active.sql
  register: rolling_mrp_check
  changed_when: false
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: Show current MRP status
  debug:
    var: rolling_mrp_check.stdout_lines
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Set fact: is managed recovery already active on apexdb_stby (e.g. auto-resumed by Data Guard Broker)"
  set_fact:
    rolling_mrp_already_active: "{{ not rolling_stby_already_mounted and (rolling_mrp_check.stdout is search('MRP')) }}"
  tags: [rolling_build]

- name: "Notify — managed recovery is already active (likely auto-resumed by Data Guard Broker once it saw apexdb_stby come up MOUNTED); not re-issuing"
  debug:
    msg: >-
      gv$managed_standby already shows an active MRP process on apexdb_stby
      — skipping our own RECOVER MANAGED STANDBY DATABASE command rather
      than racing it (that race is exactly what produced ORA-01153 on the
      previous run).
  when: not rolling_stby_already_mounted and rolling_mrp_already_active
  tags: [rolling_build]

- name: "Write SQL script: resume managed recovery in mounted mode"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_resume_apply_mounted.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback off
      set linesize 200
      set pagesize 100
      set tab off
      alter database recover managed standby database using current logfile disconnect from session;
      exit;
  when: not rolling_stby_already_mounted and not rolling_mrp_already_active
  tags: [rolling_build]

- name: "Resume managed recovery on apexdb_stby (mounted mode)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_resume_apply_mounted.sql
  register: rolling_resume_apply_result
  changed_when: "'Database altered' in rolling_resume_apply_result.stdout"
  when: not rolling_stby_already_mounted and not rolling_mrp_already_active
  tags: [rolling_build]

- name: Show resume-managed-recovery output
  debug:
    var: rolling_resume_apply_result.stdout_lines
  when: not rolling_stby_already_mounted and not rolling_mrp_already_active
  tags: [rolling_build]

- name: "Fail loudly if resume-managed-recovery reported an ORA- error (the missing check that let ORA-01153 pass silently on the previous run)"
  fail:
    msg: >-
      RECOVER MANAGED STANDBY DATABASE reported an ORA- error — read the
      output above. This ran precisely because gv$managed_standby showed no
      MRP process active yet, so this isn't the Broker-race case; something
      else is wrong.
  when:
    - not rolling_stby_already_mounted
    - not rolling_mrp_already_active
    - "'ORA-' in rolling_resume_apply_result.stdout"
  tags: [rolling_build]

- name: "Re-verify apexdb_stby is now mounted-only (gv$database, all instances)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_stby_open_mode.sql
  register: rolling_stby_open_mode_recheck
  changed_when: false
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: Show apexdb_stby's open_mode after close
  debug:
    var: rolling_stby_open_mode_recheck.stdout_lines
  when: not rolling_stby_already_mounted
  tags: [rolling_build]

- name: "Fail loudly if apexdb_stby is still not mounted-only — BUILD_PLAN will just hit ORA-45438 again"
  fail:
    msg: >-
      apexdb_stby still shows READ ONLY/READ WRITE after the close sequence
      — read the output above. Do not proceed to BUILD_PLAN until this
      resolves to mounted-only on every instance.
  when:
    - not rolling_stby_already_mounted
    - (rolling_stby_open_mode_recheck.stdout is search('READ ONLY')) or (rolling_stby_open_mode_recheck.stdout is search('READ WRITE'))
  tags: [rolling_build]

- name: "Fail loudly if apexdb_stby is no longer a PHYSICAL STANDBY after the restart — role drift is a much bigger problem than a wrong open_mode"
  fail:
    msg: >-
      apexdb_stby's DATABASE_ROLE is no longer PHYSICAL STANDBY after the
      srvctl stop/start instance bounce above — read the open_mode/role
      output above before doing anything else. This should never happen
      from a plain mount/dismount cycle; treat it as a serious anomaly, not
      something to retry past.
  when:
    - not rolling_stby_already_mounted
    - rolling_stby_open_mode_recheck.stdout is not search('PHYSICAL STANDBY')
  tags: [rolling_build]

- name: "Report: apexdb_stby was already mounted-only — nothing to do"
  debug:
    msg: "apexdb_stby was already mounted-only (real output above) — skipped the cancel/close/resume-apply sequence."
  when: rolling_stby_already_mounted
  tags: [rolling_build]

# ============================================================================
# BUILD_PLAN — compiles the plan from DBA_ROLLING_PARAMETERS. Must succeed
# before START_PLAN can be called. Connects to every database listed as a
# plan parameter (apexdb + apexdb_stby) — both must be MOUNTED (just
# confirmed/fixed above — plain "open" is not sufficient, see the ORA-45438
# gap above) and network-reachable, per Oracle's own docs. Also requires
# FSFO disabled (already done, confirmed 2026-08-21 via rolling_upgrade_fsfo).
# ============================================================================
- name: "Write SQL script: DBMS_ROLLING.BUILD_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_build_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading off
      set feedback on
      set serveroutput on
      set tab off
      EXECUTE DBMS_ROLLING.BUILD_PLAN;
      exit;
  tags: [rolling_build]

- name: "Run: DBMS_ROLLING.BUILD_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_build_plan.sql
  register: rolling_build_result
  changed_when: "'ORA-' not in rolling_build_result.stdout"
  tags: [rolling_build]

- name: Show BUILD_PLAN command and output
  debug:
    msg:
      - "Command (on {{ groups['rac_node1'][0] }}): {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_build_plan.sql"
      - "rc: {{ rolling_build_result.rc }}"
      - "Output: {{ rolling_build_result.stdout_lines }}"
  tags: [rolling_build]

- name: "Fail loudly if BUILD_PLAN reported an ORA- error"
  fail:
    msg: >-
      BUILD_PLAN reported an ORA- error — read the output above. Common
      causes per Oracle's own docs: apexdb_stby not mounted/reachable, FSFO
      still enabled, or a SET_PARAMETER change made without a prior
      successful BUILD_PLAN (ORA-45416).
  when: "'ORA-' in rolling_build_result.stdout"
  tags: [rolling_build]

- name: "Write SQL script: show the generated plan (DBA_ROLLING_PLAN)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_show_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      -- Real formatting bug found on the first live run: the combined
      -- "set echo on heading on feedback on linesize 200 pagesize 100" line
      -- above is INVALID SQL*Plus syntax — SET only accepts one option/value
      -- pair per invocation; everything after "echo on" was silently
      -- dropped, so heading/feedback/linesize/pagesize all stayed at
      -- SQL*Plus's narrow defaults (LINESIZE 80, PAGESIZE 14). That's what
      -- caused the DESCRIPTION column to word-wrap mid-sentence onto a
      -- second physical line for nearly every row, which in turn burned
      -- through PAGESIZE fast enough to trigger a mid-result header
      -- reprint around row 65 — confirmed, not a display quirk. Also,
      -- EXEC_STATUS is a NUMBER column in DBA_ROLLING_PLAN; applying a
      -- character FORMAT (a12) to it is a type mismatch that SQL*Plus
      -- resolves by falling back to a numeric default too narrow for the
      -- real value, hence the "##########" overflow marks — fixed below by
      -- converting it to a string in the SELECT itself so COLUMN's format
      -- unambiguously applies to text. Each SET is now its own line, and
      -- LINESIZE/column widths are sized so nothing wraps.
      set echo on
      set heading on
      set feedback on
      set tab off
      set linesize 250
      set pagesize 9999
      column instid       format 9999
      column target        format a14
      column phase          format a8
      column description  format a80 truncated
      column exec_status format a15
      column progress       format a12
      select instid,
             target,
             phase,
             description,
             to_char(exec_status) exec_status,
             progress
      from dba_rolling_plan
      order by instid;
      exit;
  tags: [rolling_build, rolling_start]

- name: "Run: show the generated plan"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_show_plan.sql
  register: rolling_show_plan_result
  changed_when: false
  tags: [rolling_build, rolling_start]

- name: Show the generated DBA_ROLLING_PLAN
  debug:
    msg: "{{ rolling_show_plan_result.stdout_lines }}"
  tags: [rolling_build, rolling_start]

- name: "PAUSE — review the generated plan above before proceeding to START_PLAN"
  pause:
    prompt: >
      BUILD_PLAN succeeded — review the DBA_ROLLING_PLAN output above. The
      next step (--tags rolling_start) calls DBMS_ROLLING.START_PLAN,
      converting apexdb_stby into a transient logical standby. Press ENTER
      to acknowledge.
  tags: [rolling_build]

# ============================================================================
# START_PLAN — executes every step tagged PHASE=START in the plan shown
# above (steps 1-45 in our real run): notifies the broker, runs the
# guaranteed-restore-point/flashback prep, and — the significant part —
# converts apexdb_stby into a TRANSIENT LOGICAL STANDBY: dbms_logstdby.build
# runs against apexdb (the current primary), apexdb_stby gets reduced to a
# SINGLE instance (per Oracle's own plan step 32/33 — logical standby / SQL
# Apply does not run multi-instance the way physical standby recovery does;
# expect only ONE gv$database row after this, not two — that is correct,
# not a fault), then opened READ WRITE as a logical standby applying SQL,
# not media recovery. (Later update: if the instance count changes again by
# the time rolling_autoupgrade runs, that's no longer treated as a fault
# either — see that section's own comments for why.)
#
# Still runs "at the current primary database" per Oracle's own docs —
# apexdb is still primary at this point (that doesn't change until
# SWITCHOVER), so this executes from rac_node1, same as INIT_PLAN/BUILD_PLAN.
#
# Can take real time — dbms_logstdby.build and the instance-reduction/open
# steps depend on redo volume and are not instant. This task blocks
# synchronously until SQL*Plus returns, matching every other exec step in
# this role; no async/poll wrapper, consistent with the rest of the file.
#
# Still reversible at this point: per Oracle's docs, DBMS_ROLLING.ROLLBACK_
# PLAN "can only be called if DBMS_ROLLING.SWITCHOVER has not been previously
# called" — SWITCHOVER (built under --tags rolling_switchover, further down
# this file) is the actual point of no return, not this step. If the
# post-checks below look wrong, ROLLBACK_PLAN is still a
# real option; that procedure itself is intentionally not wired into this
# role, since invoking it should be a deliberate human decision, not
# something a playbook does automatically.
#
# What comes after this (both now built, as of 2026-08-22): the software
# upgrade of the transient logical standby using AutoUpgrade (James's
# confirmed choice, see the AutoUpgrade-vs-DBUA decision earlier this
# project — see --tags rolling_autoupgrade) against the already-staged 19c
# software on the standby cluster, THEN --tags rolling_switchover
# (DBMS_ROLLING.SWITCHOVER).
# ============================================================================
- name: "PAUSE — about to call DBMS_ROLLING.START_PLAN. This converts apexdb_stby into a transient logical standby and reduces it to a single instance. Confirm this is really wanted now."
  pause:
    prompt: >
      About to run DBMS_ROLLING.START_PLAN against apexdb (current primary).
      This executes every START-phase step shown in the plan above,
      including converting apexdb_stby into a transient logical standby and
      reducing it to a single RAC instance. Still rollback-able at this
      point (ROLLBACK_PLAN works until SWITCHOVER is called), but this is a
      real, visible state change to apexdb_stby, not a dry run. Press ENTER
      to proceed, Ctrl+C to stop here.
  tags: [rolling_start]

- name: "Write SQL script: DBMS_ROLLING.START_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_start_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading off
      set feedback on
      set serveroutput on
      set tab off
      EXECUTE DBMS_ROLLING.START_PLAN;
      exit;
  tags: [rolling_start]

- name: "Run: DBMS_ROLLING.START_PLAN (against apexdb, still the current primary)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_start_plan.sql
  register: rolling_start_result
  changed_when: "'ORA-' not in rolling_start_result.stdout"
  tags: [rolling_start]

- name: Show START_PLAN command and output
  debug:
    msg:
      - "Command (on {{ groups['rac_node1'][0] }}): {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_start_plan.sql"
      - "rc: {{ rolling_start_result.rc }}"
      - "Output: {{ rolling_start_result.stdout_lines }}"
  tags: [rolling_start]

- name: "Fail loudly if START_PLAN reported an ORA- error"
  fail:
    msg: >-
      START_PLAN reported an ORA- error — read the output above before
      doing anything else. Do not attempt AutoUpgrade against apexdb_stby
      until this is understood; ROLLBACK_PLAN is still available at this
      point if needed (not automated by this role — a deliberate manual
      call).
  when: "'ORA-' in rolling_start_result.stdout"
  tags: [rolling_start]

# Re-display DBA_ROLLING_PLAN AFTER START_PLAN has actually run (the earlier
# display of this same query, before the PAUSE above, is the BEFORE
# snapshot — still all-PENDING at that point since START_PLAN hadn't been
# called yet. Reusing rolling_show_plan.sql, already written earlier in this
# same tag run — no need to rewrite it, just run + show it again.
- name: "Run: show the generated plan (after START_PLAN)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_show_plan.sql
  register: rolling_show_plan_post_start_result
  changed_when: false
  tags: [rolling_start]

- name: "Show the generated DBA_ROLLING_PLAN (after START_PLAN — compare against the all-PENDING snapshot shown before the pause above)"
  debug:
    msg: "{{ rolling_show_plan_post_start_result.stdout_lines }}"
  tags: [rolling_start]

- name: "Write SQL script: check apexdb_stby's real open_mode/role after START_PLAN (gv$database — expect a SINGLE row now, LOGICAL STANDBY, READ WRITE)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_stby_post_start.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback off
      set linesize 200
      set pagesize 100
      set tab off
      column open_mode format a25
      column database_role format a20
      SELECT inst_id, open_mode, database_role FROM gv$database ORDER BY inst_id;
      exit;
  tags: [rolling_start]

- name: "Check apexdb_stby's real open_mode/role after START_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_stby_post_start.sql
  register: rolling_stby_post_start_check
  changed_when: false
  tags: [rolling_start]

# Real formatting gap James caught live: embedding a *.stdout_lines LIST
# directly inside a `msg: >-` folded STRING makes Jinja stringify the whole
# list using Python's repr() — every line comes out mashed onto one line,
# wrapped in quotes and brackets, instead of the clean one-line-per-item
# output `debug: var:` produces (as used everywhere else in this file for
# raw SQL output). Split into two tasks: `var:` for the actual query
# output, `msg:` for the explanatory prose — same fix applied to every
# other place in this file with the same anti-pattern.
- name: "Show apexdb_stby's open_mode/role after START_PLAN"
  debug:
    var: rolling_stby_post_start_check.stdout_lines
  tags: [rolling_start]

# Messaging softened, 2026-08-22 (fourth-pass review): this used to tell
# the operator to "stop and investigate" if more than one row showed up
# here, on the theory that DBMS_ROLLING's own single-instance-for-SQL-Apply
# design meant anything else was a fault. That's still what START_PLAN
# itself normally produces right after it runs — but rolling_autoupgrade
# (further down this file) has since been deliberately changed to NOT
# require or enforce single-instance state before AutoUpgrade runs, because
# a real AutoUpgrade precheck wanted the opposite (all instances running).
# Leaving the old "stop and investigate" wording here would tell the
# operator two contradictory things depending on which tag they're
# reading. Softened to a plain observation instead of an alarm.
- name: "Explain expected open_mode/role after START_PLAN"
  debug:
    msg: >-
      Immediately after START_PLAN, DATABASE_ROLE = LOGICAL STANDBY with a
      SINGLE open instance is the normal, expected result (RAC reduces to
      one instance for SQL Apply at this point). If the role isn't LOGICAL
      STANDBY, that's a real problem — investigate before going further. If
      you later see more than one instance open (e.g. by the time
      rolling_autoupgrade runs), that's fine on its own — AutoUpgrade
      manages RAC instance lifecycle itself and its own preflight no longer
      requires single-instance state.
  tags: [rolling_start]

# Updated 2026-08-22 — both steps this originally deferred ("scoped next")
# have since been built: --tags rolling_autoupgrade (AutoUpgrade against the
# transient logical standby) and --tags rolling_switchover
# (DBMS_ROLLING.SWITCHOVER). Left the task name/wording historically
# accurate to what it said when START_PLAN was the newest thing built,
# rather than silently rewriting it — updated just enough to stop pointing
# at "not yet built" work that now exists.
- name: "Notify — START_PLAN complete. Next steps: --tags rolling_autoupgrade, then --tags rolling_switchover (both now built)"
  debug:
    msg: >-
      DBMS_ROLLING.START_PLAN has run. Compare the two DBA_ROLLING_PLAN
      displays above: the first (before the PAUSE) is the pre-run,
      all-PENDING snapshot from BUILD_PLAN; the second (after START_PLAN)
      shows the real per-step EXEC_STATUS/PROGRESS results. Next: run
      --tags rolling_autoupgrade against apexdb_stby's (now single-instance,
      transient logical standby) database, using the 19c software already
      staged on the standby cluster, then --tags rolling_switchover
      (DBMS_ROLLING.SWITCHOVER). rolling_finish (DBMS_ROLLING.FINISH_PLAN)
      is the one step in this chain still not built.
  tags: [rolling_start]

# ============================================================================
# rolling_autoupgrade — the MANUAL software upgrade of apexdb_stby (now a
# single-instance transient logical standby, open READ WRITE) using
# AutoUpgrade against the 19c software already staged on the standby
# cluster (db19c_software_install, OPatch 12.2.0.1.52 + RU 19.32.0.0.260721
# already applied and confirmed).
#
# IMPORTANT — this specific step is NOT Oracle-documented for the exact
# DBMS_ROLLING/transient-logical-standby scenario. Oracle's own 19c Data
# Guard docs say the transient logical standby's software upgrade is done
# "either manually or using the Database Upgrade Assistant (DBUA)" —
# AutoUpgrade is never named in that chapter. James chose AutoUpgrade
# anyway, knowingly, after a direct DBUA-vs-AutoUpgrade tradeoff discussion
# earlier in this project. What follows was cross-checked against Oracle's
# own official MAA deck ("Rolling Upgrades — Upgrade your DB with Zero
# Downtime", Francisco Munoz Alvarez, oraclemaa.com) and James's own
# real-world reference notes, both incorporated below — not just the
# general AutoUpgrade command reference this was originally built from.
#
# Real corrections/additions folded in after review against those sources:
#   1. DBA_ROLLING_UNSUPPORTED must be checked (ideally before INIT_PLAN —
#      we're past that now, so checking here, late but before AutoUpgrade
#      touches anything, is the next best point). Unsupported data types on
#      the primary get silently skipped by SQL Apply; DBA_LOGSTDBY_EVENTS is
#      where those skips would show up later.
#   2. SQL Apply health (V$LOGSTDBY_PROGRESS / DBA_LOGSTDBY_EVENTS) gets
#      checked both BEFORE and AFTER the upgrade — confirmed real view names
#      from Oracle's own MAA deck, not invented.
#   3. AutoUpgrade must be invoked with ORACLE_HOME set to the SOURCE
#      (12.2.0.1) home, not the target — per James's own real reference
#      ("Make sure you are using the original Oracle home before running the
#      autoupgrade.jar commands"). The java BINARY itself is still invoked
#      explicitly from the 19c home's bundled JDK (source homes this old may
#      not have a JDK new enough to run the jar) — ORACLE_HOME and the java
#      executable path are two separate things here, deliberately.
#   4. A real AutoUpgrade sample config is generated first via
#      `-create_sample_file`, kept on disk for reference/audit, rather than
#      only hand-writing a config from memory of doc examples — the actual
#      config Ansible writes and uses is still deterministic (explicit,
#      confirmed key/value pairs), but the generated sample is there to
#      diff against.
#   5. upg1.upgrade_node=localhost / run_utlrp=yes / timezone_upg=yes /
#      target_version=19 added — confirmed real parameters from James's
#      reference, sensible defaults (recompile invalid objects, refresh
#      timezone data, and upgrade_node=localhost since this task already
#      runs directly on the discovered node, not via a remote hop).
#   6. AFTER deploy: confirm SQL Apply actually resumed (it may not restart
#      on its own once the upgrade completes) — `ALTER DATABASE START
#      LOGICAL STANDBY APPLY IMMEDIATE;` is the real, documented manual
#      command if it didn't, issued only if V$LOGSTDBY_PROGRESS shows
#      nothing running (idempotent, not blindly re-issued).
#   7. CRS's own registration for apexdb_stby still points at the OLD
#      12.2.0.1 db_home after AutoUpgrade — AutoUpgrade upgrades the
#      database in place but does not touch srvctl's config. Without
#      `srvctl modify database -oraclehome {{ db19c_home }}`, any future
#      CRS-driven stop/start of apexdb_stby would try to start it from the
#      wrong (old) Oracle home. This was a real gap in the original scope
#      of this section — fixed by adding that step explicitly.
#
# Jar version: this project's own separately-staged
# AutoUpgrade_25.6_build_version_25.6.251016.jar is used throughout (James's
# explicit call — the bundled 19c-home jar shown in his reference notes was
# only an example of the command shape, not a preference for that specific
# jar).
#
# Still scoped conservatively given the "not Oracle-documented for this
# exact scenario" gap: ANALYZE (read-only) runs and is reviewed before
# DEPLOY (the actual upgrade) is even attempted, with an explicit PAUSE
# between them — no auto-chaining analyze straight into deploy.
#
# Which instance/host to target is discovered dynamically via
# `srvctl status database`, not hardcoded — DBMS_ROLLING.START_PLAN reduced
# apexdb_stby to a single instance, but which physical node that landed on
# isn't assumed; CRS is asked directly, consistent with the earlier
# always-use-CRS-not-guesswork principle.
#
# `-noconsole`: batch/scripting mode, documented specifically for exactly
# this use case (running from a script without interactive input) — runs
# using only the config file, no console interaction needed. Oracle's own
# MAA deck example shows deploy without this flag (an interactive demo),
# but -noconsole is the documented batch-scripting mode and is what fits an
# Ansible-driven run.
#
# One thing genuinely NOT verified from official docs — flagged rather than
# silently assumed: whether `-mode deploy -noconsole` blocks in the
# foreground until the whole upgrade job finishes, or returns early and
# continues in the background. Documented purpose of -noconsole (chaining
# into scripts) strongly implies foreground/blocking, and this task is
# written that way (a plain synchronous shell call, same convention as
# every other exec step in this role) — but the FIRST real run of this task
# is the actual confirmation, not this comment. Watch the real output/rc
# carefully the first time.

# ============================================================================
# PREFLIGHT — real gap found 2026-08-22: rolling_start's own post-START_PLAN
# check (gv$database, further up this file) only ever printed an advisory
# message ("expected a SINGLE row... if this doesn't match, stop and
# investigate") — there was no fail: task behind it. On the real run,
# apexdb_stby came back with BOTH instances open (gv$database showed two
# rows, both READ WRITE / LOGICAL STANDBY), and nothing stopped the workflow
# from continuing. A logical standby only supports SQL Apply on ONE instance
# — every other instance must be MOUNTED, not open (confirmed via Oracle's
# Data Guard/RAC docs); two instances open simultaneously is not a supported
# state for a transient logical standby, independent of whatever AutoUpgrade
# itself might do about RAC on its own. So: hard-fail here, as the first
# thing this section does, before AutoUpgrade ever touches anything — this
# is the last safe checkpoint, regardless of whether rolling_start's own
# check gets a real fail: added later too.
# ============================================================================
- name: "Write SQL script: PREFLIGHT — check apexdb_stby's open_mode/role before AutoUpgrade (gv$database, all instances — observational only, does not require single-instance)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_stby_single_instance_preflight.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback off
      set linesize 200
      set pagesize 100
      set tab off
      column open_mode format a25
      column database_role format a20
      SELECT inst_id, open_mode, database_role FROM gv$database ORDER BY inst_id;
      exit;
  tags: [rolling_autoupgrade]

- name: "Run: PREFLIGHT open_mode/role check (gv$database, all instances)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_stby_single_instance_preflight.sql
  register: rolling_autoupg_preflight_check
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Show PREFLIGHT open_mode/role check output"
  debug:
    var: rolling_autoupg_preflight_check.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Set fact: apexdb_stby's open_mode+role per instance (preflight), parsed INST_ID -> 'OPEN_MODE   DATABASE_ROLE'"
  set_fact:
    rolling_autoupg_open_mode_by_instance: "{{ dict(rolling_autoupg_preflight_check.stdout | regex_findall('(?m)^\\s*(\\d+)\\s+(.+?)\\s*$')) }}"
  tags: [rolling_autoupgrade]

- name: "Set fact: which apexdb_stby instances are actually OPEN (not just MOUNTED) right now, per the preflight query above"
  set_fact:
    rolling_autoupg_open_instances: "{{ rolling_autoupg_open_mode_by_instance.values() | select('search', 'READ WRITE|READ ONLY') | list }}"
  tags: [rolling_autoupgrade]

# Real gap James called out live (2026-08-22): the preflight used to just
# fail: here and stop, with no offered remediation. Per this project's own
# established convention (interactive PAUSE + explicit confirmation before
# any state-changing action, e.g. before START_PLAN and before AutoUpgrade
# deploy), a fixable problem should be fixed interactively, not just
# reported. Split into two cases below:
#   - ZERO instances open: no reliable automatic fix — could be caused by
#     many different things (all instances crashed, MRP/Broker issue,
#     START_PLAN never actually completed its conversion, etc.) and picking
#     one to "fix" automatically would be guessing. Still a hard fail.
#   - TWO OR MORE instances open (our actual real-world case): mechanically
#     fixable — stop every instance except the one the operator chooses to
#     keep, via the same srvctl pattern already proven in rolling_build.
#     Discovers the REAL running instances/nodes via `srvctl status
#     database` (never assumes inventory-order == instance number — a
#     fragility flagged in this file's own second review pass), asks which
#     one to keep, and requires that exact instance name typed back before
#     touching anything. Typing anything else (blank/abort/a typo) aborts
#     cleanly with nothing changed.
- name: "Fail loudly if ZERO apexdb_stby instances are open — no automatic fix, this needs investigation"
  fail:
    msg: >-
      PREFLIGHT FAILED: apexdb_stby shows ZERO open instances — see the
      gv$database output above. This isn't something to auto-remediate
      (could be a crashed instance, a Broker/MRP problem, or START_PLAN's
      conversion never actually completing) — investigate manually, then
      re-run this preflight (or `--tags rolling_start`) before
      `--tags rolling_autoupgrade`.
  when: (rolling_autoupg_open_instances | length) == 0
  tags: [rolling_autoupgrade]

# Real pivot, 2026-08-22: this preflight used to REQUIRE exactly one open
# instance and offer to interactively stop any extras (srvctl stop
# instance) before AutoUpgrade. That turned out to be actively wrong — a
# real AutoUpgrade ANALYZE run failed its own DEPLOY_JOB_VALIDATIONS
# precheck with "There is at least one instance which is not running for
# apexdb_stby": AutoUpgrade wants to see apexdb_stby's FULL RAC topology
# running, not the single-instance state this preflight used to enforce.
# James's call, confirmed correct by that real precheck output: this role
# stops shutting anything down here entirely. ALL RAC-instance lifecycle
# management (quiescing to single-instance for the dictionary upgrade, then
# restoring full RAC afterward) is left to AutoUpgrade itself, which is
# documented to handle exactly this. This preflight is now purely
# observational about the open-instance count — it reports, it never acts.
# The only things it still hard-fails on are states no amount of "let
# AutoUpgrade handle it" can excuse: zero instances open (above), or an
# open instance reporting the wrong DATABASE_ROLE entirely (below).
- name: "Notify — apexdb_stby open-instance count (informational only — nothing stopped or started here, regardless of the count)"
  debug:
    msg: >-
      apexdb_stby shows {{ rolling_autoupg_open_instances | length }} open
      instance(s) (see gv$database output above). Not touching instance
      state here — AutoUpgrade manages RAC instance lifecycle itself
      during deploy.
  tags: [rolling_autoupgrade]

- name: "Fail loudly if any open apexdb_stby instance isn't reporting DATABASE_ROLE = LOGICAL STANDBY — role drift is a real problem no matter how many instances are open"
  fail:
    msg: >-
      PREFLIGHT FAILED: at least one open apexdb_stby instance doesn't show
      DATABASE_ROLE = LOGICAL STANDBY (see gv$database output above).
      START_PLAN may not have actually converted it. Do NOT proceed to
      AutoUpgrade — investigate the role/conversion state first.
  when: (rolling_autoupg_open_instances | select('search', 'LOGICAL STANDBY') | list | length) != (rolling_autoupg_open_instances | length)
  tags: [rolling_autoupgrade]

- name: "Notify — PREFLIGHT passed: apexdb_stby has at least one open LOGICAL STANDBY instance, safe to proceed"
  debug:
    msg: >-
      Preflight OK — {{ rolling_autoupg_open_instances | length }} open
      apexdb_stby instance(s), all reporting DATABASE_ROLE = LOGICAL
      STANDBY (gv$database confirmed above). Proceeding to the
      DBA_ROLLING_UNSUPPORTED check.
  tags: [rolling_autoupgrade]

- name: "Write SQL script: check DBA_ROLLING_UNSUPPORTED on the primary (apexdb) — unsupported data types get silently skipped by SQL Apply"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_unsupported.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set linesize 200
      set pagesize 100
      set tab off
      column owner format a30
      column table_name format a30
      select owner, table_name from dba_rolling_unsupported;
      exit;
  tags: [rolling_autoupgrade]

- name: "Check DBA_ROLLING_UNSUPPORTED on apexdb (primary)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_unsupported.sql
  register: rolling_unsupported_check
  changed_when: false
  tags: [rolling_autoupgrade]

# Real formatting gap James caught live: this is exactly the run that
# surfaced it — DBA_ROLLING_UNSUPPORTED returned a real row (SOE.
# BENCHMARK_RESULTS), and embedding *.stdout_lines directly inside a
# `msg: >-` folded string made Jinja stringify the whole list via Python's
# repr(), so the actual finding came out as an unreadable single-line blob
# instead of the clean per-line output `debug: var:` gives everywhere else
# in this file. Split into two tasks, same fix applied at every other
# occurrence of this pattern in this file.
- name: "Show DBA_ROLLING_UNSUPPORTED output"
  debug:
    var: rolling_unsupported_check.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Explain DBA_ROLLING_UNSUPPORTED result"
  debug:
    msg: >-
      Ideal result: "no rows selected". If rows ARE listed, DML/DDL against
      those tables on the primary gets silently skipped by SQL Apply on
      apexdb_stby for the duration of this rolling upgrade — review
      DBA_LOGSTDBY_EVENTS later for anything that actually got skipped, and
      decide whether to accept it or fall back (still safe to fall back at
      this point — no changes have been made to the primary, only the
      standby).
  tags: [rolling_autoupgrade]

- name: "PAUSE — review DBA_ROLLING_UNSUPPORTED output above before proceeding to AutoUpgrade"
  pause:
    prompt: >
      Review the DBA_ROLLING_UNSUPPORTED output above. If it's not empty,
      confirm you understand which tables' changes may be silently skipped
      during this window before continuing. Press ENTER to proceed, Ctrl+C
      to stop here.
  tags: [rolling_autoupgrade]

# Real pivot, 2026-08-22: this used to hard-fail unless EXACTLY one
# instance was running (matching DBMS_ROLLING's single-instance-for-
# SQL-Apply design), and a since-removed block used to forcibly start any
# stopped instance back up in MOUNT mode just to satisfy AutoUpgrade's own
# precheck. Both are gone now — James's explicit call: this role does not
# shut down OR start up any instance anywhere in rolling_autoupgrade
# anymore. Whatever state apexdb_stby's instances are actually in when this
# runs is left exactly as found; AutoUpgrade's own RAC-aware deploy handles
# quiescing to single-instance for the dictionary upgrade and restoring
# full RAC afterward, per its own documented behavior. This task just picks
# a connection target for AutoUpgrade's config (any one running instance is
# a valid RAC connect point — AutoUpgrade discovers the rest of the
# topology itself from there), and fails only if NOTHING is running at all
# (nothing to even connect to).
- name: "Discover apexdb_stby's currently running instance(s) via srvctl — used only to pick a connection target, not to judge or change instance state"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db_home }}/bin/srvctl status database -d {{ dg_standby_db_unique_name }}"
  register: rolling_autoupg_srvctl_status
  changed_when: false
  tags: [rolling_autoupgrade]

- name: Show srvctl status database output
  debug:
    var: rolling_autoupg_srvctl_status.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Set fact: all currently running instances (sid, node) pairs, parsed from srvctl status"
  set_fact:
    rolling_autoupg_running_instances: "{{ rolling_autoupg_srvctl_status.stdout | regex_findall('Instance (\\S+) is running on node (\\S+)') }}"
  tags: [rolling_autoupgrade]

- name: "Fail loudly if NO apexdb_stby instance is running at all — need at least one connectable instance to target"
  fail:
    msg: >-
      No running apexdb_stby instance found via srvctl status — see output
      above. This role won't start anything up automatically (James's
      call — that's AutoUpgrade's job now); investigate and start whatever
      needs starting manually, then re-run `--tags rolling_autoupgrade`.
  when: (rolling_autoupg_running_instances | length) == 0
  tags: [rolling_autoupgrade]

- name: "Notify — apexdb_stby running-instance count (any number >= 1 is fine — AutoUpgrade manages the RAC lifecycle from here)"
  debug:
    msg: >-
      {{ rolling_autoupg_running_instances | length }} apexdb_stby
      instance(s) currently running:
      {{ rolling_autoupg_running_instances | map('join', ' on node ') | join(', ') }}.
      Targeting the first one as AutoUpgrade's connection point —
      AutoUpgrade discovers the rest of the RAC topology itself from there.
  tags: [rolling_autoupgrade]

- name: "Set fact: apexdb_stby's AutoUpgrade connection target — first currently-running instance found"
  set_fact:
    rolling_autoupg_sid: "{{ rolling_autoupg_running_instances[0][0] }}"
    rolling_autoupg_node: "{{ rolling_autoupg_running_instances[0][1] }}"
  tags: [rolling_autoupgrade]

- name: "Notify — targeting {{ rolling_autoupg_sid }} on {{ rolling_autoupg_node }} for AutoUpgrade"
  debug:
    msg: >-
      apexdb_stby's AutoUpgrade connection target is
      {{ rolling_autoupg_sid }} on {{ rolling_autoupg_node }} (discovered
      via srvctl, not assumed). No instance state was changed to get here —
      AutoUpgrade manages the rest of the RAC instance lifecycle itself.
  tags: [rolling_autoupgrade]

# Confirmed real view names from Oracle's own MAA rolling-upgrade deck
# (Francisco Munoz Alvarez, oraclemaa.com) — LOGSTDBY_PROGRESS for SQL
# Apply status, DBA_LOGSTDBY_EVENTS for skipped/error events. Checked here
# (before AutoUpgrade touches anything) to establish a baseline, and again
# after deploy to see what changed.
#
# Real gap found on independent review, 2026-08-22 (fourth-pass, after the
# instance-stop remediation was removed): this queried V$LOGSTDBY_PROGRESS
# — instance-scoped, not cluster-wide — while connected to whichever
# instance happened to be picked as rolling_autoupg_node (now just "the
# first currently-running instance," since this role no longer stops
# anything to guarantee it's the apply instance specifically). If SQL Apply
# actually runs on a DIFFERENT instance than the one AutoUpgrade's
# connection target landed on, V$LOGSTDBY_PROGRESS would show nothing there
# — a false "apply not running" read, exactly the kind of silent
# wrong-instance mistake this project's own "fail loudly, don't guess"
# philosophy is built to avoid. Switched to GV$LOGSTDBY_PROGRESS — cluster-
# wide — so the real apply state shows up regardless of which instance this
# session happens to be connected through.
- name: "Write SQL script: check SQL Apply health (GV$LOGSTDBY_PROGRESS / DBA_LOGSTDBY_EVENTS) on apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_logstdby_health.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set linesize 200
      set pagesize 100
      set tab off
      prompt ===== GV$LOGSTDBY_PROGRESS (cluster-wide — correct regardless of which instance this session connects through) =====
      select * from gv$logstdby_progress;
      prompt ===== DBA_LOGSTDBY_EVENTS (most recent 20) =====
      select * from (
        select event_timestamp, status, event
        from dba_logstdby_events
        order by event_timestamp desc
      ) where rownum <= 20
      order by event_timestamp;
      exit;
  tags: [rolling_autoupgrade]

- name: "Check SQL Apply health on apexdb_stby (before AutoUpgrade)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_logstdby_health.sql
  register: rolling_logstdby_health_before
  changed_when: false
  failed_when: false
  tags: [rolling_autoupgrade]

- name: "Show SQL Apply health (before AutoUpgrade)"
  debug:
    var: rolling_logstdby_health_before.stdout_lines
  tags: [rolling_autoupgrade]

# Real gap found on independent review, 2026-08-22 (fourth-pass): the
# tune/stop/restart-apply commands below (ALTER DATABASE STOP/START
# LOGICAL STANDBY APPLY, DBMS_LOGSTDBY.APPLY_SET) are per-instance SQL*Plus
# sessions — they need to run against the instance ACTUALLY running SQL
# Apply, not just wherever rolling_autoupg_sid/_node happened to land (that
# variable now only means "the first currently-running instance," picked as
# an AutoUpgrade connection point — any RAC member is fine for that, but
# not necessarily correct for touching the apply engine specifically, now
# that this role no longer guarantees single-instance state). Determines
# the real apply instance from GV$LOGSTDBY_PROGRESS's own INST_ID (cluster-
# wide, so this is accurate regardless of which instance rolling_autoupg_sid
# picked) rather than assuming. Falls back to rolling_autoupg_sid/_node only
# if GV$LOGSTDBY_PROGRESS shows no apply running anywhere yet (e.g. a fresh
# conversion where apply hasn't started, or it's already stopped) — a
# reasonable default since the stop/restart tasks below are already
# idempotency-guarded either way.
- name: "Write SQL script: find which INST_ID (if any) is actually running SQL Apply (GV$LOGSTDBY_PROGRESS)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_find_apply_instance.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 50
      set tab off
      select inst_id from gv$logstdby_progress;
      exit;
  tags: [rolling_autoupgrade]

- name: "Find which INST_ID is actually running SQL Apply"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_find_apply_instance.sql
  register: rolling_find_apply_instance_result
  changed_when: false
  failed_when: "'ORA-' in rolling_find_apply_instance_result.stdout"
  tags: [rolling_autoupgrade]

- name: "Set fact: the real SQL Apply instance's INST_ID(s), parsed from GV$LOGSTDBY_PROGRESS"
  set_fact:
    rolling_apply_inst_ids: "{{ rolling_find_apply_instance_result.stdout | regex_findall('(?m)^\\s*(\\d+)\\s*$') }}"
  tags: [rolling_autoupgrade]

- name: "Set fact: the real SQL Apply sid/node — derived from GV$LOGSTDBY_PROGRESS's INST_ID, falling back to the AutoUpgrade connection target if apply isn't running anywhere yet"
  set_fact:
    rolling_apply_sid: "{{ (sid_prefix ~ rolling_apply_inst_ids[0]) if (rolling_apply_inst_ids | length) > 0 else rolling_autoupg_sid }}"
  tags: [rolling_autoupgrade]

- name: "Set fact: the real SQL Apply node — looked up via the running-instances map already discovered above, falling back to the AutoUpgrade connection target"
  set_fact:
    rolling_apply_node: "{{ dict(rolling_autoupg_running_instances).get(rolling_apply_sid, rolling_autoupg_node) }}"
  tags: [rolling_autoupgrade]

- name: "Notify — SQL Apply instance for tune/stop/restart commands: {{ rolling_apply_sid }} on {{ rolling_apply_node }}{{ ' (fallback — no apply currently running anywhere)' if (rolling_apply_inst_ids | length) == 0 else ' (confirmed via GV$LOGSTDBY_PROGRESS)' }}"
  debug:
    msg: >-
      Tune/stop/restart-apply commands below will target
      {{ rolling_apply_sid }} on {{ rolling_apply_node }} —
      {{ 'confirmed as the real apply instance via GV$LOGSTDBY_PROGRESS.' if (rolling_apply_inst_ids | length) > 0 else 'no apply process found running anywhere yet, so falling back to the AutoUpgrade connection target.' }}
      This may differ from {{ rolling_autoupg_sid }}, which is only
      AutoUpgrade's own connection point and doesn't have to be the apply
      instance.
  tags: [rolling_autoupgrade]

# ============================================================================
# Tune the logical standby before AutoUpgrade runs — real, confirmed
# guidance James provided (per-step content, not a general doc example):
# by default SQL Apply commits transactions on the logical standby in the
# exact order they committed on the primary, so any application could
# transparently run against it. During this window the standby is in
# restricted mode with no application connections anyway, so that strict
# ordering buys nothing — setting PRESERVE_COMMIT_ORDER=FALSE lets
# non-overlapping transactions commit out of order, which raises the apply
# rate. Combined with sizing MAX_SERVERS to the instance's own CPU_COUNT
# (Oracle's documented recommendation — only tune MAX_SERVERS directly and
# let SQL Apply distribute prepare/apply servers itself), this matters most
# right before AutoUpgrade's deploy step generates a real burst of
# dictionary-upgrade redo for SQL Apply to keep up with.
#
# James's two source examples showed PRESERVE_COMMIT_ORDER and MAX_SERVERS
# changed in two separate stop/start-apply cycles — consolidated here into
# one stop -> configure both -> start cycle instead, since both are plain
# DBMS_LOGSTDBY.APPLY_SET calls and neither needs its own dedicated
# stop/start pair. Noted here rather than silently done, since it's a
# deliberate consolidation, not a literal copy of two separate snippets.
# ============================================================================
- name: "Write SQL script: check current CPU_COUNT on apexdb_stby's real SQL Apply instance (drives MAX_SERVERS sizing)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_cpu_count.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      -- Same combined-SET-line bug this project already fixed everywhere
      -- else (SET only accepts one option/value pair per invocation —
      -- everything after the first was silently dropped). Found here during
      -- the road-to-oracleocm review pass and fixed the same way: one SET
      -- per line, tab explicitly off so no raw tab characters leak into the
      -- output this gets parsed from.
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 100
      set tab off
      show parameter cpu_count
      exit;
  tags: [rolling_autoupgrade]

- name: "Check current CPU_COUNT on apexdb_stby's real SQL Apply instance"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_apply_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_cpu_count.sql
  register: rolling_cpu_count_result
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Set fact: apexdb_stby's CPU_COUNT (parsed from SHOW PARAMETER output)"
  set_fact:
    rolling_stby_cpu_count: "{{ rolling_cpu_count_result.stdout | regex_findall('cpu_count\\s+\\S+\\s+(\\d+)') | first }}"
  tags: [rolling_autoupgrade]

# Real failure hit on the first live run: MAX_SERVERS set to raw CPU_COUNT
# (3 on this lab's standby) failed with ORA-16081 "insufficient number of
# processes for APPLY". Confirmed via Oracle's own documented cause/fix for
# ORA-16081 (My Oracle Support + Oracle error reference): SQL Apply's
# internal architecture needs a minimum floor of processes for its own
# required roles (reader, preparer(s), coordinator, apply servers) —
# requesting fewer than that floor via MAX_SERVERS fails even though the
# number "sounds" like enough for the CPU count. James's own real-world
# guidance: floor MAX_SERVERS at 5 regardless of CPU_COUNT. Fixed by taking
# the larger of CPU_COUNT and 5, rather than trusting CPU_COUNT alone —
# still scales up on boxes with more CPUs, never goes below the documented
# safe minimum.
- name: "Set fact: MAX_SERVERS to actually use — the larger of CPU_COUNT and 5 (ORA-16081's documented minimum-process floor for SQL Apply)"
  set_fact:
    rolling_stby_max_servers: "{{ [rolling_stby_cpu_count | int, 5] | max }}"
  tags: [rolling_autoupgrade]

- name: "Notify — tuning apexdb_stby's logical standby apply before AutoUpgrade: PRESERVE_COMMIT_ORDER=FALSE, MAX_SERVERS={{ rolling_stby_max_servers }} (= max(CPU_COUNT, 5) — see ORA-16081 note above)"
  debug:
    msg: >-
      CPU_COUNT on apexdb_stby is {{ rolling_stby_cpu_count }} — using
      MAX_SERVERS={{ rolling_stby_max_servers }} (floored at 5 to avoid
      ORA-16081, which a raw CPU_COUNT of {{ rolling_stby_cpu_count }} hit
      on a real run), and PRESERVE_COMMIT_ORDER=FALSE since the standby is
      in restricted mode with no application connections during this
      window anyway.
  tags: [rolling_autoupgrade]

# Real gap found on independent review (2026-08-22, second-pass): the stop
# command below was unconditional — unlike the MRP-resume logic earlier in
# this file (gv$managed_standby check, further up), which was hardened
# specifically because a real live run hit a race from blindly re-issuing a
# similar command (ORA-01153). If a prior rolling_autoupgrade run failed
# partway through (e.g. between this stop and the restart further below)
# and the operator re-runs --tags rolling_autoupgrade, this would re-issue
# STOP LOGICAL STANDBY APPLY against an already-stopped apply process.
# Whether Oracle errors on a redundant stop wasn't confirmed either way —
# rather than guess, applying the same proven pattern used for MRP: check
# first via GV$LOGSTDBY_PROGRESS, only stop if apply is actually running.
- name: "Write SQL script: check if logical standby apply is currently running (idempotency pre-check, before stop) — GV$, cluster-wide, correct regardless of which instance is actually applying"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_count_logstdby_progress.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 50
      set tab off
      select count(*) from gv$logstdby_progress;
      exit;
  tags: [rolling_autoupgrade]

- name: "Check if logical standby apply is currently running (before stop)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_apply_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_count_logstdby_progress.sql
  register: rolling_logstdby_count_before_stop
  changed_when: false
  failed_when: "'ORA-' in rolling_logstdby_count_before_stop.stdout"
  tags: [rolling_autoupgrade]

- name: "Set fact: is logical standby apply currently running (before stop)"
  set_fact:
    rolling_logstdby_running_before_stop: "{{ (rolling_logstdby_count_before_stop.stdout | trim | int) > 0 }}"
  tags: [rolling_autoupgrade]

- name: "Notify — logical standby apply already stopped, skipping redundant stop command"
  debug:
    msg: >-
      GV$LOGSTDBY_PROGRESS already shows no active apply process on
      apexdb_stby — not re-issuing ALTER DATABASE STOP LOGICAL STANDBY
      APPLY (avoids an unconfirmed-behavior redundant stop on a re-run).
  when: not rolling_logstdby_running_before_stop
  tags: [rolling_autoupgrade]

- name: "Write SQL script: stop logical standby apply (before re-configuring SQL Apply parameters)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_stop_logstdby_apply.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      alter database stop logical standby apply;
      exit;
  when: rolling_logstdby_running_before_stop
  tags: [rolling_autoupgrade]

- name: "Stop logical standby apply on apexdb_stby's real SQL Apply instance"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_apply_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_stop_logstdby_apply.sql
  register: rolling_stop_logstdby_result
  changed_when: "'Database altered' in rolling_stop_logstdby_result.stdout"
  failed_when: "'ORA-' in rolling_stop_logstdby_result.stdout"
  when: rolling_logstdby_running_before_stop
  tags: [rolling_autoupgrade]

- name: "Show stop-logical-standby-apply output"
  debug:
    var: rolling_stop_logstdby_result.stdout_lines
  when: rolling_logstdby_running_before_stop
  tags: [rolling_autoupgrade]

- name: "Write SQL script: set PRESERVE_COMMIT_ORDER=FALSE and MAX_SERVERS={{ rolling_stby_max_servers }} via DBMS_LOGSTDBY.APPLY_SET"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_tune_logstdby.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set serveroutput on
      set tab off
      EXECUTE DBMS_LOGSTDBY.APPLY_SET('PRESERVE_COMMIT_ORDER', 'FALSE');
      EXECUTE DBMS_LOGSTDBY.APPLY_SET('MAX_SERVERS', {{ rolling_stby_max_servers }});
      exit;
  tags: [rolling_autoupgrade]

- name: "Set PRESERVE_COMMIT_ORDER=FALSE and MAX_SERVERS={{ rolling_stby_max_servers }} on apexdb_stby's real SQL Apply instance"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_apply_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_tune_logstdby.sql
  register: rolling_tune_logstdby_result
  changed_when: "'PL/SQL procedure successfully completed' in rolling_tune_logstdby_result.stdout"
  failed_when: "'ORA-' in rolling_tune_logstdby_result.stdout"
  tags: [rolling_autoupgrade]

- name: "Show APPLY_SET output"
  debug:
    var: rolling_tune_logstdby_result.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Write SQL script: restart logical standby apply (after re-configuring SQL Apply parameters)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_restart_logstdby_apply.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      alter database start logical standby apply immediate;
      exit;
  tags: [rolling_autoupgrade]

- name: "Restart logical standby apply on apexdb_stby's real SQL Apply instance (with new tuning in effect)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_apply_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_apply_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_restart_logstdby_apply.sql
  register: rolling_restart_logstdby_result
  changed_when: "'Database altered' in rolling_restart_logstdby_result.stdout"
  failed_when: "'ORA-' in rolling_restart_logstdby_result.stdout"
  tags: [rolling_autoupgrade]

- name: "Show restart-logical-standby-apply output"
  debug:
    var: rolling_restart_logstdby_result.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Create AutoUpgrade log directory on {{ rolling_autoupg_node }}"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  file:
    path: "{{ staging_dir }}/autoupgrade/logs/apexdb_stby"
    state: directory
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0750"
  tags: [rolling_autoupgrade]

- name: "Generate a real AutoUpgrade sample config file (kept on disk for reference/audit — not used verbatim, but a genuine version-correct template to diff the final config against)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export JAVA_HOME={{ db19c_home }}/jdk
    export PATH=$JAVA_HOME/bin:$PATH
    $JAVA_HOME/bin/java -jar {{ autoupgrade_jar }} \
      -create_sample_file config {{ staging_dir }}/autoupgrade/apexdb_stby_sample.cfg
  register: rolling_autoupg_sample_result
  changed_when: true
  failed_when: false
  tags: [rolling_autoupgrade]

- name: "Show generated sample config output"
  debug:
    msg:
      - "rc: {{ rolling_autoupg_sample_result.rc }}"
      - "{{ rolling_autoupg_sample_result.stdout_lines }}"
      - "{{ rolling_autoupg_sample_result.stderr_lines }}"
  tags: [rolling_autoupgrade]

# James's ask: an explicit option to create a flashback restore point
# before AutoUpgrade touches anything. Confirmed via Oracle's own
# AutoUpgrade config parameter reference: `restoration` controls exactly
# this — it creates a GUARANTEED RESTORE POINT (GRP) before the upgrade,
# giving a flashback-based fallback if the upgrade needs to be rolled back.
# Default is already `yes` even if left unset — this makes it explicit
# rather than relying on an implicit default, consistent with every other
# option in this config (run_utlrp, timezone_upg, etc. are all spelled out
# too). One real prerequisite Oracle's docs call out: `restoration=yes`
# needs a Fast Recovery Area configured (db_recovery_file_dest) to actually
# create the GRP — checked below and failed loudly if missing, rather than
# letting AutoUpgrade discover that mid-run.
- name: "Write SQL script: check apexdb_stby has a Fast Recovery Area configured (required for restoration=yes / the guaranteed restore point AutoUpgrade will create)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_fra.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 200
      set tab off
      show parameter db_recovery_file_dest
      exit;
  tags: [rolling_autoupgrade]

- name: "Check apexdb_stby has a Fast Recovery Area configured"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_fra.sql
  register: rolling_autoupg_fra_check
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Show Fast Recovery Area check output"
  debug:
    var: rolling_autoupg_fra_check.stdout_lines
  tags: [rolling_autoupgrade]

- name: "Fail loudly if apexdb_stby has no Fast Recovery Area configured — restoration=yes (the guaranteed restore point) needs one, per Oracle's own AutoUpgrade docs"
  fail:
    msg: >-
      db_recovery_file_dest appears unset on apexdb_stby (see output
      above) — restoration=yes cannot create a guaranteed restore point
      without a Fast Recovery Area. Either configure one, or set
      upg1.restoration=no in the config below and handle backup/restore
      manually (Oracle's own documented alternative — not recommended
      without a real reason to skip GRP protection here).
  when: rolling_autoupg_fra_check.stdout | trim | length == 0
  tags: [rolling_autoupgrade]

# Deterministic final config — explicit, confirmed key/value pairs rather
# than editing the generated sample's arbitrary formatting programmatically.
# upgrade_node/run_utlrp/timezone_upg/target_version confirmed from James's
# own real-world reference notes for this exact kind of upgrade.
- name: "Write AutoUpgrade config file for apexdb_stby (targeting {{ rolling_autoupg_sid }})"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/autoupgrade/apexdb_stby_autoupgrade.cfg"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      global.autoupg_log_dir={{ staging_dir }}/autoupgrade/logs
      upg1.log_dir={{ staging_dir }}/autoupgrade/logs/apexdb_stby
      upg1.sid={{ rolling_autoupg_sid }}
      upg1.source_home={{ db_home }}
      upg1.target_home={{ db19c_home }}
      upg1.target_version=19
      upg1.start_time=NOW
      upg1.upgrade_node=localhost
      upg1.run_utlrp=yes
      upg1.timezone_upg=yes
      upg1.restoration=yes
  tags: [rolling_autoupgrade]

- name: "Show AutoUpgrade config file content"
  debug:
    msg:
      - "global.autoupg_log_dir={{ staging_dir }}/autoupgrade/logs"
      - "upg1.log_dir={{ staging_dir }}/autoupgrade/logs/apexdb_stby"
      - "upg1.sid={{ rolling_autoupg_sid }}"
      - "upg1.source_home={{ db_home }}"
      - "upg1.target_home={{ db19c_home }}"
      - "upg1.target_version=19"
      - "upg1.start_time=NOW"
      - "upg1.upgrade_node=localhost"
      - "upg1.run_utlrp=yes"
      - "upg1.timezone_upg=yes"
      - "upg1.restoration=yes"
  tags: [rolling_autoupgrade]

- name: "PAUSE — about to run AutoUpgrade in ANALYZE mode (read-only, safe) against apexdb_stby. Confirm before proceeding."
  pause:
    prompt: >
      About to run: java -jar {{ autoupgrade_jar }} -config
      {{ staging_dir }}/autoupgrade/apexdb_stby_autoupgrade.cfg -mode
      analyze -noconsole. ANALYZE mode is read-only — it does not change
      anything. Press ENTER to proceed, Ctrl+C to stop here.
  tags: [rolling_autoupgrade]

# ORACLE_HOME set to the SOURCE (12.2.0.1) home here, NOT the target — per
# James's own real reference notes: AutoUpgrade needs to identify/connect to
# the database being analyzed using its own (source) environment first. The
# java binary itself is still invoked explicitly from the 19c home's bundled
# JDK, since a 12.2.0.1 home's own bundled JDK may not be new enough to run
# the jar — ORACLE_HOME and the java executable path are deliberately kept
# separate here.
- name: "Run: AutoUpgrade -mode analyze (read-only readiness check) against apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export JAVA_HOME={{ db19c_home }}/jdk
    export PATH=$JAVA_HOME/bin:$PATH
    $JAVA_HOME/bin/java -jar {{ autoupgrade_jar }} \
      -config {{ staging_dir }}/autoupgrade/apexdb_stby_autoupgrade.cfg \
      -mode analyze -noconsole
  register: rolling_autoupg_analyze_result
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Show AutoUpgrade analyze output (full — this is what the readiness report is built from)"
  debug:
    msg:
      - "rc: {{ rolling_autoupg_analyze_result.rc }}"
      - "{{ rolling_autoupg_analyze_result.stdout_lines }}"
      - "{{ rolling_autoupg_analyze_result.stderr_lines }}"
  tags: [rolling_autoupgrade]

# James's explicit ask: see the REAL config file content, read back off
# disk, right before DEPLOY runs — not just the values this role thinks it
# wrote (the earlier "Show AutoUpgrade config file content" task after
# writing the file only echoes the Jinja values back, it never re-reads the
# actual file). This re-reads the real file on the target node so what's
# displayed is exactly what -mode deploy is about to use, catching any
# templating mistake or on-disk drift the earlier echo wouldn't reveal.
- name: "Read back the actual AutoUpgrade config file from disk, right before DEPLOY"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  command: "cat {{ staging_dir }}/autoupgrade/apexdb_stby_autoupgrade.cfg"
  register: rolling_autoupg_cfg_reread
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Show the real AutoUpgrade config file content (read from disk, not the values this role computed)"
  debug:
    var: rolling_autoupg_cfg_reread.stdout_lines
  tags: [rolling_autoupgrade]

- name: "PAUSE — review the ANALYZE output/report AND the real config file above before running DEPLOY (the actual upgrade). This is the point to stop if anything looks wrong."
  pause:
    prompt: >
      Review the ANALYZE output and the actual apexdb_stby_autoupgrade.cfg
      content above — check the generated report path it printed (HTML/log
      under {{ staging_dir }}/autoupgrade/logs/apexdb_stby) for any
      BLOCKER/MANDATORY findings before continuing. Pressing ENTER now will
      proceed to `-mode deploy`, which performs the actual upgrade against
      apexdb_stby (guaranteed restore point, dictionary upgrade,
      post-checks). Ctrl+C to stop here instead.
  tags: [rolling_autoupgrade]

- name: "Run: AutoUpgrade -mode deploy (the actual upgrade) against apexdb_stby — this is expected to take real time"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  environment:
    ORACLE_HOME: "{{ db_home }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export JAVA_HOME={{ db19c_home }}/jdk
    export PATH=$JAVA_HOME/bin:$PATH
    $JAVA_HOME/bin/java -jar {{ autoupgrade_jar }} \
      -config {{ staging_dir }}/autoupgrade/apexdb_stby_autoupgrade.cfg \
      -mode deploy -noconsole
  register: rolling_autoupg_deploy_result
  changed_when: true
  tags: [rolling_autoupgrade]

- name: "Show AutoUpgrade deploy output (full)"
  debug:
    msg:
      - "rc: {{ rolling_autoupg_deploy_result.rc }}"
      - "{{ rolling_autoupg_deploy_result.stdout_lines }}"
      - "{{ rolling_autoupg_deploy_result.stderr_lines }}"
  tags: [rolling_autoupgrade]

# Heuristic only — the exact wording AutoUpgrade uses for job status in
# -noconsole output was NOT confirmed against Oracle's own docs (searched;
# not pinned down). This checks for "ERROR" and a nonzero rc as the most
# likely failure signals, but the real first run's output is what actually
# confirms whether this check is well-formed — read the full output above
# regardless of whether this task fires.
#
# CRITICAL BUG found during the road-to-oracleocm review pass, fixed here:
# the `when` below used to read
#   rolling_autoupg_deploy_result.rc != 0 or "'ERROR' in rolling_autoupg_deploy_result.stdout"
# — note the stray double-quote pair wrapping only the SECOND half of the
# expression. YAML treats that quote as a literal character (it's a plain
# scalar; mid-string quotes aren't special), so the whole line was handed to
# Jinja as-is. Jinja, unlike YAML, DOES treat double quotes as string
# delimiters — so Jinja parsed "'ERROR' in rolling_autoupg_deploy_result.stdout"
# as a STRING LITERAL (its content being the literal text between the
# quotes), not as an "in" membership test. A non-empty string is always
# truthy, so the whole `... or <truthy string>` condition was ALWAYS TRUE —
# this fail: task would have fired on every single run of
# rolling_autoupgrade, including a fully successful deploy. Never actually
# hit live (caught here first), but would have on the very next real run.
# Fixed by dropping the stray quotes entirely — no quoting is needed here.
- name: "Fail loudly if AutoUpgrade deploy looks like it failed (rc != 0 or ERROR in output) — verify against the real output above regardless"
  fail:
    msg: >-
      AutoUpgrade deploy returned rc={{ rolling_autoupg_deploy_result.rc }}
      and/or reported an ERROR — read the full output above before doing
      anything else. Do not proceed to rolling_switchover until this is
      resolved.
  when: rolling_autoupg_deploy_result.rc != 0 or 'ERROR' in rolling_autoupg_deploy_result.stdout
  tags: [rolling_autoupgrade]

# Post-upgrade summary — real request from James: the prior version of this
# report only showed the banner + open_mode/role, and didn't call out
# invalid objects, DBA_REGISTRY component status, or a combined
# instance+database view. Rebuilt as one consolidated, explicitly-formatted
# report: GV$INSTANCE joined to GV$DATABASE (host_name, instance status,
# software version, role, open_mode — cluster-wide, all RAC members in one
# result set), DBA_OBJECTS invalid-object counts, and DBA_REGISTRY component
# status — the standard checklist an Oracle DBA reviews immediately after
# any upgrade. NLS_TIMESTAMP_FORMAT is set explicitly up front so nothing in
# this report relies on the verbose default TIMESTAMP display (fractional
# seconds + AM/PM) that made earlier SQL*Plus output in this role hard to
# read.
- name: "Write SQL script: apexdb_stby post-upgrade summary (version, GV$INSTANCE+GV$DATABASE, invalid objects, DBA_REGISTRY)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_check_stby_post_autoupgrade.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 200
      set pagesize 100
      alter session set nls_timestamp_format = 'DD-MON-YY HH24:MI:SS';

      column banner format a80
      column host_name format a20 truncated
      column instance_name format a15 truncated
      column status format a12
      column database_role format a18
      column open_mode format a18
      column comp_name format a40 truncated

      prompt
      prompt ============================================================
      prompt  APEXDB_STBY -- POST-UPGRADE SUMMARY
      prompt ============================================================
      prompt
      prompt ----- Database Software Version -----
      select banner from v$version where banner like 'Oracle Database%';

      prompt
      prompt ----- Instance / Role / Open Mode (GV$INSTANCE + GV$DATABASE, all RAC members) -----
      select i.inst_id,
             i.instance_name,
             i.host_name,
             i.status,
             i.version,
             d.database_role,
             d.open_mode
        from gv$instance i
        join gv$database d on d.inst_id = i.inst_id
       order by i.inst_id;

      prompt
      prompt ----- Invalid Objects By Owner (expect 0 rows after UTLRP) -----
      select owner, count(*) as invalid_count
        from dba_objects
       where status = 'INVALID'
       group by owner
       order by invalid_count desc;

      prompt
      prompt ----- Total Invalid Object Count -----
      select count(*) as total_invalid_objects
        from dba_objects
       where status = 'INVALID';

      prompt
      prompt ----- DBA_REGISTRY Component Status (expect VALID everywhere) -----
      select comp_name, version, status
        from dba_registry
       order by comp_name;

      exit;
  tags: [rolling_autoupgrade]

- name: "Check apexdb_stby's version/role/open_mode/invalid-objects/registry after AutoUpgrade"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_stby_post_autoupgrade.sql
  register: rolling_stby_post_autoupgrade_check
  changed_when: false
  tags: [rolling_autoupgrade]

- name: "Show apexdb_stby's post-upgrade summary (version / instances / invalid objects / registry)"
  debug:
    var: rolling_stby_post_autoupgrade_check.stdout_lines
  tags: [rolling_autoupgrade]

# Turned into a real gate rather than an advisory-only note — matching this
# file's established "don't just print a message, assert it" pattern (the
# same fix applied earlier to the single-instance preflight check).
- name: "Fail loudly if apexdb_stby's banner does not show Oracle Database 19c after AutoUpgrade — the upgrade did not actually take"
  fail:
    msg: >-
      Expected 'Oracle Database 19c' in the version banner above (see the
      post-upgrade summary) — the upgrade did not take. Stop here; do not
      proceed to rolling_switchover until this is understood.
  when: "'19c' not in rolling_stby_post_autoupgrade_check.stdout"
  tags: [rolling_autoupgrade]

- name: "Explain expected role/open_mode after AutoUpgrade (version is now asserted above, not just advisory)"
  debug:
    msg: >-
      Expected: DATABASE_ROLE still LOGICAL STANDBY, OPEN_MODE still READ
      WRITE (SWITCHOVER hasn't happened yet) for every instance in the
      GV$INSTANCE/GV$DATABASE report above. Any invalid objects or
      non-VALID DBA_REGISTRY components should be reviewed before
      rolling_switchover, even though they don't hard-fail this task — some
      INVALID counts are expected transiently and get resolved by utlrp
      (upg1.run_utlrp=yes in the AutoUpgrade config already ran this).
  tags: [rolling_autoupgrade]

# AutoUpgrade's own deploy job includes post-checks/post-fixups, but SQL
# Apply itself is a separate, ongoing process on this standby — confirmed
# via Oracle's own MAA deck that it's worth explicitly re-checking (and, if
# needed, manually restarting) after any maintenance that touches the
# database, rather than assuming it's still running.
- name: "Check SQL Apply health on apexdb_stby (after AutoUpgrade)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_check_logstdby_health.sql
  register: rolling_logstdby_health_after
  changed_when: false
  failed_when: false
  tags: [rolling_autoupgrade]

- name: "Show SQL Apply health (after AutoUpgrade) — compare against the before-AutoUpgrade output further above"
  debug:
    var: rolling_logstdby_health_after.stdout_lines
  tags: [rolling_autoupgrade]

# Dedicated, single-purpose count query rather than parsing the combined
# health-check output above — much less fragile than trying to detect rows
# inside a multi-section report.
# Real gap found on independent review (2026-08-22, third-pass): this used
# to write to the SAME filename (rolling_count_logstdby_progress.sql) as the
# earlier pre-stop idempotency check further up this section. Content is
# currently identical so it wasn't a live bug, but two logically distinct
# checkpoints silently sharing one destination path means a future edit to
# either one could invisibly change or clobber the other with no filename to
# signal they're now different queries. Renamed to its own distinct file.
#
# CONFIRMED LIVE BUG (2026-08-22, found via a real --tags rolling_switchover
# run): this originally queried GV$LOGSTDBY_PROGRESS, same as the check that
# later caused DBMS_ROLLING.SWITCHOVER to fail with ORA-45427 — see that
# section's own comment for the full story. GV$LOGSTDBY_PROGRESS is
# progress/SCN-watermark metadata and can show a row even after the apply
# engine has actually stopped, which is exactly what happened here: this
# check ran right after AutoUpgrade's DEPLOY step (which bounces the
# database instance as part of the upgrade, necessarily stopping Redo Apply
# too), saw a stale GV$LOGSTDBY_PROGRESS row, concluded "already running,
# no restart needed" (see the real captured output: "GV$LOGSTDBY_PROGRESS
# already showed an active apply process — not re-issuing the start
# command"), and skipped the restart — leaving Redo Apply genuinely stopped
# from that point on. Confirmed via James's own DBA_LOGSTDBY_EVENTS query:
# the last real event was a clean "User initiated stop apply successfully
# completed" around the DEPLOY job's start time, with nothing after it.
# Fixed the same way as rolling_switchover's equivalent check: query
# GV$LOGSTDBY_STATE instead — it's only populated while SQL Apply is
# genuinely active (confirmed via Oracle's own V$LOGSTDBY_STATE reference).
- name: "Write SQL script: count active SQL Apply processes on apexdb_stby (post-deploy check — GV$LOGSTDBY_STATE, distinct file from the earlier pre-stop idempotency check)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_count_logstdby_state_post_deploy.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 50
      set tab off
      select count(*) from gv$logstdby_state;
      exit;
  tags: [rolling_autoupgrade]

# Real gap found on independent review (2026-08-22, second-pass): every
# other SQL exec task in this section fails loudly on an ORA- in its output
# — this one didn't. If this query fails for any reason (stale SID after
# AutoUpgrade's instance handling, database momentarily unreachable, etc.),
# sqlplus still returns rc 0 and prints the ORA- text instead of a bare
# integer (documented elsewhere in this file as the reason `changed_when`/
# `failed_when` never trust rc alone). `stdout | trim | int` against
# non-numeric text doesn't error — Jinja's `int` filter silently falls back
# to 0 — so `rolling_logstdby_apply_running` below would come back `false`
# even though the real problem is "this query never ran successfully," and
# the role would proceed to (redundantly, and against a possibly-broken
# connection) reissue the START LOGICAL STANDBY APPLY command instead of
# surfacing the real failure. Fixed by failing loudly here too, matching the
# rest of the file's own stated philosophy. Also switched to GV$ (fourth-
# pass review) — cluster-wide, so this reads correctly regardless of which
# instance AutoUpgrade's own RAC handling left apply running on. Switched
# from GV$LOGSTDBY_PROGRESS to GV$LOGSTDBY_STATE 2026-08-22 — see the
# comment on the SQL-writing task above for why (a real, confirmed false
# positive from this exact check, not a hypothetical one).
- name: "Count active SQL Apply processes on apexdb_stby (GV$LOGSTDBY_STATE, cluster-wide)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_count_logstdby_state_post_deploy.sql
  register: rolling_logstdby_count_result
  changed_when: false
  failed_when: "'ORA-' in rolling_logstdby_count_result.stdout"
  tags: [rolling_autoupgrade]

- name: "Set fact: is SQL Apply currently running on apexdb_stby (GV$LOGSTDBY_STATE row count > 0)"
  set_fact:
    rolling_logstdby_apply_running: "{{ (rolling_logstdby_count_result.stdout | trim | int) > 0 }}"
  tags: [rolling_autoupgrade]

- name: "Write SQL script: restart SQL Apply (real, documented command — used only if it isn't already running)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_start_logstdby_apply.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      alter database start logical standby apply immediate;
      exit;
  tags: [rolling_autoupgrade]

- name: "Restart SQL Apply on apexdb_stby if it isn't already running (manual step per Oracle's own MAA guidance — not always required)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_autoupg_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_start_logstdby_apply.sql
  register: rolling_start_logstdby_result
  changed_when: "'Database altered' in rolling_start_logstdby_result.stdout"
  failed_when: "'ORA-' in rolling_start_logstdby_result.stdout"
  when: not rolling_logstdby_apply_running
  tags: [rolling_autoupgrade]

- name: "Show restart-SQL-Apply output"
  debug:
    var: rolling_start_logstdby_result.stdout_lines
  when: not rolling_logstdby_apply_running
  tags: [rolling_autoupgrade]

- name: "Notify — SQL Apply already running, no restart needed"
  debug:
    msg: "GV$LOGSTDBY_PROGRESS already showed an active apply process — not re-issuing the start command."
  when: rolling_logstdby_apply_running
  tags: [rolling_autoupgrade]

# Real gap in the original scope of this section: AutoUpgrade upgrades the
# database in place (dictionary + software), but does NOT update CRS's own
# resource registration for apexdb_stby, which still points at the OLD
# 12.2.0.1 db_home. Without this, any future CRS-driven stop/start of
# apexdb_stby (including our own earlier srvctl stop/start instance tasks)
# would try to start it from the wrong Oracle home.
- name: "Move apexdb_stby's CRS registration to the new 19c Oracle home"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_autoupg_node }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ rolling_autoupg_sid }}"
  command: >
    {{ db19c_home }}/bin/srvctl modify database -db {{ dg_standby_db_unique_name }}
    -oraclehome {{ db19c_home }}
  register: rolling_srvctl_modify_home
  changed_when: rolling_srvctl_modify_home.rc == 0
  tags: [rolling_autoupgrade]

# Same list-in-prose-string formatting bug as the 3 already fixed
# elsewhere in this file (embedding *.stdout_lines inside a msg: string
# forces Jinja to stringify the list via Python repr — unreadable single-
# line blob). Found in the same fourth-pass review; this was the one
# instance of the pattern left inside rolling_autoupgrade itself.
- name: "Show srvctl modify (new Oracle home) output"
  debug:
    msg: "rc: {{ rolling_srvctl_modify_home.rc }}"
  tags: [rolling_autoupgrade]

- name: "Show srvctl modify (new Oracle home) command output lines"
  debug:
    var: rolling_srvctl_modify_home.stdout_lines
  tags: [rolling_autoupgrade]

# Updated 2026-08-22 — rolling_switchover has since been built. Task
# name/wording kept close to the original ("not yet built") phrasing but
# corrected so it doesn't point at work that now exists.
- name: "Notify — AutoUpgrade complete. Next step is --tags rolling_switchover (DBMS_ROLLING.SWITCHOVER), now built"
  debug:
    msg: >-
      apexdb_stby's software has been upgraded to 19c (confirmed above), SQL
      Apply health checked before/after, and CRS's registration now points
      at db19c_home. DBA_ROLLING_DATABASES.UPDATE_PROG for apexdb_stby
      should now reflect this (check via --tags rolling_status). Next:
      --tags rolling_switchover (DBMS_ROLLING.SWITCHOVER) — the actual
      point of no return per Oracle's own docs (ROLLBACK_PLAN stops working
      once this is called).
  tags: [rolling_autoupgrade]

# ============================================================================
# ROLLBACK REFERENCE — DBMS_ROLLING.ROLLBACK_PLAN — deliberately NOT
# automated as a task. Confirmed verbatim from Oracle's own 26c Data Guard
# docs ("Rolling Back a Rolling Upgrade"), same "invoking this should be a
# deliberate human decision" stance already applied to this whole role.
# Exact requirements, straight from Oracle's docs:
#
#   EXECUTE DBMS_ROLLING.ROLLBACK_PLAN;
#
#   1. Can ONLY be called if DBMS_ROLLING.SWITCHOVER has NOT been previously
#      called — SWITCHOVER (built under --tags rolling_switchover, further
#      down this file) is the real point of no return, matching what this
#      file's header/comments already say.
#   2. Before calling it, the transient logical standby (apexdb_stby) must
#      be set back to a MOUNTED state — a flashback database operation is
#      imminent as part of the rollback, and Oracle's docs are explicit that
#      ROLLBACK_PLAN will not execute successfully unless it's mounted only
#      (not open read write as a logical standby).
#   3. If the Oracle Database software was ALREADY upgraded by the point
#      you're rolling back (i.e. AutoUpgrade's deploy step above has already
#      run) — you must additionally restart the resultant physical
#      standbys on the OLDER (12.2.0.1) software version yourself, and start
#      media recovery on them manually. Rollback gets materially more
#      involved once AutoUpgrade has actually deployed against apexdb_stby
#      than it is before that point — worth knowing before treating
#      rolling_autoupgrade as casually reversible.
#
# Not wired into this role as a task, on purpose: given requirement #2 needs
# a real decision about database state, and requirement #3 depends entirely
# on how far the process actually got, this is exactly the kind of step a
# human should drive interactively, not something a playbook silently
# assumes the right shape for.
# ============================================================================

# ============================================================================
# ROLLING_SWITCHOVER — DBMS_ROLLING.SWITCHOVER — the actual point of no
# return per Oracle's own docs (confirmed via the DBMS_ROLLING PL/SQL
# Packages and Types Reference, 19c): SWITCHOVER "can only be called after
# you have manually upgraded the transient logical standby and opened it on
# the higher Oracle Database version" (already true — apexdb_stby was
# upgraded and confirmed on 19c in --tags rolling_autoupgrade above), and
# ROLLBACK_PLAN's own doc explicitly says it "can only be called if the
# configuration has not yet gone through a switchover operation" — so this
# is the last point where rolling back is still an option at all.
#
# Confirmed from the same reference:
#   - SWITCHOVER() takes no parameters.
#   - It "performs a switchover between the current primary database (also
#     known as the TGM) and the transient logical standby database (also
#     known as the LGM). At the successful completion of the procedure, the
#     LGM assumes the primary role."
#   - Must be executed on the CURRENT primary (apexdb, still on 12.2.0.1 —
#     only apexdb_stby's software was upgraded so far), same as every other
#     DBMS_ROLLING call in this file so far.
#   - Exceptions include ORA-45427 ("logical standby Redo Apply process was
#     not running") — Redo Apply must be running on apexdb_stby before this
#     is called, checked explicitly below rather than assumed still true
#     from whenever --tags rolling_autoupgrade last ran (this tag can be run
#     as its own separate invocation, per this file's established
#     "each tag section re-discovers what it needs, doesn't assume state
#     from another tag's run" principle — the same reason its own srvctl
#     discovery below doesn't reuse rolling_autoupgrade's facts).
#   - Default parameters (SWITCH_LGM_LAG_WAIT=1, UPDATED_LGS_WAIT=1) mean
#     SWITCHOVER can legitimately wait — the timeouts involved
#     (UPDATED_LGS_TIMEOUT defaults to 10800s = 3 hours) only matter if
#     there are Leading Group Standbys, which this lab doesn't have
#     (TOTAL_DATABASES=2, PARTICIPATING_DATABASES=2 per the DBA_ROLLING_
#     STATUS output already seen — just apexdb and apexdb_stby). Still
#     wrapped in async/poll below rather than assumed instant, given what's
#     actually at stake if an SSH-connected shell call times out mid-
#     switchover.
#
# What SWITCHOVER does NOT do: it does not touch the old primary's Oracle
# software or configure it as a physical standby — that is FINISH_PLAN's
# job specifically (its own Usage Notes: "can only be called after you have
# remounted the former primary and remaining physical standbys on the
# higher Oracle Database version"). FINISH_PLAN is deliberately NOT built
# here — scoped separately (--tags rolling_finish), same reasoning as
# SWITCHOVER was kept separate from rolling_autoupgrade.
# ============================================================================

- name: "Write SQL script: check DBA_ROLLING_STATUS status/phase before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_status_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set verify off
      set pagesize 0
      set linesize 200
      set tab off
      select status || '|' || phase from dba_rolling_status;
      exit;
  tags: [rolling_switchover]

- name: "Check DBA_ROLLING_STATUS status/phase before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_status_check.sql
  register: rolling_switchover_status_result
  changed_when: false
  tags: [rolling_switchover]

- name: "Fail loudly if DBA_ROLLING_STATUS returned nothing — no active rolling upgrade plan found"
  fail:
    msg: >-
      DBA_ROLLING_STATUS returned no rows — there's no active rolling
      upgrade plan to switch over. Run --tags rolling_status for the full
      picture before proceeding.
  when: (rolling_switchover_status_result.stdout | trim | length) == 0
  tags: [rolling_switchover]

- name: "Set fact: DBA_ROLLING_STATUS status/phase before SWITCHOVER"
  set_fact:
    rolling_switchover_plan_status: "{{ (rolling_switchover_status_result.stdout | trim).split('|')[0] | trim }}"
    rolling_switchover_plan_phase: "{{ (rolling_switchover_status_result.stdout | trim).split('|')[1] | trim }}"
  tags: [rolling_switchover]

# Real gap found in a live run (2026-08-22): the first version of this check
# required PHASE to be EXACTLY 'SWITCH PENDING' and STATUS to be EXACTLY
# 'READY' — but after a real SWITCHOVER() call actually started and then hit
# ORA-45427 (see the Redo Apply check further up for that whole story),
# DBA_ROLLING_STATUS legitimately changed to STATUS='ERROR', PHASE='SWITCH'
# (confirmed real values from that run). Per Oracle's own docs (DBMS_ROLLING
# Overview): "all the procedures can be called again to resume the rolling
# upgrade after an error or interruption" — this is a normal, resumable
# state, not a reason to block. Also per the same docs' PHASE description,
# PHASE='SWITCH' covers "activities related to the switchover... initiated
# when you call DBMS_ROLLING.SWITCHOVER" — 'SWITCH PENDING' (not yet
# attempted) and bare 'SWITCH' (attempted, possibly errored) are both
# legitimate pre-call states; matched via startswith rather than an exact
# string so any other 'SWITCH ...' sub-state isn't blocked by a guess at an
# exhaustive list this role was never able to fully confirm from docs.
# STATUS is checked more conservatively (only READY or ERROR allowed) since
# there's no confirmed exhaustive list of every possible STATUS value
# either, and something unanticipated here is worth a human look rather
# than silently proceeding.
- name: "Fail loudly if the plan isn't at (or resumably retrying) the SWITCH phase — SWITCHOVER isn't the right next step yet"
  fail:
    msg: >-
      DBA_ROLLING_STATUS shows STATUS='{{ rolling_switchover_plan_status }}',
      PHASE='{{ rolling_switchover_plan_phase }}' — expected PHASE starting
      with 'SWITCH' (SWITCH PENDING = not yet attempted, or SWITCH = a
      previous attempt to resume) and STATUS of READY or ERROR. Run
      --tags rolling_status for the full DBA_ROLLING_STATUS/DATABASES/
      STATISTICS/EVENTS picture before proceeding.
  when: >-
    not (rolling_switchover_plan_phase is match('SWITCH')) or
    rolling_switchover_plan_status not in ['READY', 'ERROR']
  tags: [rolling_switchover]

- name: "Notify — plan is READY, proceeding to the pre-SWITCHOVER Redo Apply check"
  debug:
    msg: >-
      DBA_ROLLING_STATUS confirms STATUS=READY,
      PHASE={{ rolling_switchover_plan_phase }} — apexdb_stby is upgraded
      and this plan is ready for DBMS_ROLLING.SWITCHOVER.
  when: rolling_switchover_plan_status == 'READY'
  tags: [rolling_switchover]

# STATUS=ERROR means a previous DBMS_ROLLING.SWITCHOVER call was actually
# attempted and failed partway (confirmed resumable per Oracle's own docs —
# see the comment on the check above). Show what actually went wrong last
# time before the PAUSE further down lets a human decide whether to retry.
- name: "Write SQL script: show recent DBA_ROLLING_EVENTS (plan previously ERRORed — show why before resuming)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_recent_events.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 250
      alter session set nls_timestamp_format = 'DD-MON-YY HH24:MI';
      column type format a8
      column message format a70 word_wrapped
      select * from (
        select eventid, event_time, type, message, status, instid, revision
          from dba_rolling_events
         order by eventid desc
      ) where rownum <= 10
       order by eventid;
      exit;
  when: rolling_switchover_plan_status == 'ERROR'
  tags: [rolling_switchover]

- name: "Show recent DBA_ROLLING_EVENTS"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_recent_events.sql
  register: rolling_switchover_recent_events_result
  when: rolling_switchover_plan_status == 'ERROR'
  changed_when: false
  tags: [rolling_switchover]

- name: "Show recent DBA_ROLLING_EVENTS output"
  debug:
    var: rolling_switchover_recent_events_result.stdout_lines
  when: rolling_switchover_plan_status == 'ERROR'
  tags: [rolling_switchover]

- name: "Notify — plan previously ERRORed during SWITCH. Review the events above; the PAUSE further down will let you retry DBMS_ROLLING.SWITCHOVER"
  debug:
    msg: >-
      DBA_ROLLING_STATUS shows STATUS=ERROR, PHASE={{ rolling_switchover_plan_phase }}
      — a previous DBMS_ROLLING.SWITCHOVER call was attempted and failed
      (see DBA_ROLLING_EVENTS above for why). This is a normal, resumable
      state per Oracle's own docs — proceeding will retry SWITCHOVER, not
      start something new. Make sure whatever caused the error above is
      actually fixed before continuing.
  when: rolling_switchover_plan_status == 'ERROR'
  tags: [rolling_switchover]

# Fresh discovery, not reused from --tags rolling_autoupgrade's own facts —
# this tag must work as its own standalone invocation. CRS's registration
# for apexdb_stby was already moved to db19c_home earlier in
# rolling_autoupgrade, so db19c_home's srvctl is the correct one to use now
# (unlike rolling_autoupgrade's own discovery, which ran before that move).
- name: "Discover apexdb_stby's currently running instance(s) via srvctl — used only to pick a connection target for the pre-SWITCHOVER Redo Apply check"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db19c_home }}/bin/srvctl status database -d {{ dg_standby_db_unique_name }}"
  register: rolling_switchover_srvctl_status
  changed_when: false
  tags: [rolling_switchover]

- name: Show srvctl status database output (apexdb_stby, before SWITCHOVER)
  debug:
    var: rolling_switchover_srvctl_status.stdout_lines
  tags: [rolling_switchover]

- name: "Set fact: apexdb_stby's currently running instances, parsed from srvctl status"
  set_fact:
    rolling_switchover_stby_running_instances: "{{ rolling_switchover_srvctl_status.stdout | regex_findall('Instance (\\S+) is running on node (\\S+)') }}"
  tags: [rolling_switchover]

- name: "Fail loudly if NO apexdb_stby instance is running — need at least one connectable instance to check Redo Apply"
  fail:
    msg: >-
      No running apexdb_stby instance found via srvctl status — see output
      above. Investigate before attempting SWITCHOVER.
  when: (rolling_switchover_stby_running_instances | length) == 0
  tags: [rolling_switchover]

- name: "Set fact: apexdb_stby's connection target for the pre-SWITCHOVER Redo Apply check"
  set_fact:
    rolling_switchover_stby_sid: "{{ rolling_switchover_stby_running_instances[0][0] }}"
    rolling_switchover_stby_node: "{{ rolling_switchover_stby_running_instances[0][1] }}"
  tags: [rolling_switchover]

# Real bug found in a live run (2026-08-22): this check originally queried
# GV$LOGSTDBY_PROGRESS, which showed a row (apply "confirmed running") right
# before DBMS_ROLLING.SWITCHOVER itself immediately failed with:
#   ORA-45427: logical standby Redo Apply process was not running
# Root cause, confirmed via Oracle's own V$LOGSTDBY_PROGRESS/V$LOGSTDBY_STATE
# reference docs: V$LOGSTDBY_PROGRESS is progress/SCN-watermark metadata — a
# row can persist there even after the actual apply engine has stopped or
# died, so its presence is NOT proof the engine is currently running. There
# is also a documented, known MOS note for this exact failure (Doc ID
# 2696017.1, "DBMS Rolling Upgrade Switchover Fails with ORA-45427") — its
# fix content is behind a My Oracle Support login this role can't reach, but
# its own summary confirms apply server processes can die out from under a
# stale GV$LOGSTDBY_PROGRESS row, matching what was observed here.
# GV$LOGSTDBY_STATE is the correct view instead: it is only populated while
# SQL Apply is genuinely active (STATE one of INITIALIZING, LOADING
# DICTIONARY, WAITING ON GAP, APPLYING, WAITING FOR DICTIONARY LOGS, IDLE —
# confirmed from Oracle's own V$LOGSTDBY_STATE reference); zero rows means
# Redo Apply is not actually running, full stop.
- name: "Write SQL script: display Redo Apply state on apexdb_stby (GV$LOGSTDBY_STATE, cluster-wide) before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_apply_state.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 150
      column state format a24
      column realtime_apply format a14
      select inst_id, state, realtime_apply, session_id
        from gv$logstdby_state
       order by inst_id;
      exit;
  tags: [rolling_switchover]

- name: "Check Redo Apply state on apexdb_stby before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_apply_state.sql
  register: rolling_switchover_apply_state_result
  changed_when: false
  tags: [rolling_switchover]

- name: "Show Redo Apply state on apexdb_stby before SWITCHOVER"
  debug:
    var: rolling_switchover_apply_state_result.stdout_lines
  tags: [rolling_switchover]

- name: "Write SQL script: count active Redo Apply processes on apexdb_stby (GV$LOGSTDBY_STATE, cluster-wide)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_apply_count.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set pagesize 0
      set linesize 50
      set tab off
      select count(*) from gv$logstdby_state;
      exit;
  tags: [rolling_switchover]

- name: "Count active Redo Apply processes on apexdb_stby before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_apply_count.sql
  register: rolling_switchover_apply_count_result
  changed_when: false
  failed_when: "'ORA-' in rolling_switchover_apply_count_result.stdout"
  tags: [rolling_switchover]

- name: "Set fact: is Redo Apply actively running on apexdb_stby (GV$LOGSTDBY_STATE row count > 0)"
  set_fact:
    rolling_switchover_apply_running: "{{ (rolling_switchover_apply_count_result.stdout | trim | int) > 0 }}"
  tags: [rolling_switchover]

# Confirmed via a real Oracle Support note James pulled up (Doc ID
# 2696017.1 / KB127726, "DBMS Rolling Upgrade Switchover Fails with
# ORA-45427"): this exact error can also happen because an apply SERVER
# PROCESS died on a stuck/unapplicable transaction (ORA-26808), which needs
# `ALTER DATABASE START LOGICAL STANDBY APPLY IMMEDIATE SKIP FAILED
# TRANSACTION` rather than a plain restart. Checked here rather than
# assumed either way — James's own real DBA_LOGSTDBY_EVENTS output on this
# run showed a clean "User initiated stop apply successfully completed"
# (almost certainly AutoUpgrade's own instance bounce during DEPLOY, not a
# crash) with no ORA-268xx/"died unexpectedly" entry, so a plain restart was
# the right call that time — but this check exists so the next time isn't
# just assumed to be the same case.
- name: "Write SQL script: check DBA_LOGSTDBY_EVENTS for a died/crashed apply process (informs plain restart vs SKIP FAILED TRANSACTION)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_apply_crash_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 200
      alter session set nls_timestamp_format = 'DD-MON-YY HH24:MI:SS';
      column status format a40 truncated
      column event format a60 truncated
      select event_timestamp, status, event
        from dba_logstdby_events
       where status like 'ORA-268%' or event like '%died unexpectedly%'
       order by event_timestamp desc;
      exit;
  when: not rolling_switchover_apply_running
  tags: [rolling_switchover]

- name: "Check DBA_LOGSTDBY_EVENTS for a died/crashed apply process"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_apply_crash_check.sql
  register: rolling_switchover_apply_crash_check_result
  when: not rolling_switchover_apply_running
  changed_when: false
  tags: [rolling_switchover]

- name: "Show DBA_LOGSTDBY_EVENTS crash check (empty means no evidence of a died apply process — a plain restart should be safe)"
  debug:
    var: rolling_switchover_apply_crash_check_result.stdout_lines
  when: not rolling_switchover_apply_running
  tags: [rolling_switchover]

# Real remediation, not just a hard fail — matching James's standing
# instruction elsewhere in this project ("offer to fix it and ask me for
# confirmation, don't just fail"). This is a materially lower-risk action
# than the RAC-instance remediation that was deliberately removed earlier
# (stopping/starting whole instances) — starting logical standby apply is a
# single, deterministic, already-proven command this same role runs
# elsewhere (the rolling_autoupgrade tuning block), so auto-offering it here
# is consistent, not a reversal of that earlier decision.
- name: "PAUSE — Redo Apply is not running on apexdb_stby. Offer to restart it before SWITCHOVER."
  pause:
    prompt: >-
      GV$LOGSTDBY_STATE shows no active Redo Apply process on apexdb_stby
      (see state/count above), and the DBA_LOGSTDBY_EVENTS crash check just
      above shows whether there's evidence of a died apply process. Type
      "skip" and press ENTER to run ALTER DATABASE START LOGICAL STANDBY
      APPLY IMMEDIATE SKIP FAILED TRANSACTION (only if the crash check
      above actually showed a died/ORA-268xx event) — otherwise just press
      ENTER for a plain ALTER DATABASE START LOGICAL STANDBY APPLY
      IMMEDIATE. Ctrl+C to stop here and investigate manually instead.
  register: rolling_switchover_apply_restart_choice
  when: not rolling_switchover_apply_running
  tags: [rolling_switchover]

- name: "Write SQL script: restart Redo Apply on apexdb_stby before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_apply_restart.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      {% if rolling_switchover_apply_restart_choice.user_input is defined and rolling_switchover_apply_restart_choice.user_input | trim | lower == 'skip' %}
      alter database start logical standby apply immediate skip failed transaction;
      {% else %}
      alter database start logical standby apply immediate;
      {% endif %}
      exit;
  when: not rolling_switchover_apply_running
  tags: [rolling_switchover]

- name: "Restart Redo Apply on apexdb_stby before SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_apply_restart.sql
  register: rolling_switchover_apply_restart_result
  when: not rolling_switchover_apply_running
  changed_when: "'Database altered' in rolling_switchover_apply_restart_result.stdout"
  failed_when: >-
    rolling_switchover_apply_restart_result is not skipped and
    'ORA-' in rolling_switchover_apply_restart_result.stdout
  tags: [rolling_switchover]

- name: "Show Redo Apply restart output"
  debug:
    var: rolling_switchover_apply_restart_result.stdout_lines
  when: not rolling_switchover_apply_running
  tags: [rolling_switchover]

- name: "Re-check Redo Apply state on apexdb_stby after restart (confirm the fix actually took before retrying SWITCHOVER)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_apply_count.sql
  register: rolling_switchover_apply_recheck_result
  when: not rolling_switchover_apply_running
  changed_when: false
  failed_when: "'ORA-' in rolling_switchover_apply_recheck_result.stdout"
  tags: [rolling_switchover]

- name: "Fail loudly if Redo Apply still isn't running on apexdb_stby after the restart attempt — needs real investigation, not another retry"
  fail:
    msg: >-
      ALTER DATABASE START LOGICAL STANDBY APPLY IMMEDIATE ran (see output
      above) but GV$LOGSTDBY_STATE still shows no active apply process on
      apexdb_stby. This needs real investigation (check the alert log and
      DBA_LOGSTDBY_EVENTS on apexdb_stby) before touching
      DBMS_ROLLING.SWITCHOVER again.
  when: >-
    (not rolling_switchover_apply_running) and
    (rolling_switchover_apply_recheck_result.stdout | trim | int) == 0
  tags: [rolling_switchover]

- name: "Notify — Redo Apply confirmed running on apexdb_stby, ready for SWITCHOVER"
  debug:
    msg: >-
      GV$LOGSTDBY_STATE confirms an active Redo Apply process on
      apexdb_stby ({{ rolling_switchover_stby_sid }} on
      {{ rolling_switchover_stby_node }}){{ ' (restarted just now)' if not rolling_switchover_apply_running else '' }}.
  tags: [rolling_switchover]

- name: "PAUSE — about to call DBMS_ROLLING.SWITCHOVER(). This is the actual point of no return."
  pause:
    prompt: >-
      DBA_ROLLING_STATUS shows STATUS={{ rolling_switchover_plan_status }},
      PHASE={{ rolling_switchover_plan_phase }} and Redo Apply is running
      on apexdb_stby (checks above). About to run
      EXECUTE DBMS_ROLLING.SWITCHOVER(); against apexdb (the current
      primary). At successful completion, apexdb_stby becomes the new
      PRIMARY and apexdb is left in a transitional state until
      rolling_finish (DBMS_ROLLING.FINISH_PLAN, built further down this
      file) is run.
      DBMS_ROLLING.ROLLBACK_PLAN can no longer be used once this succeeds —
      per Oracle's own docs, it "can only be called if the configuration
      has not yet gone through a switchover operation". Press ENTER to
      proceed, Ctrl+C to stop here instead.
  tags: [rolling_switchover]

- name: "Write SQL script: DBMS_ROLLING.SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      set timing on
      EXECUTE DBMS_ROLLING.SWITCHOVER();
      exit;
  tags: [rolling_switchover]

# Wrapped in async/poll rather than a plain synchronous shell call — a
# deliberate, one-time exception to this file's own established convention
# (see the comment above DBMS_ROLLING.START_PLAN further up: "no async/poll
# wrapper, consistent with the rest of the file"). The reason it's different
# here, not just inconsistent: DBMS_ROLLING.SET_PARAMETER's own parameter
# table gives START_PLAN's equivalent wait a 60-second default timeout
# (READY_LGM_LAG_TIMEOUT), while SWITCHOVER's (UPDATED_LGS_TIMEOUT,
# DICTIONARY_LOAD_TIMEOUT-adjacent waits) default to 10800s = 3 hours if
# there are Leading Group Standbys — a materially different, Oracle-
# documented order of magnitude, not an assumption on this role's part.
# This lab has no Leading Group Standbys today (TOTAL_DATABASES=2 per
# DBA_ROLLING_STATUS — just apexdb and apexdb_stby), so it should be fast in
# practice — but a plain synchronous SSH-connected shell call has no
# business assuming that, given what's actually at stake here.
- name: "Run: DBMS_ROLLING.SWITCHOVER — point of no return, apexdb_stby becomes the new primary"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_switchover.sql
  async: 7200
  poll: 15
  register: rolling_switchover_result
  changed_when: "'PL/SQL procedure successfully completed' in rolling_switchover_result.stdout"
  tags: [rolling_switchover]

- name: "Show DBMS_ROLLING.SWITCHOVER output"
  debug:
    var: rolling_switchover_result.stdout_lines
  tags: [rolling_switchover]

- name: "Fail loudly if DBMS_ROLLING.SWITCHOVER looks like it failed (rc != 0 or ORA- in output) — verify against the real output above regardless"
  fail:
    msg: >-
      DBMS_ROLLING.SWITCHOVER returned rc={{ rolling_switchover_result.rc }}
      and/or reported an ORA- error — read the full output above before
      doing anything else. Check DBA_ROLLING_STATUS/EVENTS
      (--tags rolling_status) for what state the configuration is actually
      in before retrying.
  when: rolling_switchover_result.rc != 0 or 'ORA-' in rolling_switchover_result.stdout
  tags: [rolling_switchover]

- name: "Write SQL script: confirm apexdb_stby is now PRIMARY after SWITCHOVER (GV$INSTANCE + GV$DATABASE)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_post_check_stby.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 200
      set pagesize 100
      column host_name format a20 truncated
      column instance_name format a15 truncated
      column status format a12
      column database_role format a18
      column open_mode format a18
      select i.inst_id,
             i.instance_name,
             i.host_name,
             i.status,
             d.database_role,
             d.open_mode
        from gv$instance i
        join gv$database d on d.inst_id = i.inst_id
       order by i.inst_id;
      exit;
  tags: [rolling_switchover]

- name: "Check apexdb_stby's role after SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_switchover_stby_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_switchover_stby_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_post_check_stby.sql
  register: rolling_switchover_post_check_stby
  changed_when: false
  tags: [rolling_switchover]

- name: "Show apexdb_stby's role after SWITCHOVER (expect PRIMARY)"
  debug:
    var: rolling_switchover_post_check_stby.stdout_lines
  tags: [rolling_switchover]

- name: "Fail loudly if apexdb_stby is not reporting PRIMARY after SWITCHOVER"
  fail:
    msg: >-
      Expected DATABASE_ROLE=PRIMARY for apexdb_stby above —
      DBMS_ROLLING.SWITCHOVER reported success but the role doesn't show
      PRIMARY. Stop and investigate before running rolling_finish.
  when: "'PRIMARY' not in rolling_switchover_post_check_stby.stdout"
  tags: [rolling_switchover]

# apexdb (the former primary) is NOT expected to look "normal" here —
# FINISH_PLAN (built under --tags rolling_finish, further down this file)
# is what actually configures it as a physical standby. Observational
# only, matching this role's established "observe,
# don't assume" stance elsewhere — failed_when: false because an unusual
# state here (mounted, quiesced, even briefly unreachable) is expected, not
# itself a sign SWITCHOVER failed.
- name: "Write SQL script: check apexdb's (former primary) state after SWITCHOVER"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_switchover_post_check_primary.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 200
      column database_role format a18
      column open_mode format a18
      select inst_id, open_mode, database_role from gv$database order by inst_id;
      exit;
  tags: [rolling_switchover]

- name: "Check apexdb's (former primary) state after SWITCHOVER — observational only, no action taken"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_switchover_post_check_primary.sql
  register: rolling_switchover_post_check_primary
  changed_when: false
  failed_when: false
  tags: [rolling_switchover]

- name: "Show apexdb's (former primary) state after SWITCHOVER"
  debug:
    var: rolling_switchover_post_check_primary.stdout_lines
  tags: [rolling_switchover]

- name: "Explain apexdb's post-SWITCHOVER state"
  debug:
    msg: >-
      apexdb (the former primary) is not expected to look "normal" here —
      it isn't a physical standby yet, and DBMS_ROLLING.FINISH_PLAN (built
      under --tags rolling_finish) is what actually configures it as one.
      An unusual open_mode/role, or even a connection failure, above is
      expected at this point and isn't by itself evidence that SWITCHOVER
      failed — judge success from the apexdb_stby PRIMARY check further up
      instead.
  tags: [rolling_switchover]

- name: "Notify — SWITCHOVER complete. apexdb_stby is now PRIMARY. Next step is --tags rolling_finish (DBMS_ROLLING.FINISH_PLAN)"
  debug:
    msg: >-
      apexdb_stby is confirmed PRIMARY (see above). DBMS_ROLLING.
      ROLLBACK_PLAN is no longer available from this point forward. Next:
      --tags rolling_finish (DBMS_ROLLING.FINISH_PLAN) — per Oracle's own
      docs this "configures the former primary as a physical standby, and
      configures remaining physical standbys to recover the upgrade redo
      from the future primary," and can only be called after apexdb (and
      any remaining physical standbys) have been remounted on the
      already-installed 19c Oracle home (rolling_finish handles that
      remount itself). Also note: every DBMS_ROLLING call from here on
      (including FINISH_PLAN) must be executed against
      apexdb_stby now, since it — not apexdb — is the current primary.
      Scoped separately, deliberately, given how much state this step
      changes.
  tags: [rolling_switchover]

# ============================================================================
# Read-only status check — safe to run at ANY point in the rolling upgrade,
# including before INIT_PLAN has ever run (will just show no rows / an
# ORA- error that no plan exists yet — failed_when: false so that itself
# doesn't fail this task). Per Oracle's own docs: "Resuming a rolling upgrade
# involves identifying the current phase... shown in the PHASE column of the
# DBA_ROLLING_STATUS view." Oracle's own "Monitoring a Rolling Upgrade"
# section names three views specifically — DBA_ROLLING_STATUS (overall
# status), DBA_ROLLING_DATABASES (role/protection/recovery state per
# database), and DBA_ROLLING_STATISTICS (start/finish times, service
# downtime, etc.) — DBA_ROLLING_STATISTICS was missing from this check
# until now; added below. DBA_ROLLING_EVENTS is also kept here even though
# it isn't one of the three docs list under "Monitoring" specifically — it's
# the same view BUILD_PLAN warnings and DBA_ROLLING_UNSUPPORTED skip events
# surface in, genuinely useful here too. select * used for
# STATUS/DATABASES/STATISTICS/EVENTS rather than naming specific columns —
# their exact column lists weren't fully confirmed during research;
# DBA_ROLLING_PLAN's columns WERE explicitly confirmed (used above), so that
# one names columns directly.
#
# Real problem found in a live run (2026-08-22): `select *` against these
# four views produced badly wrapped, misaligned output — not a SET-line bug
# this time, but two real root causes confirmed from the actual output:
#   1. ORIGINAL_PRIMARY/FUTURE_PRIMARY (DBA_ROLLING_STATUS) and DBUN/
#      REDO_SOURCE/PROD_RID/CONS_RID (DBA_ROLLING_DATABASES) are wide,
#      space-padded VARCHAR2 columns — their real values ("apexdb") are a
#      few characters, but the column's declared width pushed the combined
#      row past LINESIZE, forcing SQL*Plus to wrap the remaining columns
#      onto new physical lines (visible in the real output as
#      TOTAL_DATABASES/PARTICIPATING_DATABASES/INIT_TIME printing on a line
#      of their own, disconnected from their own row's other values).
#   2. INIT_TIME/BUILD_TIME/START_TIME/SWITCH_TIME/FINISH_TIME/UPDATE_TIME/
#      EVENT_TIME are TIMESTAMP columns rendered with the verbose default
#      format (fractional seconds + AM/PM, e.g.
#      "22-AUG-26 01.43.58.508798 PM") — needlessly wide for a status check.
# Fixed by naming columns explicitly (all column names below were confirmed
# from that same real output, not guessed), truncating the wide VARCHAR2
# columns with COLUMN ... FORMAT aN TRUNCATE, and compacting every
# timestamp session-wide via NLS_TIMESTAMP_FORMAT. CLEAR COLUMNS between
# each view's block avoids one view's format silently leaking onto a
# same-named column in the next (e.g. STATUS means something different in
# DBA_ROLLING_STATUS vs. DBA_ROLLING_EVENTS).
# ============================================================================
- name: "Write SQL script: rolling upgrade status check"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_status.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      -- Same combined-SET-line bug as rolling_show_plan.sql (see its
      -- comment) — split out below so linesize/pagesize/tab actually take
      -- effect instead of silently no-opping after "echo on".
      set echo off
      set heading on
      set feedback on
      set tab off
      set linesize 250
      set pagesize 9999
      set verify off
      -- Seconds precision isn't needed for a status/monitoring view (rows
      -- are already ordered/identified by REVISION and EVENTID), and
      -- dropping it keeps "DD-MON-YY HH24:MI" comfortably inside the a16
      -- column width below, so nothing gets clipped mid-string.
      alter session set nls_timestamp_format = 'DD-MON-YY HH24:MI';

      prompt
      prompt ===== DBA_ROLLING_STATUS =====
      column status format a12
      column phase format a15
      column original_primary format a20 truncated
      column future_primary format a20 truncated
      column init_time format a16 truncated
      column build_time format a16 truncated
      column start_time format a16 truncated
      column switch_time format a16 truncated
      column finish_time format a16 truncated
      select revision,
             status,
             phase,
             next_instruction,
             remaining_instructions,
             coordinator_instance,
             coordinator_pid,
             original_primary,
             future_primary,
             total_databases,
             participating_databases,
             init_time,
             build_time,
             start_time,
             switch_time,
             finish_time
        from dba_rolling_status;
      clear columns

      prompt
      prompt ===== DBA_ROLLING_DATABASES =====
      column dbun format a25 truncated
      column role format a10
      column open_mode format a16
      column version format a14
      column engine_status format a14
      column redo_source format a20 truncated
      column prod_rid format a15 truncated
      column cons_rid format a15 truncated
      column update_time format a16 truncated
      select rdbid,
             dbid,
             dbun,
             role,
             open_mode,
             par,
             version,
             engine_status,
             rac,
             update_prog,
             prod_rscn,
             prod_rid,
             prod_scn,
             redo_source,
             cons_rscn,
             cons_rid,
             cons_scn,
             update_time
        from dba_rolling_databases;
      clear columns

      prompt
      prompt ===== DBA_ROLLING_STATISTICS =====
      column name format a35 truncated
      column value format a30 truncated
      column update_time format a16 truncated
      select name, value, update_time from dba_rolling_statistics;
      clear columns

      prompt
      prompt ===== DBA_ROLLING_EVENTS =====
      column type format a8
      column message format a70 word_wrapped
      column event_time format a16 truncated
      select eventid,
             event_time,
             type,
             message,
             status,
             instid,
             revision
        from dba_rolling_events
       order by eventid;
      clear columns

      exit;
  tags: [rolling_status]

# AUDIT FINDING, fixed proactively rather than waited for: this tag hardcoded
# db_home for its sqlplus connection to apexdb1, which was always correct
# until rolling_finish (built this session) started actually moving apexdb's
# CRS registration. rolling_status is meant to be safe to run any time (see
# this playbook's own header comment) and has been used constantly
# throughout this project's troubleshooting for exactly that reason — so a
# stale-home sqlplus connection here isn't a hypothetical, it's the next
# command likely to actually get run. A bequeath (local, no-listener)
# sqlplus connection has to come from a binary compatible with the target
# instance's actual running version; pointing 12.2.0.1's sqlplus at an
# instance now running 19c binaries risks exactly that kind of local
# attach failure (ORA-01034/ORA-27101-class errors), independent of and in
# addition to the PRCD-1229 family already hit against srvctl.
#
# First attempt at this fix (grepping /etc/oratab for an "apexdb1" key)
# was wrong in real testing — no such entry exists, because RAC oratab
# entries are conventionally keyed by db_unique_name ("apexdb"), not
# per-instance SID, and are typically N (no auto-start) since CRS, not
# oratab, manages startup. Worse, the workaround that followed (hand-
# editing oratab's apexdb entry back to db_home) leaves oratab actively
# disagreeing with apexdb's real CRS registration (confirmed on db19c_home).
# So this is fixed the same corrected way as rolling_finish's own discovery
# task: ask CRS directly via `srvctl config database` from db19c_home's own
# srvctl, rather than trust a file that can be — and now is — out of sync
# with it. Success means apexdb is really on db19c_home; a PRCD-1229
# failure means it's still on db_home, per srvctl's own OCR-backed version
# check (the same technique James used manually to confirm apexdb_stby's
# real home earlier in this project). Scoped with its own fact names, not
# reused from rolling_finish's — same "every tag rediscovers its own
# state" convention used everywhere else in this file, since rolling_status
# must work as a standalone invocation.
- name: "Discover apexdb's currently-registered Oracle Home by asking CRS directly (srvctl config database), not by trusting /etc/oratab"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  command: "{{ db19c_home }}/bin/srvctl config database -d {{ db_unique_name }}"
  register: rolling_status_apexdb_home_probe
  changed_when: false
  failed_when: false
  tags: [rolling_status]

- name: "Fail loudly if the CRS registration probe failed for a reason other than the expected PRCD-1229 version mismatch — don't guess which home is real"
  fail:
    msg: >-
      {{ db19c_home }}/bin/srvctl config database -d {{ db_unique_name }}
      failed (rc={{ rolling_status_apexdb_home_probe.rc }}) without the
      expected PRCD-1229 message pointing at db_home — see output below.
      Investigate before continuing rather than guess which sqlplus
      binary is safe to use against apexdb.
      {{ rolling_status_apexdb_home_probe.stdout }}
  when: >-
    rolling_status_apexdb_home_probe.rc != 0 and
    'PRCD-1229' not in rolling_status_apexdb_home_probe.stdout
  tags: [rolling_status]

- name: "Set fact: apexdb's currently-registered Oracle Home (for this tag's own sqlplus connection)"
  set_fact:
    rolling_status_apexdb_current_home: >-
      {{ db19c_home if rolling_status_apexdb_home_probe.rc == 0 else db_home }}
  tags: [rolling_status]

- name: "Run: rolling upgrade status check"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ rolling_status_apexdb_current_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ rolling_status_apexdb_current_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_status.sql
  register: rolling_status_result
  changed_when: false
  failed_when: false
  tags: [rolling_status]

- name: Show rolling upgrade status
  debug:
    msg: "{{ rolling_status_result.stdout_lines }}"
  tags: [rolling_status]

# ============================================================================
# ROLLING_FINISH — DBMS_ROLLING.FINISH_PLAN — the last step in the
# DBMS_ROLLING chain. Confirmed via Oracle's own "Using DBMS_ROLLING to
# Perform a Rolling Upgrade" chapter (19c Data Guard Concepts and
# Administration, section 14.5, steps 3-5) and the DBMS_ROLLING PL/SQL
# reference's own FINISH_PLAN entry — both read in full before building this:
#
#   - FINISH_PLAN() takes no parameters.
#   - Per its own Usage Notes: "This procedure can only be called after you
#     have remounted the former primary and remaining physical standbys on
#     the higher Oracle Database version." This lab has no physical
#     standbys besides apexdb and apexdb_stby (TOTAL_DATABASES=2,
#     PARTICIPATING_DATABASES=2 per DBA_ROLLING_STATUS, confirmed
#     throughout this whole run) — so "remaining physical standbys" is
#     empty here; only apexdb (the former primary) needs remounting.
#   - Per the docs' literal wording (section 14.5, step 4): "you must
#     manually restart and mount the former primary and remaining standby
#     databases on the higher version of Oracle Database. Mounting the
#     standby databases is especially important because the DBMS_ROLLING
#     package needs to communicate with the standby database to continue
#     the rolling upgrade." — MOUNT, not OPEN. Done below via srvctl (stop,
#     move CRS's Oracle-home registration, start -o mount) — same shape as
#     apexdb_stby's own CRS-home move earlier in rolling_autoupgrade. This
#     does NOT run AutoUpgrade against apexdb — the whole point of this
#     design is that only the transient logical standby (apexdb_stby) ever
#     runs upgrade scripts; apexdb just needs the newer binaries available
#     and recovers the already-upgraded redo stream normally once
#     FINISH_PLAN starts media recovery on it.
#   - Per the docs (section 14.5, step 5), FINISH_PLAN itself performs:
#     "Flashback of the former primary and TGP standbys", "Conversion of
#     the former primary into a physical standby", "Startup of media
#     recovery on the new redo branch" — none of that is attempted manually
#     here; this role only gets apexdb mounted on 19c binaries beforehand
#     and lets FINISH_PLAN do the actual conversion.
#   - Must now be executed against apexdb_stby, NOT apexdb — apexdb_stby
#     has been the current primary since --tags rolling_switchover
#     succeeded (already flagged in that section's own closing notify).
#     Every SQL task below that talks to "the current primary" delegates to
#     a freshly srvctl-discovered apexdb_stby target, same
#     each-tag-re-discovers-its-own-facts principle as rolling_switchover.
#   - Same documented multi-hour wait characteristic as SWITCHOVER: the
#     SET_PARAMETER reference lists UPDATED_TGS_WAIT/UPDATED_TGS_TIMEOUT
#     (FINISH_PLAN's equivalent of SWITCHOVER's UPDATED_LGS_WAIT/TIMEOUT),
#     defaulting to a 10800s (3 hour) wait for trailing-group-standby
#     recovery — so this call is wrapped in async/poll for the same
#     documented reason SWITCHOVER's was. Not a fresh one-off exception to
#     this file's stated no-async convention: it's now a pattern — any
#     DBMS_ROLLING call with a documented multi-hour wait parameter gets
#     async/poll; INIT_PLAN/BUILD_PLAN/START_PLAN don't have one, so they
#     don't get it.
# ============================================================================

# Fresh discovery, not reused from --tags rolling_switchover's own facts —
# this tag must work as its own standalone invocation, same principle
# applied everywhere else in this file. apexdb_stby's CRS registration has
# been on db19c_home since rolling_autoupgrade, so db19c_home's srvctl is
# correct here.
- name: "Discover apexdb_stby's currently running instance(s) via srvctl — apexdb_stby is the current primary, used as the connection target for DBA_ROLLING_STATUS and DBMS_ROLLING.FINISH_PLAN itself"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db19c_home }}/bin/srvctl status database -d {{ dg_standby_db_unique_name }}"
  register: rolling_finish_srvctl_status
  changed_when: false
  tags: [rolling_finish]

- name: Show srvctl status database output (apexdb_stby, before FINISH_PLAN)
  debug:
    var: rolling_finish_srvctl_status.stdout_lines
  tags: [rolling_finish]

- name: "Set fact: apexdb_stby's currently running instances, parsed from srvctl status"
  set_fact:
    rolling_finish_running_instances: "{{ rolling_finish_srvctl_status.stdout | regex_findall('Instance (\\S+) is running on node (\\S+)') }}"
  tags: [rolling_finish]

- name: "Fail loudly if NO apexdb_stby instance is running — need a connectable current primary to do anything here"
  fail:
    msg: >-
      No running apexdb_stby instance found via srvctl status — see output
      above. apexdb_stby is the current primary; investigate before
      attempting FINISH_PLAN.
  when: (rolling_finish_running_instances | length) == 0
  tags: [rolling_finish]

- name: "Set fact: apexdb_stby's connection target (current primary) for this section"
  set_fact:
    rolling_finish_primary_sid: "{{ rolling_finish_running_instances[0][0] }}"
    rolling_finish_primary_node: "{{ rolling_finish_running_instances[0][1] }}"
  tags: [rolling_finish]

- name: "Write SQL script: check DBA_ROLLING_STATUS status/phase before FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_status_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading off
      set feedback off
      set verify off
      set pagesize 0
      set linesize 200
      set tab off
      select status || '|' || phase from dba_rolling_status;
      exit;
  tags: [rolling_finish]

- name: "Check DBA_ROLLING_STATUS status/phase before FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_status_check.sql
  register: rolling_finish_status_result
  changed_when: false
  tags: [rolling_finish]

- name: "Fail loudly if DBA_ROLLING_STATUS returned nothing — no active rolling upgrade plan found"
  fail:
    msg: >-
      DBA_ROLLING_STATUS returned no rows — there's no active rolling
      upgrade plan to finish. Run --tags rolling_status for the full
      picture before proceeding.
  when: (rolling_finish_status_result.stdout | trim | length) == 0
  tags: [rolling_finish]

- name: "Set fact: DBA_ROLLING_STATUS status/phase before FINISH_PLAN"
  set_fact:
    rolling_finish_plan_status: "{{ (rolling_finish_status_result.stdout | trim).split('|')[0] | trim }}"
    rolling_finish_plan_phase: "{{ (rolling_finish_status_result.stdout | trim).split('|')[1] | trim }}"
  tags: [rolling_finish]

# Same resumability reasoning as rolling_switchover's own check: PHASE
# matched via startswith('FINISH') rather than an exact string (covers
# 'FINISH PENDING', not-yet-attempted, and bare 'FINISH', a previous
# attempt that errored and needs resuming — mirrors the confirmed real
# SWITCH/SWITCH PENDING behavior seen in that phase). STATUS restricted to
# READY or ERROR for the same conservative reason: no confirmed exhaustive
# list of every possible STATUS value, so anything else gets a human look.
- name: "Fail loudly if the plan isn't at (or resumably retrying) the FINISH phase — FINISH_PLAN isn't the right next step yet"
  fail:
    msg: >-
      DBA_ROLLING_STATUS shows STATUS='{{ rolling_finish_plan_status }}',
      PHASE='{{ rolling_finish_plan_phase }}' — expected PHASE starting
      with 'FINISH' (FINISH PENDING = not yet attempted, or FINISH = a
      previous attempt to resume) and STATUS of READY or ERROR. Run
      --tags rolling_status for the full DBA_ROLLING_STATUS/DATABASES/
      STATISTICS/EVENTS picture before proceeding.
  when: >-
    rolling_finish_plan_phase is not match('FINISH') or
    rolling_finish_plan_status not in ['READY', 'ERROR']
  tags: [rolling_finish]

- name: "Notify — plan is READY, proceeding to remount apexdb on the 19c home"
  debug:
    msg: >-
      DBA_ROLLING_STATUS confirms STATUS=READY,
      PHASE={{ rolling_finish_plan_phase }} — ready for
      DBMS_ROLLING.FINISH_PLAN once apexdb is remounted on 19c.
  when: rolling_finish_plan_status == 'READY'
  tags: [rolling_finish]

- name: "Write SQL script: show recent DBA_ROLLING_EVENTS (plan previously ERRORed — show why before resuming)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_recent_events.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 250
      alter session set nls_timestamp_format = 'DD-MON-YY HH24:MI';
      column type format a8
      column message format a70 word_wrapped
      select * from (
        select eventid, event_time, type, message, status, instid, revision
          from dba_rolling_events
         order by eventid desc
      ) where rownum <= 10
       order by eventid;
      exit;
  when: rolling_finish_plan_status == 'ERROR'
  tags: [rolling_finish]

- name: "Show recent DBA_ROLLING_EVENTS"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_recent_events.sql
  register: rolling_finish_recent_events_result
  when: rolling_finish_plan_status == 'ERROR'
  changed_when: false
  tags: [rolling_finish]

- name: "Show recent DBA_ROLLING_EVENTS output"
  debug:
    var: rolling_finish_recent_events_result.stdout_lines
  when: rolling_finish_plan_status == 'ERROR'
  tags: [rolling_finish]

- name: "Notify — plan previously ERRORed during FINISH. Review the events above before continuing"
  debug:
    msg: >-
      DBA_ROLLING_STATUS shows STATUS=ERROR, PHASE={{ rolling_finish_plan_phase }}
      — a previous DBMS_ROLLING.FINISH_PLAN call was attempted and failed
      (see DBA_ROLLING_EVENTS above for why). This is a normal, resumable
      state per Oracle's own docs — proceeding will re-attempt the remount
      and retry FINISH_PLAN, not start something new. Make sure whatever
      caused the error above is actually fixed before continuing.
  when: rolling_finish_plan_status == 'ERROR'
  tags: [rolling_finish]

# ----------------------------------------------------------------------------
# Remount apexdb (former primary) on the 19c home — the real prerequisite
# work Oracle's own docs describe as "you must manually restart and mount
# the former primary... on the higher version" (section 14.5, step 4, cited
# in full in this section's header comment). No DBMS_ROLLING call happens
# here — this is plain srvctl/CRS work, same category of action as
# apexdb_stby's own CRS-home move in rolling_autoupgrade.
# ----------------------------------------------------------------------------
- name: "PAUSE — about to stop apexdb, upgrade its CRS registration to the 19c home, and restart it in MOUNT (not open)"
  pause:
    prompt: >-
      About to run: srvctl stop database -d {{ db_unique_name }}, then
      srvctl upgrade database -db {{ db_unique_name }}
      -oraclehome {{ db19c_home }}, then srvctl start database
      -d {{ db_unique_name }} -o mount. apexdb will be unreachable for the
      duration (it's already a logical standby, not serving as primary —
      apexdb_stby has been primary since rolling_switchover). This is real,
      visible CRS/instance state change, not a dry run. Press ENTER to
      proceed, Ctrl+C to stop here.
  tags: [rolling_finish]

# AUDIT FINDING (real regression, hit on a rerun): the PRCD-1229 root cause
# fixed earlier for "Upgrade apexdb's CRS registration" — that
# `srvctl`'s calling binary must match the database's CURRENTLY REGISTERED
# version — was only fixed at that one call site. This task still hardcoded
# db_home (12.2.0.1) unconditionally, on the assumption that apexdb is
# always still on the old home when this block starts. That assumption held
# on a fresh first pass, but not on a resumed run: the CRS-home move earlier
# in this exact block had already succeeded on a prior attempt (only
# FINISH_PLAN itself failed afterwards, on the unrelated ORA-45414/deferred-
# destination issue), so apexdb was already registered under db19c_home by
# the time this task ran again — and hit the identical PRCD-1229 symptom,
# just with the version mismatch in the OPPOSITE direction ("its version
# 19.0.0.0.0 differs from the program version 12.2.0.1.0").
#
# First attempted fix for this was WRONG and is worth documenting rather
# than quietly replacing: it discovered apexdb's home by grepping
# /etc/oratab for a key of "apexdb1" (the per-instance SID). Real output
# proved that assumption false — no such entry exists, because RAC oratab
# entries are conventionally keyed by db_unique_name ("apexdb"), not by
# per-instance SID, and CRS-managed databases are typically N (no
# auto-start) regardless. That failure led to a manual workaround (oratab's
# apexdb entry hand-edited back to point at db_home) which is now actively
# misleading: apexdb's REAL CRS registration is on db19c_home (confirmed
# earlier via `srvctl upgrade database` succeeding and apexdb connecting as
# a 19c instance) — so oratab and the real CRS state now disagree, and
# trusting oratab at all, in whatever format, is the wrong foundation here.
#
# Fixed properly this time by asking CRS directly instead of reading a file
# that can be hand-edited out of sync with it: run `srvctl config database`
# from db19c_home's own srvctl. If apexdb is really on db19c_home, this
# succeeds outright. If it's still on db_home, srvctl's own PRCD-1229
# safety check fires and — same as when James used this exact technique
# manually to confirm apexdb_stby's real registered home earlier in this
# project — the error message itself names the correct home ("Instead run
# the program from ..."), which is what's checked for below rather than
# re-parsed. This is authoritative (it's the same OCR-backed check srvctl
# itself enforces on every other call in this file) and doesn't depend on
# oratab's format, contents, or being in sync with anything.
- name: "Discover apexdb's currently-registered Oracle Home by asking CRS directly (srvctl config database), not by trusting /etc/oratab"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  command: "{{ db19c_home }}/bin/srvctl config database -d {{ db_unique_name }}"
  register: rolling_finish_apexdb_home_probe
  changed_when: false
  failed_when: false
  tags: [rolling_finish]

- name: "Fail loudly if the CRS registration probe failed for a reason other than the expected PRCD-1229 version mismatch — don't guess which home is real"
  fail:
    msg: >-
      {{ db19c_home }}/bin/srvctl config database -d {{ db_unique_name }}
      failed (rc={{ rolling_finish_apexdb_home_probe.rc }}) without the
      expected PRCD-1229 message pointing at db_home — see output below.
      Investigate before continuing rather than guess which srvctl binary
      is safe to use against apexdb.
      {{ rolling_finish_apexdb_home_probe.stdout }}
  when: >-
    rolling_finish_apexdb_home_probe.rc != 0 and
    'PRCD-1229' not in rolling_finish_apexdb_home_probe.stdout
  tags: [rolling_finish]

- name: "Set fact: apexdb's currently-registered Oracle Home"
  set_fact:
    rolling_finish_apexdb_current_home: >-
      {{ db19c_home if rolling_finish_apexdb_home_probe.rc == 0 else db_home }}
  tags: [rolling_finish]

- name: "Notify — apexdb's currently-registered Oracle Home (determines which srvctl binary the next few tasks use)"
  debug:
    msg: >-
      apexdb ({{ db_unique_name }}) is currently registered under
      {{ rolling_finish_apexdb_current_home }}, confirmed by
      {{ 'a successful srvctl config database call from the 19c home'
      if rolling_finish_apexdb_home_probe.rc == 0
      else 'the PRCD-1229 message above, which names the real home' }} —
      treated as {{ 'already on the 19c home (a resumed run — the
      CRS-home move below will be skipped)' if
      rolling_finish_apexdb_current_home == db19c_home else 'still on the
      pre-upgrade home (a fresh pass)' }}.
  tags: [rolling_finish]

# Real failure hit here on a rerun (the previous attempt had already
# stopped apexdb before dying on the PRCT-1402 modify further down): srvctl
# stop database on an already-stopped database exits rc=2 with
# "PRCC-1016 : apexdb was already stopped" — informational, not a real
# error, but Ansible's command module fails on any non-zero rc by default,
# so without an explicit failed_when override this halted the play even
# though the actual state (apexdb down) was exactly what this task wants.
# This section is meant to be resumable after a partial failure (same
# principle as the DBA_ROLLING_STATUS preflight above), so "already
# stopped" has to be treated as success, not a fresh error.
- name: "Stop apexdb (former primary) before moving its CRS registration to the 19c home"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ rolling_finish_apexdb_current_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ rolling_finish_apexdb_current_home }}/bin/srvctl stop database -d {{ db_unique_name }}"
  register: rolling_finish_stop_apexdb
  changed_when: rolling_finish_stop_apexdb.rc == 0
  failed_when: >-
    rolling_finish_stop_apexdb.rc != 0 and
    'PRCC-1016' not in rolling_finish_stop_apexdb.stdout
  tags: [rolling_finish]

- name: "Show srvctl stop (apexdb) output"
  debug:
    msg: "rc: {{ rolling_finish_stop_apexdb.rc }}"
  tags: [rolling_finish]

- name: "Show srvctl stop (apexdb) command output lines"
  debug:
    var: rolling_finish_stop_apexdb.stdout_lines
  tags: [rolling_finish]

# Two real failures hit here, in sequence, before landing on the actual
# fix. Attempt 1: ran `srvctl modify database -oraclehome` using the OLD
# (db_home, 12.2.0.1) srvctl binary -> PRCT-1402/PRKC-1137 ("Attempt to
# retrieve version of SRVCTL from Oracle Home .../19.3.0/db_1/bin failed").
# Attempt 2: switched to `srvctl modify database -oraclehome` using the NEW
# (db19c_home, 19.3.0) srvctl binary (reasoning by analogy from apexdb_stby's
# working CRS-home move in rolling_autoupgrade, ~line 2363) -> a DIFFERENT
# real failure, PRCD-1229: "An attempt to access configuration of database
# apexdb was rejected because its version 12.2.0.1.0 differs from the
# program version 19.0.0.0.0. Instead run the program from
# /u01/app/oracle/product/12.2.0/db_1." That message reveals the actual
# root cause: `srvctl modify database -oraclehome` enforces a safety check
# that the CALLING program's version must match the database's CURRENTLY
# REGISTERED version in OCR — a check that can never pass when the whole
# point of the call is to change that registered version across a major
# release boundary. No choice of srvctl binary fixes that; `modify` is
# simply the wrong subcommand for this operation. The correct one,
# confirmed against Oracle's own SRVCTL command reference and a real,
# identically-worded PRCD-1229 case study (Mathijs Bruggink, "When PRCD-1027
# and PRCD-1229 is spoiling your rainy day", 2015 — same error, same fix),
# is `srvctl upgrade database -db <db> -oraclehome <new_home>`: it
# "upgrades the configuration of a database and all of its services to the
# version of the database home from where this command is run" — i.e. it
# exists specifically to move a database's CRS registration across a major
# version, and is meant to be invoked using the NEW home's own srvctl
# (matching "the database home from where this command is run"). apexdb_stby's
# earlier CRS-home move technically worked via `modify` rather than
# `upgrade` — that's worth revisiting for correctness later, but it did not
# fail in the live run, so it's left alone here rather than touched
# speculatively.
# Guarded with `when`, not just left to rerun blindly: apexdb's oratab
# entry, discovered above, already told us whether this move happened on a
# prior attempt. `srvctl upgrade database` isn't confirmed idempotent
# against a database already registered on its target home — rather than
# find out the hard way (a third variant of the PRCD-1229/PRCT-1402 family
# on top of the two already hit), skip it outright when the discovery above
# shows apexdb is already on db19c_home.
- name: "Upgrade apexdb's CRS registration to the 19c Oracle home"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: >
    {{ db19c_home }}/bin/srvctl upgrade database -db {{ db_unique_name }}
    -oraclehome {{ db19c_home }}
  register: rolling_finish_upgrade_home
  changed_when: rolling_finish_upgrade_home.rc == 0
  when: rolling_finish_apexdb_current_home != db19c_home
  tags: [rolling_finish]

- name: "Show srvctl upgrade (apexdb, new Oracle home) output"
  debug:
    msg: "rc: {{ rolling_finish_upgrade_home.rc }}"
  when: rolling_finish_apexdb_current_home != db19c_home
  tags: [rolling_finish]

- name: "Show srvctl upgrade (apexdb, new Oracle home) command output lines"
  debug:
    var: rolling_finish_upgrade_home.stdout_lines
  when: rolling_finish_apexdb_current_home != db19c_home
  tags: [rolling_finish]

- name: "Notify — apexdb already registered on the 19c home, CRS-home upgrade call skipped"
  debug:
    msg: >-
      apexdb's oratab entry already showed {{ db19c_home }} before this
      task ran (a resumed run) — skipped `srvctl upgrade database` rather
      than call it again against a database already on its target home.
  when: rolling_finish_apexdb_current_home == db19c_home
  tags: [rolling_finish]

# Defense-in-depth, not a reaction to an observed failure this time — same
# risk class already found and fixed for apexdb_stby in rolling_build
# ("Temporarily set apexdb_stby's CRS policy to MOUNT/MANUAL...", ~line 366):
# DBMS_ROLLING.FINISH_PLAN's own wait (UPDATED_TGS_TIMEOUT, default 10800s)
# means apexdb can sit mounted for a long time before FINISH_PLAN reopens it
# as a physical standby. If CRS restarts the resource for any reason during
# that window while it's still on whatever policy/startoption `srvctl
# upgrade database` left it with, it could come back OPEN instead of MOUNT.
# Setting MOUNT/MANUAL explicitly here closes that gap before the wait
# starts, rather than waiting to hit it the way the apexdb_stby case was
# found. -force is required for the same documented reason as that fix:
# srvctl modify database prompts for interactive confirmation when the
# resource is currently started and the change implies a stop/restart, and
# Ansible's command module has no stdin to answer that prompt.
- name: "Set apexdb's CRS policy to MOUNT/MANUAL (prevents CRS auto-restarting it OPEN during FINISH_PLAN's multi-hour wait)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: >
    {{ db19c_home }}/bin/srvctl modify database -db {{ db_unique_name }}
    -startoption mount -policy manual -force
  register: rolling_finish_set_mount_policy
  changed_when: rolling_finish_set_mount_policy.rc == 0
  tags: [rolling_finish]

- name: "Show srvctl modify (apexdb, MOUNT/MANUAL policy) output"
  debug:
    msg: "rc: {{ rolling_finish_set_mount_policy.rc }}"
  tags: [rolling_finish]

- name: "Show srvctl modify (apexdb, MOUNT/MANUAL policy) command output lines"
  debug:
    var: rolling_finish_set_mount_policy.stdout_lines
  tags: [rolling_finish]

# Same resumability class as the "Stop apexdb" fix above, audited in rather
# than waited for: on a resumed run apexdb can already be mounted on 19c
# (exactly the state James confirmed live), and srvctl's "already
# running/mounted" response to a redundant start is informational
# (PRCC-1014 / PRCR-1004 family — "was already running"), not a real
# failure. Guarded the same way as the stop task rather than leaving this
# as the next predictable regression.
- name: "Start apexdb in MOUNT mode on the 19c home (not open — per Oracle's own docs, FINISH_PLAN needs it mounted, not open)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
    ORACLE_SID: "{{ sid_prefix }}1"
  command: "{{ db19c_home }}/bin/srvctl start database -d {{ db_unique_name }} -o mount"
  register: rolling_finish_start_mount
  changed_when: rolling_finish_start_mount.rc == 0
  failed_when: >-
    rolling_finish_start_mount.rc != 0 and
    'already running' not in rolling_finish_start_mount.stdout and
    'PRCC-1014' not in rolling_finish_start_mount.stdout
  tags: [rolling_finish]

- name: "Show srvctl start -o mount (apexdb) output"
  debug:
    msg: "rc: {{ rolling_finish_start_mount.rc }}"
  tags: [rolling_finish]

- name: "Show srvctl start -o mount (apexdb) command output lines"
  debug:
    var: rolling_finish_start_mount.stdout_lines
  tags: [rolling_finish]

- name: "Write SQL script: confirm apexdb is MOUNTED on 19c binaries before FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_check_mounted.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 150
      column instance_name format a15 truncated
      column status format a12
      column version format a15
      select inst_id, instance_name, status, version
        from gv$instance
       order by inst_id;
      exit;
  tags: [rolling_finish]

- name: "Check apexdb is MOUNTED on 19c binaries before FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_check_mounted.sql
  register: rolling_finish_check_mounted_result
  changed_when: false
  tags: [rolling_finish]

- name: "Show apexdb MOUNTED/version check output"
  debug:
    var: rolling_finish_check_mounted_result.stdout_lines
  tags: [rolling_finish]

- name: "Fail loudly if apexdb isn't showing MOUNTED and 19c — FINISH_PLAN needs it mounted on the higher version first"
  fail:
    msg: >-
      Expected every instance above to show STATUS=MOUNTED and a 19.x
      VERSION — apexdb isn't ready for FINISH_PLAN yet. Investigate before
      continuing (check the alert log on oradbserv05/06).
  when: >-
    ('MOUNTED' not in rolling_finish_check_mounted_result.stdout) or
    ('19.' not in rolling_finish_check_mounted_result.stdout)
  tags: [rolling_finish]

- name: "Notify — apexdb confirmed MOUNTED on 19c, ready for DBMS_ROLLING.FINISH_PLAN"
  debug:
    msg: >-
      apexdb is mounted on 19c binaries (see above) — the manual
      prerequisite Oracle's own docs describe before FINISH_PLAN can be
      called. No role conversion has happened yet; that's FINISH_PLAN's
      own job next.
  tags: [rolling_finish]

# ----------------------------------------------------------------------------
# Real failure hit here on the first FINISH_PLAN attempt: ORA-45414 "could
# not connect to a remote database". DBA_ROLLING_EVENTS on apexdb_stby (the
# only place it's queryable — apexdb is intentionally MOUNTED-only, and
# dictionary views need an open database) told the real story, in order:
# "opened outbound connection to apexdb" (0, success) -> "initialized
# outbound agent for apexdb" (0, success) -> "failed to open INBOUND
# connection FROM apexdb" (45414, the actual failure) -> halted. So
# apexdb_stby reaching apexdb was never the problem — confirmed separately
# via real tnsping/sqlplus tests run from apexdb_stby's own nodes
# (oradbserv09, oradbserv10) straight to apexdb, which connected fine both
# ways. The failure is apexdb's own outbound leg back to apexdb_stby, and
# v$archive_dest on apexdb_stby showed exactly why: dest_id 2
# (apexdb_dgmgrl, TARGET=STANDBY) was STATUS=DEFERRED — redo transport
# toward apexdb switched off. FINISH_PLAN needs a live two-way connection
# between TGM and former primary to do its work, not just one-way reachability.
# Same root cause and same fix as a real, independently-documented case of
# this exact error in this exact package (Nassyam Basha, "You will go crazy
# if you haven't configured as required #DBMS_ROLLING", Oracle CKPT, 2016):
# a DEFERRED log_archive_dest_state on the standby-facing destination broke
# DBMS_ROLLING's internal connectivity until it was set back to ENABLE.
# Fixed generically (dest_id 2 today, but not hardcoded — self-discovers any
# STANDBY-target destination left DEFERRED via v$archive_dest, matching the
# fresh-discovery convention used everywhere else in this file) rather than
# reacting to today's specific dest_id, since it isn't guaranteed to stay 2
# across reruns or future environments.
# ----------------------------------------------------------------------------
- name: "Write SQL script: enable any DEFERRED standby-facing archive log destination on apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_enable_standby_dest.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      set serveroutput on
      DECLARE
        v_stmt   VARCHAR2(200);
        v_count  PLS_INTEGER := 0;
      BEGIN
        FOR r IN (
          SELECT dest_id FROM v$archive_dest
           WHERE target = 'STANDBY' AND status = 'DEFERRED'
        ) LOOP
          v_stmt := 'ALTER SYSTEM SET LOG_ARCHIVE_DEST_STATE_' || r.dest_id || '=ENABLE SCOPE=BOTH';
          DBMS_OUTPUT.PUT_LINE('Executing: ' || v_stmt);
          EXECUTE IMMEDIATE v_stmt;
          v_count := v_count + 1;
        END LOOP;
        DBMS_OUTPUT.PUT_LINE('Destinations enabled: ' || v_count);
      END;
      /
      exit;
  tags: [rolling_finish]

- name: "Enable any DEFERRED standby-facing archive log destination on apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_enable_standby_dest.sql
  register: rolling_finish_enable_dest_result
  changed_when: "'Destinations enabled: 0' not in rolling_finish_enable_dest_result.stdout"
  tags: [rolling_finish]

- name: "Show enable-standby-destination output"
  debug:
    var: rolling_finish_enable_dest_result.stdout_lines
  tags: [rolling_finish]

- name: "Write SQL script: verify no STANDBY-target archive destination is still DEFERRED"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_verify_standby_dest.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set tab off
      set linesize 200
      column destination format a30
      select dest_id, destination, status, target from v$archive_dest
       where target = 'STANDBY';
      exit;
  tags: [rolling_finish]

- name: "Verify no STANDBY-target archive destination is still DEFERRED"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_verify_standby_dest.sql
  register: rolling_finish_verify_dest_result
  changed_when: false
  tags: [rolling_finish]

- name: "Show verify-standby-destination output"
  debug:
    var: rolling_finish_verify_dest_result.stdout_lines
  tags: [rolling_finish]

- name: "Fail loudly if any STANDBY-target archive destination is still DEFERRED — FINISH_PLAN will hit ORA-45414 again"
  fail:
    msg: >-
      A STANDBY-target archive destination is still showing DEFERRED after
      the enable attempt above — see output. DBMS_ROLLING.FINISH_PLAN needs
      a live two-way connection between apexdb_stby and apexdb; retrying
      FINISH_PLAN with any STANDBY destination still deferred will just
      reproduce ORA-45414. Investigate before continuing.
  when: "'DEFERRED' in rolling_finish_verify_dest_result.stdout"
  tags: [rolling_finish]

# ----------------------------------------------------------------------------
# The actual DBMS_ROLLING.FINISH_PLAN call — executed against apexdb_stby,
# the current primary since rolling_switchover.
# ----------------------------------------------------------------------------
- name: "PAUSE — about to call DBMS_ROLLING.FINISH_PLAN(). This finalizes the rolling upgrade (flashback + role conversion + start media recovery on apexdb)."
  pause:
    prompt: >-
      DBA_ROLLING_STATUS shows STATUS={{ rolling_finish_plan_status }},
      PHASE={{ rolling_finish_plan_phase }}, and apexdb is confirmed
      MOUNTED on 19c binaries (checks above). About to run
      EXECUTE DBMS_ROLLING.FINISH_PLAN(); against apexdb_stby (the current
      primary). Per Oracle's own docs, this flashes back the former primary,
      converts it to a physical standby, and starts media recovery on it —
      this is the last step in the whole DBMS_ROLLING chain. Press ENTER to
      proceed, Ctrl+C to stop here instead.
  tags: [rolling_finish]

- name: "Write SQL script: DBMS_ROLLING.FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo on
      set heading on
      set feedback on
      set tab off
      set timing on
      EXECUTE DBMS_ROLLING.FINISH_PLAN();
      exit;
  tags: [rolling_finish]

# Wrapped in async/poll for the same documented reason as SWITCHOVER — see
# this section's header comment (UPDATED_TGS_WAIT/TIMEOUT, defaulting to a
# 10800s/3-hour possible wait for trailing-group-standby recovery).
- name: "Run: DBMS_ROLLING.FINISH_PLAN — finalizes the rolling upgrade"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/rolling_finish_plan.sql
  async: 7200
  poll: 15
  register: rolling_finish_result
  changed_when: "'PL/SQL procedure successfully completed' in rolling_finish_result.stdout"
  tags: [rolling_finish]

- name: "Show DBMS_ROLLING.FINISH_PLAN output"
  debug:
    var: rolling_finish_result.stdout_lines
  tags: [rolling_finish]

- name: "Fail loudly if DBMS_ROLLING.FINISH_PLAN looks like it failed (rc != 0 or ORA- in output) — verify against the real output above regardless"
  fail:
    msg: >-
      DBMS_ROLLING.FINISH_PLAN returned rc={{ rolling_finish_result.rc }}
      and/or reported an ORA- error — read the full output above before
      doing anything else. Check DBA_ROLLING_STATUS/EVENTS
      (--tags rolling_status) for what state the configuration is actually
      in before retrying.
  when: rolling_finish_result.rc != 0 or 'ORA-' in rolling_finish_result.stdout
  tags: [rolling_finish]

- name: "Write SQL script: confirm apexdb is now a PHYSICAL STANDBY after FINISH_PLAN (GV$INSTANCE + GV$DATABASE)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_post_check_apexdb.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 200
      set pagesize 100
      column host_name format a20 truncated
      column instance_name format a15 truncated
      column status format a12
      column database_role format a18
      column open_mode format a18
      select i.inst_id,
             i.instance_name,
             i.host_name,
             i.status,
             d.database_role,
             d.open_mode
        from gv$instance i
        join gv$database d on d.inst_id = i.inst_id
       order by i.inst_id;
      exit;
  tags: [rolling_finish]

- name: "Check apexdb's role after FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_post_check_apexdb.sql
  register: rolling_finish_post_check_apexdb
  changed_when: false
  failed_when: false
  tags: [rolling_finish]

- name: "Show apexdb's role after FINISH_PLAN (expect PHYSICAL STANDBY)"
  debug:
    var: rolling_finish_post_check_apexdb.stdout_lines
  tags: [rolling_finish]

- name: "Fail loudly if apexdb is not reporting PHYSICAL STANDBY after FINISH_PLAN"
  fail:
    msg: >-
      Expected DATABASE_ROLE=PHYSICAL STANDBY for apexdb above —
      DBMS_ROLLING.FINISH_PLAN reported success but the role doesn't show
      it. Stop and investigate — check DBA_ROLLING_EVENTS
      (--tags rolling_status) for what actually happened.
  when: "'PHYSICAL STANDBY' not in rolling_finish_post_check_apexdb.stdout"
  tags: [rolling_finish]

- name: "Write SQL script: confirm apexdb_stby is still PRIMARY after FINISH_PLAN (sanity check)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rolling_finish_post_check_stby.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0640"
    content: |
      set echo off
      set heading on
      set feedback off
      set verify off
      set tab off
      set linesize 150
      column database_role format a18
      column open_mode format a18
      select inst_id, open_mode, database_role from gv$database order by inst_id;
      exit;
  tags: [rolling_finish]

- name: "Check apexdb_stby's role after FINISH_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ rolling_finish_primary_node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ rolling_finish_primary_sid }}
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rolling_finish_post_check_stby.sql
  register: rolling_finish_post_check_stby
  changed_when: false
  tags: [rolling_finish]

- name: "Show apexdb_stby's role after FINISH_PLAN (expect still PRIMARY)"
  debug:
    var: rolling_finish_post_check_stby.stdout_lines
  tags: [rolling_finish]

- name: "Fail loudly if apexdb_stby is not reporting PRIMARY after FINISH_PLAN — something changed roles unexpectedly"
  fail:
    msg: >-
      Expected apexdb_stby to still show DATABASE_ROLE=PRIMARY above —
      FINISH_PLAN should only change apexdb's role, not apexdb_stby's.
      Stop and investigate.
  when: "'PRIMARY' not in rolling_finish_post_check_stby.stdout"
  tags: [rolling_finish]

- name: "Notify — DBMS_ROLLING rolling upgrade COMPLETE. apexdb is now a physical standby of apexdb_stby (the new primary), both on 19c."
  debug:
    msg: >-
      The 12.2.0.1 -> 19c rolling upgrade is complete: apexdb_stby is
      PRIMARY, apexdb is PHYSICAL STANDBY, both confirmed above, both on
      19c binaries. Optional cleanup, neither built nor required: (1)
      DBMS_ROLLING.DESTROY_PLAN purges this plan's tracked state once
      you're confident nothing further needs it (per Oracle's own docs,
      call it manually when ready — not wired into this role, matching how
      ROLLBACK_PLAN was deliberately left as a manual, human decision too);
      (2) apexdb_stby still has the AutoUpgrade-created guaranteed restore
      point from --tags rolling_autoupgrade (the real deploy output named
      it, e.g. AUTOUPGRADE_9212_APEXDB_STBY122010) — drop it manually
      (DROP RESTORE POINT ...) once you're confident you'll never need to
      flash back that standalone upgrade step. Updating oracle's
      .bash_profile on all 4 nodes to the 19c home next.
  tags: [rolling_finish]

# ----------------------------------------------------------------------------
# James's explicit request: update the oracle OS user's .bash_profile on all
# 4 database nodes so ORACLE_HOME reflects reality now that the whole
# database (both apexdb and apexdb_stby) runs on 19c. The file itself is
# Ansible-managed by the os_prep role (see roles/os_prep/templates/
# oracle-bash_profile.j2) but hardcodes exactly ONE literal path:
# `export DB_HOME={{ db_home }}` — ORACLE_HOME, PATH, LD_LIBRARY_PATH,
# CLASSPATH, and TNS_ADMIN all derive from $DB_HOME/$ORACLE_HOME dynamically
# within that same file. So a single, minimal, idempotent in-place edit of
# that one line (rather than re-rendering the whole os_prep template) is all
# that's needed, and avoids a real Ansible pitfall: this whole play only has
# ONE real host (rac_node1), so delegating a `template:` task to 4 different
# hosts via a loop would have resolved every OTHER host-specific template
# variable (inventory_hostname, the computed SID index, db_unique_name) using
# rac_node1's own hostvars context, not each delegated host's — silently
# wrong for 3 of the 4 nodes. `replace` sidesteps that entirely: none of its
# parameters here (oracle_user, db19c_home) vary by host, so delegating the
# exact same call to each of the 4 real target hosts is safe and correct.
# ----------------------------------------------------------------------------
- name: "Update oracle user's .bash_profile DB_HOME to the 19c home on {{ item }}"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['dg_db_nodes'] }}"
  loop_control:
    label: "{{ item }}"
  replace:
    path: "/home/{{ oracle_user }}/.bash_profile"
    regexp: '^export DB_HOME=.*$'
    replace: "export DB_HOME={{ db19c_home }}"
    backup: true
  register: rolling_finish_bash_profile_update
  tags: [rolling_finish]

- name: "Verify the updated DB_HOME line on each node"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['dg_db_nodes'] }}"
  loop_control:
    label: "{{ item }}"
  command: "grep -E '^export DB_HOME=' /home/{{ oracle_user }}/.bash_profile"
  register: rolling_finish_bash_profile_check
  changed_when: false
  tags: [rolling_finish]

- name: "Show DB_HOME line on each node after update"
  debug:
    msg: "{{ item.item }}: {{ item.stdout }}"
  loop: "{{ rolling_finish_bash_profile_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [rolling_finish]

- name: "Fail loudly if any node's .bash_profile doesn't show the 19c home after the update"
  fail:
    msg: >-
      {{ item.item }} still doesn't show DB_HOME={{ db19c_home }} in
      /home/{{ oracle_user }}/.bash_profile — see output above.
  loop: "{{ rolling_finish_bash_profile_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: db19c_home not in item.stdout
  tags: [rolling_finish]

- name: "Notify — .bash_profile updated on all 4 nodes. New interactive shells (or `. ~/.bash_profile`) will pick up ORACLE_HOME=19.3.0."
  debug:
    msg: >-
      oracle's .bash_profile DB_HOME line now points at
      {{ db19c_home }} on {{ groups['dg_db_nodes'] | join(', ') }} — a
      backup of each original file was kept alongside it (Ansible's
      replace: backup: true). Already-open shells won't pick this up until
      re-sourced (`. ~/.bash_profile`) or a new login. The rolling upgrade
      itself (DBMS_ROLLING INIT_PLAN through FINISH_PLAN) is fully
      complete.
  tags: [rolling_finish]
