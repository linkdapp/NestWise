---
# Included once per software-owner OS user (grid, then oracle) with ssh_user set.
# Runs against the whole rac_nodes play in one pass — relies on Ansible's default
# `linear` strategy running each task across every host before moving to the next task,
# so by the time the "authorize every node's key" task runs below, every node has
# already published its own public key as a fact for the others to read via hostvars.

- name: "Ensure {{ ssh_user }}'s .ssh directory exists"
  file:
    path: "/home/{{ ssh_user }}/.ssh"
    state: directory
    owner: "{{ ssh_user }}"
    group: oinstall
    mode: "0700"

- name: "Generate an RSA keypair for {{ ssh_user }} if one doesn't exist yet"
  # RSA, in legacy PEM encoding (-m PEM), NOT ed25519, and NOT the modern OpenSSH key
  # format ssh-keygen produces by default since OpenSSH 7.8 (~2018). This is a real,
  # confirmed requirement, not a style choice — gridSetup.sh's OWN internal SSH setup
  # (a bundled Java library, distinct from the system `ssh` binary) fails to parse
  # anything else, surfacing as [INS-06003]/PRCZ-2006/PRVG-11001 with a garbled
  # "invalid privatekey: [B@<hash>" message (a raw Java byte-array toString(), i.e. the
  # library read *something* but couldn't decode it as a key). The system `ssh`/`sshd`
  # couldn't care less about key type — manual `ssh grid@peer` with an ed25519 key
  # worked fine — this is specifically Oracle's own bundled SSH client being far more
  # restrictive. See docs/known-risks.md #16.
  become: true
  become_user: "{{ ssh_user }}"
  command: >
    ssh-keygen -t rsa -b 2048 -m PEM -N '' -f /home/{{ ssh_user }}/.ssh/id_rsa
    -C "{{ ssh_user }}@{{ inventory_hostname }}"
  args:
    creates: "/home/{{ ssh_user }}/.ssh/id_rsa"

- name: "Read {{ ssh_user }}'s public key back so it can be shared with peer nodes"
  slurp:
    src: "/home/{{ ssh_user }}/.ssh/id_rsa.pub"
  register: pubkey_slurp

- name: "Publish {{ ssh_user }}'s public key as a fact (readable via hostvars on later tasks/hosts)"
  set_fact:
    ssh_equiv_pubkey: "{{ pubkey_slurp.content | b64decode | trim }}"

- name: "Authorize every peer host's {{ ssh_user }} public key on this node (self included)"
  # Cluster-agnostic: loops over `nodes` (redirected per group_vars/<group>.yml,
  # same variable dns_bind/asmlib_disks already use), NOT a hardcoded
  # groups['rac_nodes'] — that was a real bug, same class as the earlier dns_bind/
  # asmlib_disks ones. groups['rac_nodes'] is inventory-global, unaffected by which
  # play/group is actually running, so a --tags standby_ssh_equivalence run would
  # either skip authorizing oradbserv09/10 onto each other entirely (hostvars for
  # rac_nodes undefined in an isolated run) or, worse, leak oradbserv05/06's
  # grid/oracle keys onto the standby nodes if ever run in the same invocation as
  # --tags ssh_equivalence — exactly the cross-cluster coupling this project
  # deliberately avoids (see docs/known-risks.md #59). See known-risks.md for this
  # fix's own entry.
  lineinfile:
    path: "/home/{{ ssh_user }}/.ssh/authorized_keys"
    line: "{{ hostvars[item].ssh_equiv_pubkey }}"
    create: true
    owner: "{{ ssh_user }}"
    group: oinstall
    mode: "0600"
  loop: "{{ nodes | map(attribute='name') | list }}"
  when: hostvars[item].ssh_equiv_pubkey is defined

# PRIMARY fix for the host-key confirmation prompt: pre-populate this user's own
# known_hosts from the system-wide scan main.yml already ran (keyscan_result is a
# registered fact from this same host's execution, still readable here — no need to
# re-run ssh-keyscan per user). This is what actually makes `ssh grid@peer` /
# `ssh oracle@peer` silent, including gridSetup.sh's own bundled-but-separate SSH
# client, which reads the OS-level known_hosts same as system ssh does.
- name: "Pre-populate {{ ssh_user }}'s known_hosts (primary fix — replaces the StrictHostKeyChecking config approach below, which didn't reliably suppress the prompt; see main.yml's 2026-08-08 correction note)"
  copy:
    dest: "/home/{{ ssh_user }}/.ssh/known_hosts"
    content: "{{ keyscan_result.stdout }}"
    owner: "{{ ssh_user }}"
    group: oinstall
    mode: "0600"

# The "secondary, belt-and-suspenders" ~/.ssh/config approach that used to live here
# (StrictHostKeyChecking no + UserKnownHostsFile /dev/null) was REMOVED — it was
# actively harmful, not just redundant. UserKnownHostsFile /dev/null means every
# connection to these hosts discards its known_hosts entry immediately instead of
# persisting it, so ssh treats every single connection as first-ever, prints
# "Warning: Permanently added ... to the list of known hosts" EVERY time (even
# back-to-back connections to the same host — nothing is ever actually being
# permanently added, /dev/null throws it away), and completely defeats the PRIMARY
# fix above (the real known_hosts pre-population), since that file is exactly what
# gets bypassed for exactly the hosts it was populated for. Confirmed on a real run
# — see docs/known-risks.md #63. The known_hosts pre-population task above is
# sufficient on its own; ensure this role re-runs whenever a node's SSH host key
# actually regenerates (clone/rebuild) rather than papering over staleness with a
# config that discards host-key checking altogether.

- name: "Remove the previously-deployed {{ ssh_user }}/.ssh/config (its UserKnownHostsFile /dev/null directive is what broke this — removing the task above doesn't undo the file it already wrote on a prior run)"
  file:
    path: "/home/{{ ssh_user }}/.ssh/config"
    state: absent

- name: "Verify {{ ssh_user }} equivalence to every peer (non-fatal, informational)"
  become: true
  become_user: "{{ ssh_user }}"
  command: "ssh -o BatchMode=yes -o ConnectTimeout=5 {{ item }} hostname"
  loop: "{{ nodes | map(attribute='name') | list }}"
  register: ssh_equiv_check
  changed_when: false
  failed_when: false

- name: "Show {{ ssh_user }} equivalence check results (all should say OK before running grid_install/db_install)"
  debug:
    msg: "{{ ssh_user }} -> {{ item.item }}: {{ 'OK' if item.rc == 0 else 'FAILED (rc=' ~ item.rc ~ ') — ' ~ item.stderr }}"
  loop: "{{ ssh_equiv_check.results }}"
