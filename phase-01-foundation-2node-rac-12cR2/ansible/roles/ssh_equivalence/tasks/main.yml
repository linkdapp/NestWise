---
# Passwordless SSH between a set of SOURCE hosts and a set of TARGET hosts, for a
# set of users, optionally both ways.
#
# GENERALISED 2026-08-31, and this REPLACES cross_cluster_ssh_trust — that role
# was this same logic hardcoded to one pair (oradbserv05 -> oradbserv09) for
# db19c_software_install's cross-cluster copy.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS A ONE-TASK WRAPPER
#
# The real work is in configure.yml. This file exists solely to run it ONCE per
# play, not once per host in the play.
#
# That matters because of what the generalisation changed. The OLD mesh
# implementation used the play's own host loop as its parallelism: the play
# targeted `rac_nodes`, and each host configured ITS OWN .ssh directory. Two
# hosts, two disjoint sets of files, no overlap.
#
# configure.yml is fully delegate_to-driven instead — that is what lets one role
# express "oradbserv05 -> oemserver01", which the old hostvars-based version
# could not do at all. But it also means the work no longer depends on which
# host the play is currently iterating. Left ungated, a play across `rac_nodes`
# would build the ENTIRE mesh twice, concurrently, once from each host's fork —
# and both forks would run `lineinfile` against the SAME
# /home/<user>/.ssh/authorized_keys on the SAME delegated target at the same
# time. lineinfile is read-modify-write via a temp file and a rename; two
# concurrent writers can silently lose one of the two keys. A missing
# authorized_keys entry is exactly the failure that makes gridSetup.sh hang with
# no output (docs/known-risks.md #6), so this is not a cosmetic dedupe.
#
# ansible_play_hosts rather than ansible_play_hosts_all: the former excludes
# hosts already failed or unreachable, so if the first inventory host is down
# the mesh is still built from the next live one instead of being skipped
# entirely.
#
# include_tasks with a `when`, rather than `meta: end_host`: end_host would end
# the host for the WHOLE play, silently skipping any role listed after this one.
# This gate is scoped to this role and nothing else.
# ---------------------------------------------------------------------------

- name: Configure SSH equivalence (once per play, not once per host)
  include_tasks: configure.yml
  when: >
    not (ssh_equiv_run_once | bool)
    or inventory_hostname == ansible_play_hosts[0]
