---
# Phase 6 (12.2.0.1 -> 19c rolling upgrade): FSFO must be fully stopped before
# DBMS_ROLLING.BUILD_PLAN — confirmed against Oracle's own DBMS_ROLLING
# documentation that the broker rejects any attempt to even ENABLE fast-start
# failover while a rolling upgrade is in progress. Wraps James's existing
# manage_observer.sh rather than reimplementing observer control — that script
# predates this Ansible role and isn't managed by this project's automation
# otherwise.
#
# ASSUMPTION, not yet confirmed: manage_observer_script (group_vars/all.yml)
# lives on oemserver01 (observer_nodes) — inferred from its /u01/app/oracle/...
# path matching that host's own oracle_base convention, and because that's
# where the Observer itself already runs. Confirm this role's `hosts:` target
# is correct before a real run — if the script actually lives somewhere else
# (e.g. one of the RAC nodes), this role's target group needs to change to
# match, not just this comment.
#
# --- Real gap found on the first live run — owned, not glossed over --------
# CORRECTED (see high-availability/scripts/montor_manage_observer.sh, read
# directly rather than assumed): `manage_observer.sh stop` DOES disable FSFO
# first — its stop_observer() function runs `DISABLE FAST-START FAILOVER;`
# as step 1, then `STOP OBSERVER;` as step 2. The original note here claimed
# the script only touches the observer process and never the FastStartFailover
# CONFIGURATION property — that was wrong; the script clearly attempts both.
# The REAL root cause of the first live run's symptom (observer stopped,
# SHOW OBSERVER correctly "No observers.", but a follow-up `show fast_start
# failover` from dgmgrl still reported "Fast-Start Failover: Enabled in Zero
# Data Loss Mode"): the script fires the DISABLE command and moves straight
# to STOP OBSERVER without ever checking whether the disable actually
# succeeded — the same "DGMGRL returns rc 0 even on internal errors" gotcha
# documented everywhere else in this project (known-risks.md #137), just
# inside a shell script instead of an Ansible task. The script's own
# unconditional `exit 0` at the end makes this easy to miss. The explicit
# DGMGRL disable+verify step below is still the right fix — it just isn't
# compensating for a missing capability, it's compensating for the script's
# own unchecked DGMGRL call, by checking the real output text instead of
# trusting either rc.
#
# --- Second gap, found immediately after fixing the first one --------------
# The first attempt at the fix above matched on the literal string
# 'Fast-Start Failover: Disabled' (one space). Real DGMGRL output right-pads
# the label column so the summary line reads 'Fast-Start Failover:  Disabled'
# (TWO spaces) when the value is short, vs 'Fast-Start Failover: Enabled in
# Zero Data Loss Mode' (one space) when it's long — confirmed directly from
# this role's own first real run output. A plain substring match on fixed
# spacing is fragile against DGMGRL's column alignment; every check below now
# uses a whitespace-tolerant regex (`is search('Fast-Start Failover:\s+...')`)
# instead of a literal substring, so it can't be tripped up by padding again.

- name: "Confirm manage_observer.sh is actually staged where expected"
  stat:
    path: "{{ manage_observer_script }}"
  register: manage_observer_stat
  tags: [rolling_fsfo_disable]

- name: "Fail with a clear message if manage_observer.sh isn't where group_vars/all.yml expects"
  fail:
    msg: >
      Expected {{ manage_observer_script }} on {{ inventory_hostname }} — not found.
      Confirm which host actually has this script and update manage_observer_script /
      this role's target group in the top-level playbook if it's not oemserver01.
  when: not manage_observer_stat.stat.exists
  tags: [rolling_fsfo_disable]

- name: "Check current FSFO/observer status before touching anything"
  become: true
  become_user: "{{ oracle_user }}"
  command: "{{ manage_observer_script }} status"
  register: fsfo_status_before
  changed_when: false
  tags: [rolling_fsfo_disable]

- name: "Show current FSFO/observer status"
  debug:
    var: fsfo_status_before.stdout_lines
  tags: [rolling_fsfo_disable]

- name: "PAUSE — about to stop the Observer / disable FSFO. Confirm this is really wanted now."
  pause:
    prompt: >
      About to run `{{ manage_observer_script }} stop` on {{ inventory_hostname }}.
      This disables Fast-Start Failover for the duration of the rolling upgrade —
      required by DBMS_ROLLING, but it also means NO automatic failover protection
      until rolling_upgrade_fsfo (or an equivalent manual step) re-enables it after
      DBMS_ROLLING.FINISH_PLAN completes, later in this phase. Press ENTER to
      proceed, Ctrl+C to stop here.
  tags: [rolling_fsfo_disable]

- name: "Stop the Observer (disables FSFO)"
  become: true
  become_user: "{{ oracle_user }}"
  command: "{{ manage_observer_script }} stop"
  register: fsfo_stop_result
  changed_when: "'stopped' in fsfo_stop_result.stdout | lower or fsfo_stop_result.rc == 0"
  tags: [rolling_fsfo_disable]

- name: "Confirm FSFO/observer PROCESS status after stop (this is the observer daemon only, NOT the Broker's FastStartFailover property — see next tasks)"
  become: true
  become_user: "{{ oracle_user }}"
  command: "{{ manage_observer_script }} status"
  register: fsfo_status_after
  changed_when: false
  tags: [rolling_fsfo_disable]

- name: "Show FSFO/observer process status after stop"
  debug:
    var: fsfo_status_after.stdout_lines
  tags: [rolling_fsfo_disable]

# ============================================================================
# The actual Broker-level action DBMS_ROLLING.BUILD_PLAN cares about: the
# FastStartFailover CONFIGURATION property, not just whether an observer
# process happens to be running. Uses the same wallet-based, no-embedded-
# password /@apexdb_DGMGRL CONNECT that dataguard_fsfo already set up and
# tested on oemserver01 — no new plaintext-secret script needed for this.
# ============================================================================
- name: "Write DGMGRL script: check current FastStartFailover property state"
  become: true
  become_user: "{{ oracle_user }}"
  copy:
    dest: "{{ fsfo_dir }}/rolling_fsfo_check.dgc"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      connect /@apexdb_DGMGRL as sysdba
      show fast_start failover;
  tags: [rolling_fsfo_disable]

- name: "Run: check current FastStartFailover property state"
  become: true
  become_user: "{{ oracle_user }}"
  shell: |
    export ORACLE_HOME={{ observer_oracle_home }}
    {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_check.dgc
  register: rolling_fsfo_property_check
  changed_when: false
  tags: [rolling_fsfo_disable]

- name: "Show FastStartFailover property state"
  debug:
    msg:
      - "Command (on {{ inventory_hostname }}): {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_check.dgc"
      - "Output: {{ rolling_fsfo_property_check.stdout_lines }}"
  tags: [rolling_fsfo_disable]

- name: "Write DGMGRL script: disable Fast-Start Failover (the real DBMS_ROLLING prerequisite — stopping the observer process alone does not do this)"
  become: true
  become_user: "{{ oracle_user }}"
  copy:
    dest: "{{ fsfo_dir }}/rolling_fsfo_disable.dgc"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      connect /@apexdb_DGMGRL as sysdba
      disable fast_start failover;
      show fast_start failover;
  when: "rolling_fsfo_property_check.stdout is search('Fast-Start Failover:\\s+Enabled')"
  tags: [rolling_fsfo_disable]

- name: "Run: disable Fast-Start Failover"
  become: true
  become_user: "{{ oracle_user }}"
  shell: |
    export ORACLE_HOME={{ observer_oracle_home }}
    {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_disable.dgc
  register: rolling_fsfo_disable_result
  when: "rolling_fsfo_property_check.stdout is search('Fast-Start Failover:\\s+Enabled')"
  tags: [rolling_fsfo_disable]

- name: Show FastStartFailover disable command and output
  debug:
    msg:
      - "Command (on {{ inventory_hostname }}): {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_disable.dgc"
      - "Output: {{ rolling_fsfo_disable_result.stdout_lines }}"
  when: "rolling_fsfo_property_check.stdout is search('Fast-Start Failover:\\s+Enabled')"
  tags: [rolling_fsfo_disable]

# DGMGRL returns rc 0 even on its own internal errors (no whenever-sqlerror
# equivalent — the same gap already documented in dataguard_broker's and
# dataguard_fsfo's headers). Check the real text, not rc, same discipline as
# every other DGMGRL task in this project.
- name: "Fail loudly if the disable didn't actually report success"
  fail:
    msg: >-
      DGMGRL did not report 'Disabled' after `disable fast_start failover;`
      — read the raw output above. rc 0 does not mean it worked
      (known-risks.md #137 — DGMGRL has no whenever-sqlerror equivalent).
  when:
    - "rolling_fsfo_property_check.stdout is search('Fast-Start Failover:\\s+Enabled')"
    - "rolling_fsfo_disable_result.stdout is not search('Disabled')"
  tags: [rolling_fsfo_disable]

- name: "Report: FastStartFailover already disabled, nothing to do"
  debug:
    msg: "FastStartFailover property was already Disabled — skipped the DGMGRL disable step."
  when: "rolling_fsfo_property_check.stdout is not search('Fast-Start Failover:\\s+Enabled')"
  tags: [rolling_fsfo_disable]

- name: "Write DGMGRL script: final verification of FastStartFailover property"
  become: true
  become_user: "{{ oracle_user }}"
  copy:
    dest: "{{ fsfo_dir }}/rolling_fsfo_verify.dgc"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      connect /@apexdb_DGMGRL as sysdba
      show fast_start failover;
      show observers;
  tags: [rolling_fsfo_disable]

- name: "Run: final verification of FastStartFailover property"
  become: true
  become_user: "{{ oracle_user }}"
  shell: |
    export ORACLE_HOME={{ observer_oracle_home }}
    {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_verify.dgc
  register: rolling_fsfo_final_verify
  changed_when: false
  tags: [rolling_fsfo_disable]

- name: "Fail loudly if FastStartFailover is not confirmed Disabled at the end of this role — DBMS_ROLLING.BUILD_PLAN will reject otherwise"
  fail:
    msg: >-
      Expected 'Fast-Start Failover:  Disabled' in the final verification
      output but did not find it — read the raw output above. Do not proceed
      to DBMS_ROLLING.BUILD_PLAN until this is confirmed.
  when: "rolling_fsfo_final_verify.stdout is not search('Fast-Start Failover:\\s+Disabled')"
  tags: [rolling_fsfo_disable]

- name: "Show final FastStartFailover verification (confirmed Disabled)"
  debug:
    msg:
      - "Command (on {{ inventory_hostname }}): {{ observer_oracle_home }}/bin/dgmgrl < {{ fsfo_dir }}/rolling_fsfo_verify.dgc"
      - "Output: {{ rolling_fsfo_final_verify.stdout_lines }}"
  tags: [rolling_fsfo_disable]

- name: "Reminder — re-enabling FSFO is a separate, later step"
  debug:
    msg: >-
      FastStartFailover is now confirmed Disabled and the Observer process is
      stopped. Both need to be re-enabled after DBMS_ROLLING.FINISH_PLAN
      completes (dataguard_fsfo's own enable/start-observer tasks cover that
      — not yet wired into this role's post-upgrade path, since FINISH_PLAN
      itself hasn't been written yet).
  tags: [rolling_fsfo_disable]
