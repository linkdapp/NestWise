---
# Phase 6 (12.2.0.1 -> 19c rolling upgrade), post-upgrade normalization —
# runs after dbms-rolling-execute.yml --tags rolling_finish has completed
# successfully (maintenance/part2-finish-plan-and-troubleshooting.md §8/§9
# confirmed). DBMS_ROLLING/AutoUpgrade's own job is done at that point —
# everything in this role is THIS PROJECT's own Active Data Guard operating
# standard (see maintenance/part2 §10, high-availability/), not something
# DBMS_ROLLING or Oracle's own whitepaper requires. Oracle's whitepaper
# stops at "primary mounted, apply running" — six steps below restore the
# original apexdb=PRIMARY / apexdb_stby=STANDBY configuration and take a
# baseline backup.
#
# Expected starting state (asserted below, not assumed):
#   apexdb_stby — PRIMARY, OPEN            (became primary at rolling_switchover)
#   apexdb      — PHYSICAL STANDBY, MOUNTED (remounted by rolling_finish)
#
# What this role does, in order:
#   1. Disable supplemental logging on apexdb_stby (current primary) —
#      DBMS_ROLLING turns this on for the transient-logical-standby phase
#      and never turns it back off (Oracle's own whitepaper names this step).
#   2. Reset CRS management policy to AUTOMATIC on both databases (undoes
#      rolling_finish's deliberate MOUNT/MANUAL override on apexdb).
#   3. Open apexdb (current standby) read-only with apply running.
#   4. Log-switch test: force a few switches on apexdb_stby, confirm apexdb
#      applies them.
#   5. Switch back to apexdb=PRIMARY / apexdb_stby=STANDBY — reuses
#      dataguard_switchover_test UNMODIFIED via include_role (direction-
#      agnostic; it re-detects current primary/standby itself and verifies
#      both the role flip and the apexdb_rw/apexdb_ro service flip via real
#      SQL/srvctl, not just DGMGRL's own report). This also satisfies §10
#      step 5 ("check role-based services") — no separate task needed here.
#   6. Re-open apexdb_stby (now standby again) read-only with apply.
#   7. RMAN Level 0 backup FROM apexdb_stby (the standby, post-switchback)
#      to /media/sf_hrman/rman_backups/<SID>.
#
# Fast-Start Failover re-enable (§10 step 6) is NOT in this role — it has to
# run against oemserver01 (observer_nodes), a genuinely different host, and
# dataguard_fsfo's own tasks rely on the PLAY's hosts: being observer_nodes
# directly (they don't delegate_to internally, unlike dataguard_switchover_test).
# include_role-ing it from this rac_node1 play would run its tasks against
# the WRONG host. See ../../rolling-postupgrade.yml's second play, which
# reuses dataguard_fsfo wholesale (every task in it already checks "already
# enabled/running, skip" — safe to just run the whole role again).
#
# Home used throughout: db19c_home, hardcoded (not rediscovered). Safe here
# in a way it wasn't during rolling_finish (see dbms_rolling_upgrade's own
# PRCD-1229 saga) — both databases are CONFIRMED on 19c by the time this
# role runs (preflight below asserts it), so there is no longer any
# ambiguity about "which home" to discover.

# ============================================================================
# Preflight — fail loudly if the starting state isn't what this role expects,
# rather than silently doing steps 1/3 to the wrong database
# ============================================================================
- name: "Preflight: fail loudly if sys_password was never overridden (DGMGRL/switchover steps below need it)"
  run_once: true
  assert:
    that: sys_password != "CHANGE_ME_sys_password"
    fail_msg: >
      sys_password is still the group_vars/all.yml placeholder — pass the
      real value explicitly: -e sys_password='...'
  tags: [rolling_postupgrade]

- name: "Write SQL: check database_role + open_mode on apexdb and apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_preflight_role.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select database_role || '|' || open_mode from v$database;
      exit;
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  tags: [rolling_postupgrade]

- name: "Run: check database_role + open_mode"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_preflight_role.sql
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  register: rpu_preflight_role
  changed_when: false
  tags: [rolling_postupgrade]

- name: Show preflight role/open_mode check
  debug:
    msg: "{{ item.item.db }}: {{ item.stdout }}"
  loop: "{{ rpu_preflight_role.results }}"
  loop_control:
    label: "{{ item.item.db }}"
  tags: [rolling_postupgrade]

- name: "Remove preflight SQL from both nodes"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_preflight_role.sql"
    state: absent
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  tags: [rolling_postupgrade]

- name: "Fail loudly if the starting state isn't apexdb_stby=PRIMARY(OPEN) / apexdb=PHYSICAL STANDBY(MOUNTED) — this role assumes that direction throughout steps 1-4"
  fail:
    msg: >-
      Expected apexdb_stby PRIMARY|... and apexdb PHYSICAL STANDBY|MOUNTED
      (the state rolling_finish should have left things in). Got:
      apexdb={{ (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb') | first).stdout }},
      apexdb_stby={{ (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb_stby') | first).stdout }}.
      Read maintenance/part2-finish-plan-and-troubleshooting.md §9 and
      confirm the real state by hand before running this role — it refuses
      to guess which database to treat as "current primary".
  when: >-
    (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb_stby') | first).stdout is not search('PRIMARY\|')
    or (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb') | first).stdout is not search('PHYSICAL STANDBY\|MOUNTED')
  tags: [rolling_postupgrade]

- name: "PAUSE — about to run post-upgrade normalization (supplemental logging, management policy, open apexdb read-only) then switch back to apexdb=PRIMARY / apexdb_stby=STANDBY, then take an RMAN Level 0 backup from the standby"
  pause:
    prompt: >
      Preflight confirmed apexdb_stby=PRIMARY(OPEN), apexdb=PHYSICAL
      STANDBY(MOUNTED). About to: disable supplemental logging on
      apexdb_stby, reset management policy to AUTOMATIC on both, open
      apexdb read-only with apply, log-switch test, SWITCHOVER BACK to
      apexdb=PRIMARY, re-open apexdb_stby read-only with apply, then run an
      RMAN Level 0 backup from apexdb_stby. Press ENTER to continue, Ctrl+C
      then A to abort.
  tags: [rolling_postupgrade]

# ============================================================================
# Step 1 — disable supplemental logging on apexdb_stby (current primary)
# ============================================================================
- name: "Write SQL: disable supplemental logging on apexdb_stby (ADD-then-DROP idiom — guarantees something's on to drop, matching Oracle's own whitepaper)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off feedback on pagesize 100 linesize 200
      ALTER DATABASE ADD SUPPLEMENTAL LOG DATA (PRIMARY KEY) COLUMNS;
      ALTER DATABASE ADD SUPPLEMENTAL LOG DATA (UNIQUE) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA (PRIMARY KEY) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA (UNIQUE) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA;
      select 'SUPPLEMENTAL_LOG_DATA_MIN=' || supplemental_log_data_min from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: disable supplemental logging on apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql
  register: rpu_supplemental_log_result
  changed_when: "'SUPPLEMENTAL_LOG_DATA_MIN=YES' in rpu_supplemental_log_result.stdout"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show supplemental logging disable output
  debug:
    msg: "{{ rpu_supplemental_log_result.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Fail loudly if supplemental logging is still on after the DROP statements"
  fail:
    msg: >-
      Expected SUPPLEMENTAL_LOG_DATA_MIN=NO after the DROP statements —
      read the raw output above.
  when: "'SUPPLEMENTAL_LOG_DATA_MIN=NO' not in rpu_supplemental_log_result.stdout"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove supplemental-logging SQL from apexdb_stby's node"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 2 — reset CRS management policy to AUTOMATIC on both databases
# ============================================================================
- name: "Reset apexdb's management policy to AUTOMATIC (undoes rolling_finish's deliberate MOUNT/MANUAL override)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  command: "{{ db19c_home }}/bin/srvctl modify database -db {{ db_unique_name }} -policy automatic"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  register: rpu_policy_apexdb
  changed_when: rpu_policy_apexdb.rc == 0
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Confirm apexdb_stby's management policy is AUTOMATIC too (should already be — never touched during rolling_finish)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  command: "{{ db19c_home }}/bin/srvctl modify database -db {{ dg_standby_db_unique_name }} -policy automatic"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  register: rpu_policy_apexdb_stby
  changed_when: rpu_policy_apexdb_stby.rc == 0
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show management-policy reset results
  debug:
    msg:
      - "apexdb: rc={{ rpu_policy_apexdb.rc }}"
      - "apexdb_stby: rc={{ rpu_policy_apexdb_stby.rc }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 3 — open apexdb (current standby) read-only with apply running
# Check-then-act: query open_mode + whether MRP is already applying before
# issuing either ALTER, so a resumed run doesn't hit ORA-16004/already-active
# errors on a database that's already in the target state.
# ============================================================================
- name: "Write SQL: check apexdb's open_mode + whether MRP is applying"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_state.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select open_mode || '|' || (select count(*) from v$managed_standby where process like 'MRP%' and status='APPLYING_LOG') from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: check apexdb's open_mode + apply status"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_state.sql
  register: rpu_apexdb_state_raw
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Set facts: apexdb's current open_mode / whether apply is running"
  set_fact:
    rpu_apexdb_open_mode: "{{ rpu_apexdb_state_raw.stdout | trim | split('|') | first }}"
    rpu_apexdb_applying: "{{ (rpu_apexdb_state_raw.stdout | trim | split('|') | last | int) > 0 }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show apexdb state before opening read-only
  debug:
    msg: "apexdb: open_mode={{ rpu_apexdb_open_mode }}, MRP applying={{ rpu_apexdb_applying }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Open apexdb read-only (only if currently MOUNTED)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE OPEN READ ONLY;
    exit;
    EOF
  register: rpu_apexdb_open_result
  when: rpu_apexdb_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Report: apexdb already open, skipped ALTER DATABASE OPEN READ ONLY"
  debug:
    msg: "apexdb open_mode is already {{ rpu_apexdb_open_mode }} — skipped."
  when: rpu_apexdb_open_mode != 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Start managed recovery on apexdb (only if MRP isn't already applying)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE RECOVER MANAGED STANDBY DATABASE USING CURRENT LOGFILE DISCONNECT;
    exit;
    EOF
  register: rpu_apexdb_apply_result
  when: not rpu_apexdb_applying
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Report: apexdb apply already running, skipped RECOVER MANAGED STANDBY DATABASE"
  debug:
    msg: "apexdb MRP was already APPLYING_LOG — skipped."
  when: rpu_apexdb_applying
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove apexdb state-check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_state.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 4 — log-switch test: force switches on apexdb_stby (primary), confirm
# apexdb (standby) applies them. Retries with a short delay rather than a
# single check, since apply can lag the switch by a few seconds.
# ============================================================================
- name: "Force 3 log switches on apexdb_stby (current primary)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM SWITCH LOGFILE;
    exit;
    EOF
  register: rpu_logswitch_result
  changed_when: true
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Write SQL: check the 5 most recent archived log sequences + applied status on apexdb"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select sequence# || '|' || applied from v$archived_log order by sequence# desc fetch first 5 rows only;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: check log-apply status on apexdb (retry — apply can lag the switch by a few seconds)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql
  register: rpu_apexdb_logswitch_check
  changed_when: false
  until: "'YES' in rpu_apexdb_logswitch_check.stdout"
  retries: 6
  delay: 10
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show log-apply check on apexdb (sequence#|applied, newest 5)
  debug:
    msg: "{{ rpu_apexdb_logswitch_check.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove log-switch check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 5 — switch back to apexdb=PRIMARY / apexdb_stby=STANDBY. Reuses
# dataguard_switchover_test UNMODIFIED — it re-detects the current direction
# itself (expects apexdb_stby=PRIMARY here, matching this role's own
# preflight above) and issues SWITCHOVER TO apexdb. Its own PAUSE task fires
# here too — no separate confirmation gate needed in this role.
#
# db_home override: dataguard_switchover_test's tasks hardcode db_home for
# the dgmgrl/sqlplus binary — correct pre-upgrade (db_home was the only home
# in use), stale now. Both databases are confirmed on 19c by this role's own
# preflight, so override db_home -> db19c_home for the duration of this
# include only (task vars on include_role outrank group_vars).
# ============================================================================
- name: "Switch back to apexdb=PRIMARY / apexdb_stby=STANDBY (reuses dataguard_switchover_test)"
  include_role:
    name: dataguard_switchover_test
  vars:
    db_home: "{{ db19c_home }}"
  tags: [rolling_postupgrade, rolling_postupgrade_switchback]

# ============================================================================
# Step 6 — re-open apexdb_stby (now standby again) read-only with apply.
# Same check-then-act pattern as step 3. Supplemental logging and management
# policy do NOT need to be redone here: supplemental logging is a physical-
# database property that stays with apexdb_stby regardless of role, and the
# management policy was already set to AUTOMATIC on both databases in step 2
# (unaffected by a role switch).
# ============================================================================
- name: "Write SQL: check apexdb_stby's open_mode + whether MRP is applying"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select open_mode || '|' || (select count(*) from v$managed_standby where process like 'MRP%' and status='APPLYING_LOG') from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Run: check apexdb_stby's open_mode + apply status"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql
  register: rpu_apexdb_stby_state_raw
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Set facts: apexdb_stby's current open_mode / whether apply is running"
  set_fact:
    rpu_apexdb_stby_open_mode: "{{ rpu_apexdb_stby_state_raw.stdout | trim | split('|') | first }}"
    rpu_apexdb_stby_applying: "{{ (rpu_apexdb_stby_state_raw.stdout | trim | split('|') | last | int) > 0 }}"
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: Show apexdb_stby state before opening read-only
  debug:
    msg: "apexdb_stby: open_mode={{ rpu_apexdb_stby_open_mode }}, MRP applying={{ rpu_apexdb_stby_applying }}"
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Open apexdb_stby read-only (only if currently MOUNTED)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE OPEN READ ONLY;
    exit;
    EOF
  register: rpu_apexdb_stby_open_result
  when: rpu_apexdb_stby_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Report: apexdb_stby already open, skipped ALTER DATABASE OPEN READ ONLY"
  debug:
    msg: "apexdb_stby open_mode is already {{ rpu_apexdb_stby_open_mode }} — skipped."
  when: rpu_apexdb_stby_open_mode != 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Start managed recovery on apexdb_stby (only if MRP isn't already applying)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE RECOVER MANAGED STANDBY DATABASE USING CURRENT LOGFILE DISCONNECT;
    exit;
    EOF
  register: rpu_apexdb_stby_apply_result
  when: not rpu_apexdb_stby_applying
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Report: apexdb_stby apply already running, skipped RECOVER MANAGED STANDBY DATABASE"
  debug:
    msg: "apexdb_stby MRP was already APPLYING_LOG — skipped."
  when: rpu_apexdb_stby_applying
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Remove apexdb_stby state-check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Post-normalization summary"
  debug:
    msg: >-
      apexdb is PRIMARY, apexdb_stby is STANDBY (OPEN READ ONLY, apply
      running) — original configuration restored. Role-based service flip
      already verified above by dataguard_switchover_test's own checks.
      Fast-Start Failover re-enable runs separately, against oemserver01 —
      see rolling-postupgrade.yml's second play (--tags rolling_postupgrade_fsfo).
      Proceeding to the RMAN Level 0 backup from apexdb_stby.
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

# ============================================================================
# Step 7 — RMAN Level 0 backup, from apexdb_stby (the standby, post-
# switchback), to /media/sf_hrman/rman_backups/<SID>.
#
# Why from the standby: offloads backup I/O from the production primary — a
# standard, well-documented Data-Guard-aware backup pattern, and exactly
# what James asked for.
#
# Practices applied, and why:
#   - CONFIGURE CONTROLFILE AUTOBACKUP ON — without this, restoring this
#     backup later requires separately locating a controlfile/spfile copy.
#     With it, RMAN backs up the controlfile+spfile automatically after
#     every backup/structural change.
#   - CONFIGURE BACKUP OPTIMIZATION ON — skips re-backing-up datafiles RMAN
#     already has an identical copy of; matters once this becomes a repeated
#     job, harmless for this one-time run.
#   - CONFIGURE RETENTION POLICY TO REDUNDANCY {{ rman_retention_redundancy }}
#     — Oracle's own default is REDUNDANCY 1 (a single backup satisfies
#     retention); explicitly setting a minimum of 2 is standard practice
#     rather than leaving it implicit.
#   - CONFIGURE DEVICE TYPE DISK PARALLELISM {{ rman_channels }} ... BACKUP
#     TYPE TO COMPRESSED BACKUPSET — persistent, config-driven parallelism
#     and compression rather than ad hoc ALLOCATE CHANNEL in a RUN block;
#     {{ rman_channels }} is deliberately modest (this is a lab VM, not a
#     production-sized box).
#   - INCREMENTAL LEVEL 0 DATABASE ... PLUS ARCHIVELOG — a level 0 is a full
#     backup that also serves as the baseline for a future incremental
#     strategy (backup-recovery/ is scoped for exactly that as later work).
#   - PLUS ARCHIVELOG uses NOT BACKED UP 1 TIMES, and this job does NOT
#     delete input archivelogs. Deliberate: this is a physical standby, and
#     its archivelogs may still be needed by Data Guard apply / by other
#     retention policy elsewhere in the broker configuration. A one-time
#     ad hoc backup job deleting archivelogs out from under Data Guard on
#     the standby is a real, avoidable risk — not done here.
#   - CROSSCHECK BACKUP + LIST BACKUP SUMMARY + RESTORE DATABASE VALIDATE —
#     a backup that's never been checked isn't a verified backup. VALIDATE
#     reads every block RMAN would need for a restore without actually
#     restoring anything.
#
# Deliberately NOT done here (out of scope for this one-time job, called out
# rather than silently skipped): CONFIGURE ARCHIVELOG DELETION POLICY TO
# APPLIED ON ALL STANDBY — this is a broker-wide governance setting that
# belongs on the PRIMARY and affects when Data Guard considers archivelogs
# safe to purge everywhere, not something to set incidentally from a single
# standby-side backup script. Worth doing as its own deliberate step when
# backup-recovery/ gets built out properly.
# ============================================================================
- name: "PAUSE — about to take an RMAN Level 0 backup of apexdb_stby to {{ rman_backup_base_dir }}/{{ sid_prefix }}1"
  pause:
    prompt: >
      About to run an RMAN Level 0 (full) backup of apexdb_stby to
      {{ rman_backup_base_dir }}/{{ sid_prefix }}1, then CROSSCHECK +
      RESTORE DATABASE VALIDATE against it. This can take a while depending
      on database size. Press ENTER to continue, Ctrl+C then A to abort.
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Preflight: confirm the backup mount point exists and is a directory (does NOT attempt to mount it — /media/sf_hrman is expected to be an already-mounted VirtualBox shared folder)"
  stat:
    path: "{{ rman_backup_base_dir }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  register: rpu_backup_mount_stat
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Fail loudly if the backup mount point is missing — likely means the VirtualBox shared folder isn't mounted on this node"
  fail:
    msg: >-
      {{ rman_backup_base_dir }} does not exist on
      {{ groups['standby_node1'][0] }}. This looks like a VirtualBox shared
      folder path (sf_ prefix) — confirm it's actually mounted (VirtualBox
      Devices menu -> Shared Folders, or `mount | grep vboxsf` on the guest)
      before re-running. Not something this role can fix by creating a
      plain directory in its place.
  when: not rpu_backup_mount_stat.stat.exists or not rpu_backup_mount_stat.stat.isdir
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Create the SID-specific backup subdirectory ({{ rman_backup_base_dir }}/{{ sid_prefix }}1)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ rman_backup_base_dir }}/{{ sid_prefix }}1"
    state: directory
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0750"
  register: rpu_backup_dir_result
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Fail loudly if the oracle user can't actually write to the backup directory — common vboxsf gotcha (host-side folder permissions / oracle not in the vboxsf group)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    touch "{{ rman_backup_base_dir }}/{{ sid_prefix }}1/.rpu_write_test" && rm -f "{{ rman_backup_base_dir }}/{{ sid_prefix }}1/.rpu_write_test"
  register: rpu_backup_write_test
  changed_when: false
  failed_when: rpu_backup_write_test.rc != 0
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Write RMAN script: Level 0 backup of apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_rman_l0_backup.rman"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      CONFIGURE CONTROLFILE AUTOBACKUP ON;
      CONFIGURE CONTROLFILE AUTOBACKUP FORMAT FOR DEVICE TYPE DISK TO '{{ rman_backup_base_dir }}/{{ sid_prefix }}1/%F';
      CONFIGURE BACKUP OPTIMIZATION ON;
      CONFIGURE RETENTION POLICY TO REDUNDANCY {{ rman_retention_redundancy }};
      CONFIGURE DEVICE TYPE DISK PARALLELISM {{ rman_channels }} BACKUP TYPE TO COMPRESSED BACKUPSET;
      CONFIGURE DEFAULT DEVICE TYPE TO DISK;

      BACKUP AS COMPRESSED BACKUPSET INCREMENTAL LEVEL 0 DATABASE
        TAG 'POST_ROLLING_UPGRADE_L0'
        FORMAT '{{ rman_backup_base_dir }}/{{ sid_prefix }}1/%d_DB_%T_%U.bkp'
        PLUS ARCHIVELOG
        TAG 'POST_ROLLING_UPGRADE_ARCH'
        FORMAT '{{ rman_backup_base_dir }}/{{ sid_prefix }}1/%d_ARCH_%T_%U.bkp'
        NOT BACKED UP 1 TIMES;

      CROSSCHECK BACKUP;
      LIST BACKUP SUMMARY;
      RESTORE DATABASE VALIDATE;
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Run: RMAN Level 0 backup of apexdb_stby (this can take a while — no fixed timeout override here on purpose, let it run)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/rman target / cmdfile={{ staging_dir }}/sql/rpu_rman_l0_backup.rman log={{ staging_dir }}/sql/rpu_rman_l0_backup.log
  register: rpu_rman_backup_result
  changed_when: true
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Fetch the RMAN log for inspection (rman's own rc can be 0 even when an internal RMAN-0xxxx error occurred mid-script — same non-trusting-rc discipline as every DGMGRL task in this project)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  command: "cat {{ staging_dir }}/sql/rpu_rman_l0_backup.log"
  register: rpu_rman_backup_log
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: Show RMAN backup log
  debug:
    msg: "{{ rpu_rman_backup_log.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Fail loudly if the RMAN log shows any RMAN- error, or rc != 0, or VALIDATE didn't report success"
  fail:
    msg: >-
      RMAN reported a problem — read the full log above
      ({{ staging_dir }}/sql/rpu_rman_l0_backup.log on
      {{ groups['standby_node1'][0] }}) before assuming this backup is
      usable. rc={{ rpu_rman_backup_result.rc }}.
  when: >-
    rpu_rman_backup_result.rc != 0
    or rpu_rman_backup_log.stdout is search('RMAN-0')
    or rpu_rman_backup_log.stdout is not search('finished successfully')
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "Remove the RMAN cmdfile (no password in it — OS-authenticated target /) but keep the log for reference"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_rman_l0_backup.rman"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_backup]

- name: "RMAN Level 0 backup summary"
  debug:
    msg: >-
      RMAN Level 0 backup of apexdb_stby completed and validated. Backup
      pieces + controlfile autobackup are under
      {{ rman_backup_base_dir }}/{{ sid_prefix }}1 on
      {{ groups['standby_node1'][0] }}. Full RMAN log kept at
      {{ staging_dir }}/sql/rpu_rman_l0_backup.log for reference. Post-
      upgrade normalization + switchback + baseline backup complete. Run
      rolling-postupgrade.yml's second play (--tags rolling_postupgrade_fsfo)
      against observer_nodes to finish with Fast-Start Failover re-enable.
  tags: [rolling_postupgrade, rolling_postupgrade_backup]
