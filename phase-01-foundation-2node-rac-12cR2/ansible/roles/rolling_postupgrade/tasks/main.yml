---
# Phase 6 (12.2.0.1 -> 19c rolling upgrade), post-upgrade normalization —
# runs after dbms-rolling-execute.yml --tags rolling_finish has completed
# successfully (maintenance/part2-finish-plan-and-troubleshooting.md §8/§9
# confirmed). DBMS_ROLLING/AutoUpgrade's own job is done at that point —
# everything in this role is THIS PROJECT's own Active Data Guard operating
# standard (see maintenance/part2 §10, high-availability/), not something
# DBMS_ROLLING or Oracle's own whitepaper requires. Oracle's whitepaper
# stops at "primary mounted, apply running" — six steps below restore the
# original apexdb=PRIMARY / apexdb_stby=STANDBY configuration. Fast-Start
# Failover re-enable and the RMAN baseline backup are deliberately NOT in
# this role — see the note below and ../../rolling-postupgrade.yml's own
# header comment for the full ordering rationale.
#
# Expected starting state (asserted below, not assumed):
#   apexdb_stby — PRIMARY, OPEN            (became primary at rolling_switchover)
#   apexdb      — PHYSICAL STANDBY, MOUNTED (remounted by rolling_finish)
#
# What this role does, in order:
#   0. Destroy the completed DBMS_ROLLING plan (DBMS_ROLLING.DESTROY_PLAN),
#      if one is still registered. Added retroactively — see the note below.
#   1. Disable supplemental logging on apexdb_stby (current primary) —
#      DBMS_ROLLING turns this on for the transient-logical-standby phase
#      and never turns it back off (Oracle's own whitepaper names this step).
#   2. Reset CRS management policy to AUTOMATIC on both databases (undoes
#      rolling_finish's deliberate MOUNT/MANUAL override on apexdb).
#   3. Open apexdb (current standby) read-only with apply running.
#   4. Log-switch test: force a few switches on apexdb_stby, confirm apexdb
#      applies them.
#   5. Switch back to apexdb=PRIMARY / apexdb_stby=STANDBY — reuses
#      dataguard_switchover_test UNMODIFIED via include_role (direction-
#      agnostic; it re-detects current primary/standby itself and verifies
#      both the role flip and the apexdb_rw/apexdb_ro service flip via real
#      SQL/srvctl, not just DGMGRL's own report). This also satisfies §10
#      step 5 ("check role-based services") — no separate task needed here.
#   6. Re-open apexdb_stby (now standby again) read-only with apply.
#
# Step 0 — why it's here, added after the fact: part2-finish-plan-and-
# troubleshooting.md §9 originally left DBMS_ROLLING.DESTROY_PLAN as a
# deliberate, manual, human-triggered cleanup step — reasonable at the time,
# since FINISH_PLAN completing doesn't require it. What that assessment
# missed: Oracle's own docs are explicit that plan state "is persisted in
# the database until you call the DESTROY_PLAN procedure" — and other
# PL/SQL that has nothing to do with Data Guard can and does check for that
# persisted state. Real, live evidence: standing up the NestWise app schema
# on this same database, days after FINISH_PLAN had already completed,
# ORDS.ENABLE_SCHEMA failed outright with ORA-20011 ("Data Guard rolling
# upgrade is currently running") — a stale-but-still-present plan record
# was enough to trip it, despite the upgrade being long since done. See
# nestwise-app/docs/install.md's step 1 troubleshooting note and
# maintenance/part2 §9/§13 for the full evidence trail. Runs first, before
# supplemental-logging/switchback normalization, specifically so it's out
# of the way before anything else in this role — including the switchover
# back to the original configuration — touches these databases again.
#
# Fast-Start Failover re-enable (roles/rolling_postupgrade_fsfo) is NOT in
# this role — it has to run against oemserver01 (observer_nodes), a
# genuinely different host, and its own tasks rely on the PLAY's hosts:
# being observer_nodes directly (no internal delegate_to, unlike
# dataguard_switchover_test). include_role-ing it from this rac_node1 play
# would run its tasks against the WRONG host.
#
# The RMAN Level 0 backup (roles/rolling_postupgrade_backup) is ALSO not in
# this role, for a different reason: it deliberately runs AFTER FSFO
# re-enable, not before, so the backup is taken once the whole HA
# configuration is confirmed restored, not mid-sequence. It still targets
# rac_node1/standby_node1 like this role does — it's split out purely
# because Ansible plays can't interleave two host groups (rac_node1, then
# observer_nodes, then rac_node1 again) within a single play. See
# ../../rolling-postupgrade.yml's header comment for the full ordering
# rationale.
#
# Home used throughout: db19c_home, hardcoded (not rediscovered). Safe here
# in a way it wasn't during rolling_finish (see dbms_rolling_upgrade's own
# PRCD-1229 saga) — both databases are CONFIRMED on 19c by the time this
# role runs (preflight below asserts it), so there is no longer any
# ambiguity about "which home" to discover.

# ============================================================================
# Preflight — fail loudly if the starting state isn't what this role expects,
# rather than silently doing steps 1/3 to the wrong database
# ============================================================================
- name: "Preflight: fail loudly if sys_password was never overridden (DGMGRL/switchover steps below need it)"
  run_once: true
  assert:
    that: sys_password != "CHANGE_ME_sys_password"
    fail_msg: >
      sys_password is still the group_vars/all.yml placeholder — pass the
      real value explicitly: -e sys_password='...'
  tags: [rolling_postupgrade]

- name: "Write SQL: check database_role + open_mode on apexdb and apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_preflight_role.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select database_role || '|' || open_mode from v$database;
      exit;
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  tags: [rolling_postupgrade]

- name: "Run: check database_role + open_mode"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_preflight_role.sql
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  register: rpu_preflight_role
  changed_when: false
  tags: [rolling_postupgrade]

- name: Show preflight role/open_mode check
  debug:
    msg: "{{ item.item.db }}: {{ item.stdout }}"
  loop: "{{ rpu_preflight_role.results }}"
  loop_control:
    label: "{{ item.item.db }}"
  tags: [rolling_postupgrade]

- name: "Remove preflight SQL from both nodes"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ item.node }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_preflight_role.sql"
    state: absent
  loop:
    - { db: apexdb, node: "{{ groups['rac_node1'][0] }}" }
    - { db: apexdb_stby, node: "{{ groups['standby_node1'][0] }}" }
  loop_control:
    label: "{{ item.db }}"
  tags: [rolling_postupgrade]

- name: "Fail loudly if the starting state isn't apexdb_stby=PRIMARY / apexdb=PHYSICAL STANDBY — this role assumes that direction throughout steps 1-4 (open_mode is NOT checked here — step 3 below already handles apexdb being MOUNTED, READ ONLY, or READ ONLY WITH APPLY idempotently)"
  fail:
    msg: >-
      Expected apexdb_stby database_role=PRIMARY and apexdb
      database_role=PHYSICAL STANDBY. Got:
      apexdb={{ (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb') | first).stdout }},
      apexdb_stby={{ (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb_stby') | first).stdout }}.
      Read maintenance/part2-finish-plan-and-troubleshooting.md §9 and
      confirm the real state by hand before running this role — it refuses
      to guess which database to treat as "current primary".
  when: >-
    (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb_stby') | first).stdout is not search('PRIMARY\|')
    or (rpu_preflight_role.results | selectattr('item.db','equalto','apexdb') | first).stdout is not search('PHYSICAL STANDBY\|')
  tags: [rolling_postupgrade]

- name: "PAUSE — about to destroy the completed DBMS_ROLLING plan, then run post-upgrade normalization (supplemental logging, management policy, open apexdb read-only) then switch back to apexdb=PRIMARY / apexdb_stby=STANDBY"
  pause:
    prompt: >
      Preflight confirmed apexdb_stby database_role=PRIMARY, apexdb
      database_role=PHYSICAL STANDBY (open_mode not checked here — the next
      steps handle apexdb already being MOUNTED, READ ONLY, or READ ONLY
      WITH APPLY idempotently). About to: destroy the completed DBMS_ROLLING
      plan if one is still registered (DESTROY_PLAN), disable supplemental
      logging on apexdb_stby, reset management policy to AUTOMATIC on both,
      open apexdb read-only with apply (if not already), log-switch test,
      SWITCHOVER BACK to apexdb=PRIMARY, re-open apexdb_stby read-only with
      apply. Fast-Start Failover re-enable and the RMAN Level 0 backup run
      afterward, as separate plays. Press ENTER to continue, Ctrl+C
      then A to abort.
  tags: [rolling_postupgrade]

# ============================================================================
# Step 0 — destroy the completed DBMS_ROLLING plan, if one is still
# registered. Check-then-act, same idiom as steps 3/6 below: query
# dba_rolling_status for a row count first, only call DESTROY_PLAN if one is
# actually there, so a resumed/re-run of this role against a database that's
# already been cleaned up doesn't hit an avoidable error calling DESTROY_PLAN
# with nothing to destroy.
# ============================================================================
- name: "Write SQL: count any still-registered DBMS_ROLLING plan"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_rolling_plan_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select count(*) from dba_rolling_status;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Run: count any still-registered DBMS_ROLLING plan"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_rolling_plan_check.sql
  register: rpu_rolling_plan_count
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Set fact: whether a DBMS_ROLLING plan is still registered"
  set_fact:
    rpu_rolling_plan_present: "{{ (rpu_rolling_plan_count.stdout | trim | int) > 0 }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Write SQL: DBMS_ROLLING.DESTROY_PLAN (only runs if a plan is present)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_rolling_destroy_plan.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off feedback on pagesize 100 linesize 200
      EXEC DBMS_ROLLING.DESTROY_PLAN;
      select count(*) as rows_remaining from dba_rolling_status;
      exit;
  when: rpu_rolling_plan_present
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Run: DBMS_ROLLING.DESTROY_PLAN"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_rolling_destroy_plan.sql
  register: rpu_rolling_destroy_result
  when: rpu_rolling_plan_present
  changed_when: rpu_rolling_plan_present
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Show DBMS_ROLLING.DESTROY_PLAN output"
  debug:
    msg: "{{ rpu_rolling_destroy_result.stdout_lines }}"
  when: rpu_rolling_plan_present
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Fail loudly if DBMS_ROLLING.DESTROY_PLAN reported an ORA- error"
  fail:
    msg: >-
      DBMS_ROLLING.DESTROY_PLAN reported an ORA- error — read the output
      above before proceeding. Do not continue into supplemental-logging
      normalization or the switchback with a rolling-upgrade plan still in
      an unknown state.
  when: rpu_rolling_plan_present and rpu_rolling_destroy_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Report: no DBMS_ROLLING plan was registered, skipped DESTROY_PLAN"
  debug:
    msg: "dba_rolling_status returned 0 rows — nothing to destroy, skipped."
  when: not rpu_rolling_plan_present
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

- name: "Remove DBMS_ROLLING plan-check/destroy SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ staging_dir }}/sql/rpu_rolling_plan_check.sql"
    - "{{ staging_dir }}/sql/rpu_rolling_destroy_plan.sql"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize, rolling_postupgrade_destroy_plan]

# ============================================================================
# Step 1 — disable supplemental logging on apexdb_stby (current primary)
# ============================================================================
- name: "Write SQL: disable supplemental logging on apexdb_stby (ADD-then-DROP idiom — guarantees something's on to drop, matching Oracle's own whitepaper)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off feedback on pagesize 100 linesize 200
      ALTER DATABASE ADD SUPPLEMENTAL LOG DATA (PRIMARY KEY) COLUMNS;
      ALTER DATABASE ADD SUPPLEMENTAL LOG DATA (UNIQUE) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA (PRIMARY KEY) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA (UNIQUE) COLUMNS;
      ALTER DATABASE DROP SUPPLEMENTAL LOG DATA;
      select 'SUPPLEMENTAL_LOG_DATA_MIN=' || supplemental_log_data_min from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: disable supplemental logging on apexdb_stby"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql
  register: rpu_supplemental_log_result
  # ADD-then-DROP always executes (no when: gate above) — this genuinely
  # changes on-disk supplemental-logging state every run, regardless of
  # what it reads back afterward. changed_when tied to the post-DROP value
  # would be backwards (that value is expected to read NO if this worked).
  changed_when: true
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show supplemental logging disable output
  debug:
    msg: "{{ rpu_supplemental_log_result.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Fail loudly if supplemental logging is still on after the DROP statements"
  fail:
    msg: >-
      Expected SUPPLEMENTAL_LOG_DATA_MIN=NO after the DROP statements —
      read the raw output above.
  when: "'SUPPLEMENTAL_LOG_DATA_MIN=NO' not in rpu_supplemental_log_result.stdout"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove supplemental-logging SQL from apexdb_stby's node"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_supplemental_log_disable.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 2 — reset CRS management policy to AUTOMATIC on both databases
# ============================================================================
- name: "Reset apexdb's management policy to AUTOMATIC (undoes rolling_finish's deliberate MOUNT/MANUAL override)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  command: "{{ db19c_home }}/bin/srvctl modify database -db {{ db_unique_name }} -policy automatic"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  register: rpu_policy_apexdb
  changed_when: rpu_policy_apexdb.rc == 0
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Confirm apexdb_stby's management policy is AUTOMATIC too (should already be — never touched during rolling_finish)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  command: "{{ db19c_home }}/bin/srvctl modify database -db {{ dg_standby_db_unique_name }} -policy automatic"
  environment:
    ORACLE_HOME: "{{ db19c_home }}"
  register: rpu_policy_apexdb_stby
  changed_when: rpu_policy_apexdb_stby.rc == 0
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show management-policy reset results
  debug:
    msg:
      - "apexdb: rc={{ rpu_policy_apexdb.rc }}"
      - "apexdb_stby: rc={{ rpu_policy_apexdb_stby.rc }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 3 — open apexdb (current standby) read-only with apply running
# Check-then-act: query open_mode + whether MRP is already applying before
# issuing either ALTER, so a resumed run doesn't hit ORA-16004/already-active
# errors on a database that's already in the target state.
# ============================================================================
- name: "Write SQL: check apexdb's database_role + open_mode + whether MRP is applying"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_state.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select database_role || '|' || open_mode || '|' || (select count(*) from v$managed_standby where process like 'MRP%' and status='APPLYING_LOG') from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: check apexdb's database_role + open_mode + apply status"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_state.sql
  register: rpu_apexdb_state_raw
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Set facts: apexdb's current database_role / open_mode / whether apply is running"
  set_fact:
    rpu_apexdb_role: "{{ rpu_apexdb_state_raw.stdout | trim | split('|') | first }}"
    rpu_apexdb_open_mode: "{{ (rpu_apexdb_state_raw.stdout | trim | split('|'))[1] }}"
    rpu_apexdb_applying: "{{ (rpu_apexdb_state_raw.stdout | trim | split('|') | last | int) > 0 }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show apexdb state before opening read-only
  debug:
    msg: "apexdb: database_role={{ rpu_apexdb_role }}, open_mode={{ rpu_apexdb_open_mode }}, MRP applying={{ rpu_apexdb_applying }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# Real failure this guard exists to catch: dataguard_switchover_test's own
# verification (step 5, above) checks the role right after SWITCHOVER
# completes — it doesn't re-check it again here, moments later, before this
# role goes on to touch apexdb/apexdb_stby further. If anything left either
# database NOT actually converted to a standby controlfile (SWITCHOVER
# reported success but the role flip didn't fully take, CRS restarted an
# instance per a stale -startoption, etc.), ALTER DATABASE RECOVER MANAGED
# STANDBY DATABASE fails with ORA-01665 ("control file is not a standby
# control file") — a real, correct-but-cryptic error to hit blind. Check the
# role directly first and fail with a clear message instead.
- name: "Fail loudly if apexdb's database_role isn't PHYSICAL STANDBY — do not attempt standby recovery against a database whose controlfile isn't actually a standby controlfile"
  fail:
    msg: >-
      apexdb's database_role is '{{ rpu_apexdb_role }}', not PHYSICAL
      STANDBY. Something upstream (the switchback in step 5, or CRS/policy
      state) left this database not actually converted to a standby — do
      not proceed. Check `dgmgrl> show configuration;` and real SQL
      (database_role, open_mode) on BOTH apexdb and apexdb_stby by hand
      before re-running.
  when: rpu_apexdb_role != 'PHYSICAL STANDBY'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Open apexdb read-only (only if currently MOUNTED)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE OPEN READ ONLY;
    exit;
    EOF
  register: rpu_apexdb_open_result
  when: rpu_apexdb_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Show ALTER DATABASE OPEN READ ONLY output (apexdb)"
  debug:
    msg: "{{ rpu_apexdb_open_result.stdout_lines }}"
  when: rpu_apexdb_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Fail loudly if ALTER DATABASE OPEN READ ONLY reported an ORA- error (sqlplus returns rc 0 even on a failed statement without WHENEVER SQLERROR — same non-trusting-rc discipline as every other check in this project)"
  fail:
    msg: >-
      ALTER DATABASE OPEN READ ONLY on apexdb reported an ORA- error — read
      the output above before proceeding.
  when: rpu_apexdb_open_mode == 'MOUNTED' and rpu_apexdb_open_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Report: apexdb already open, skipped ALTER DATABASE OPEN READ ONLY"
  debug:
    msg: "apexdb open_mode is already {{ rpu_apexdb_open_mode }} — skipped."
  when: rpu_apexdb_open_mode != 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Start managed recovery on apexdb (only if MRP isn't already applying)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE RECOVER MANAGED STANDBY DATABASE USING CURRENT LOGFILE DISCONNECT;
    exit;
    EOF
  register: rpu_apexdb_apply_result
  when: not rpu_apexdb_applying
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Show RECOVER MANAGED STANDBY DATABASE output (apexdb)"
  debug:
    msg: "{{ rpu_apexdb_apply_result.stdout_lines }}"
  when: not rpu_apexdb_applying
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Fail loudly if RECOVER MANAGED STANDBY DATABASE reported an ORA- error on apexdb"
  fail:
    msg: >-
      ALTER DATABASE RECOVER MANAGED STANDBY DATABASE on apexdb reported an
      ORA- error — read the output above before proceeding.
  when: not rpu_apexdb_applying and rpu_apexdb_apply_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Report: apexdb apply already running, skipped RECOVER MANAGED STANDBY DATABASE"
  debug:
    msg: "apexdb MRP was already APPLYING_LOG — skipped."
  when: rpu_apexdb_applying
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove apexdb state-check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_state.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 4 — log-switch test: force switches on apexdb_stby (primary), confirm
# apexdb (standby) applies them. Retries with a short delay rather than a
# single check, since apply can lag the switch by a few seconds.
# ============================================================================
- name: "Force 3 log switches on apexdb_stby (current primary)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM SWITCH LOGFILE;
    exit;
    EOF
  register: rpu_logswitch_result
  changed_when: true
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Show log-switch output (apexdb_stby)"
  debug:
    msg: "{{ rpu_logswitch_result.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Fail loudly if ALTER SYSTEM SWITCH LOGFILE reported an ORA- error on apexdb_stby"
  fail:
    msg: >-
      ALTER SYSTEM SWITCH LOGFILE on apexdb_stby reported an ORA- error —
      read the output above before proceeding.
  when: rpu_logswitch_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Write SQL: check the 5 most recent archived log sequences + applied status on apexdb"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select sequence# || '|' || applied from v$archived_log order by sequence# desc fetch first 5 rows only;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Run: check log-apply status on apexdb (retry — apply can lag the switch by a few seconds)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql
  register: rpu_apexdb_logswitch_check
  changed_when: false
  until: "'YES' in rpu_apexdb_logswitch_check.stdout"
  retries: 6
  delay: 10
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: Show log-apply check on apexdb (sequence#|applied, newest 5)
  debug:
    msg: "{{ rpu_apexdb_logswitch_check.stdout_lines }}"
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

- name: "Remove log-switch check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['rac_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_logswitch_check.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_normalize]

# ============================================================================
# Step 5 — switch back to apexdb=PRIMARY / apexdb_stby=STANDBY. Reuses
# dataguard_switchover_test UNMODIFIED — it re-detects the current direction
# itself (expects apexdb_stby=PRIMARY here, matching this role's own
# preflight above) and issues SWITCHOVER TO apexdb. Its own PAUSE task fires
# here too — no separate confirmation gate needed in this role.
#
# db_home override: dataguard_switchover_test's tasks hardcode db_home for
# the dgmgrl/sqlplus binary — correct pre-upgrade (db_home was the only home
# in use), stale now. Both databases are confirmed on 19c by this role's own
# preflight, so override db_home -> db19c_home for the duration of this
# include only (task vars on include_role outrank group_vars).
#
# --- Real bug, hit on the first live run, root-caused and fixed here -------
# `include_role` is a DYNAMIC include — `tags:` on the include task itself
# only governs whether Ansible enters the include at all; it does NOT, on
# its own, propagate into the child role's own tasks for tag-based
# selection (that's genuinely how Ansible behaves, not a typo on my part —
# see the `apply:` keyword in Ansible's own tags documentation). Since
# dataguard_switchover_test's tasks carry no tags of their own, running
# this repo's own standard invocation — `--tags rolling_postupgrade` — hit
# exactly that gap: the include was entered, but Ansible found zero
# effectively-tagged child tasks inside it and silently ran NONE of them.
# No error, no warning — the play just continued straight to step 6 as if
# the switchover had already happened. It hadn't: apexdb_stby was still
# PRIMARY, which is what then made step 6 hit a real ORA-01665 ("control
# file is not a standby control file") trying to start managed recovery
# against it. `apply:` below forwards these same tags onto every task
# inside the include, closing the gap.
# ============================================================================
- name: "Switch back to apexdb=PRIMARY / apexdb_stby=STANDBY (reuses dataguard_switchover_test)"
  include_role:
    name: dataguard_switchover_test
    apply:
      tags: [rolling_postupgrade, rolling_postupgrade_switchback]
  vars:
    db_home: "{{ db19c_home }}"
  tags: [rolling_postupgrade, rolling_postupgrade_switchback]

# ============================================================================
# Step 6 — re-open apexdb_stby (now standby again) read-only with apply.
# Same check-then-act pattern as step 3. Supplemental logging and management
# policy do NOT need to be redone here: supplemental logging is a physical-
# database property that stays with apexdb_stby regardless of role, and the
# management policy was already set to AUTOMATIC on both databases in step 2
# (unaffected by a role switch).
# ============================================================================
- name: "Write SQL: check apexdb_stby's database_role + open_mode + whether MRP is applying"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  copy:
    dest: "{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql"
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0644"
    content: |
      set echo off heading off feedback off pagesize 0 linesize 200 tab off
      select database_role || '|' || open_mode || '|' || (select count(*) from v$managed_standby where process like 'MRP%' and status='APPLYING_LOG') from v$database;
      exit;
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Run: check apexdb_stby's database_role + open_mode + apply status"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba @{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql
  register: rpu_apexdb_stby_state_raw
  changed_when: false
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Set facts: apexdb_stby's current database_role / open_mode / whether apply is running"
  set_fact:
    rpu_apexdb_stby_role: "{{ rpu_apexdb_stby_state_raw.stdout | trim | split('|') | first }}"
    rpu_apexdb_stby_open_mode: "{{ (rpu_apexdb_stby_state_raw.stdout | trim | split('|'))[1] }}"
    rpu_apexdb_stby_applying: "{{ (rpu_apexdb_stby_state_raw.stdout | trim | split('|') | last | int) > 0 }}"
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: Show apexdb_stby state before opening read-only
  debug:
    msg: "apexdb_stby: database_role={{ rpu_apexdb_stby_role }}, open_mode={{ rpu_apexdb_stby_open_mode }}, MRP applying={{ rpu_apexdb_stby_applying }}"
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Fail loudly if apexdb_stby's database_role isn't PHYSICAL STANDBY — do not attempt standby recovery against a database whose controlfile isn't actually a standby controlfile (this is the exact check that would have caught the real ORA-01665 failure hit in testing, with a clear message instead of a cryptic one)"
  fail:
    msg: >-
      apexdb_stby's database_role is '{{ rpu_apexdb_stby_role }}', not
      PHYSICAL STANDBY. The switchback in step 5 above did not leave this
      database converted to a standby — do not proceed. Check
      `dgmgrl> show configuration;` and real SQL (database_role, open_mode)
      on BOTH apexdb and apexdb_stby by hand before re-running.
  when: rpu_apexdb_stby_role != 'PHYSICAL STANDBY'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Open apexdb_stby read-only (only if currently MOUNTED)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE OPEN READ ONLY;
    exit;
    EOF
  register: rpu_apexdb_stby_open_result
  when: rpu_apexdb_stby_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Show ALTER DATABASE OPEN READ ONLY output (apexdb_stby)"
  debug:
    msg: "{{ rpu_apexdb_stby_open_result.stdout_lines }}"
  when: rpu_apexdb_stby_open_mode == 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Fail loudly if ALTER DATABASE OPEN READ ONLY reported an ORA- error (apexdb_stby)"
  fail:
    msg: >-
      ALTER DATABASE OPEN READ ONLY on apexdb_stby reported an ORA- error —
      read the output above before proceeding.
  when: rpu_apexdb_stby_open_mode == 'MOUNTED' and rpu_apexdb_stby_open_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Report: apexdb_stby already open, skipped ALTER DATABASE OPEN READ ONLY"
  debug:
    msg: "apexdb_stby open_mode is already {{ rpu_apexdb_stby_open_mode }} — skipped."
  when: rpu_apexdb_stby_open_mode != 'MOUNTED'
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Start managed recovery on apexdb_stby (only if MRP isn't already applying)"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  shell: |
    export ORACLE_HOME={{ db19c_home }}
    export ORACLE_SID={{ sid_prefix }}1
    {{ db19c_home }}/bin/sqlplus -s / as sysdba <<'EOF'
    ALTER DATABASE RECOVER MANAGED STANDBY DATABASE USING CURRENT LOGFILE DISCONNECT;
    exit;
    EOF
  register: rpu_apexdb_stby_apply_result
  when: not rpu_apexdb_stby_applying
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Show RECOVER MANAGED STANDBY DATABASE output (apexdb_stby)"
  debug:
    msg: "{{ rpu_apexdb_stby_apply_result.stdout_lines }}"
  when: not rpu_apexdb_stby_applying
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Fail loudly if RECOVER MANAGED STANDBY DATABASE reported an ORA- error on apexdb_stby"
  fail:
    msg: >-
      ALTER DATABASE RECOVER MANAGED STANDBY DATABASE on apexdb_stby
      reported an ORA- error — read the output above before proceeding.
  when: not rpu_apexdb_stby_applying and rpu_apexdb_stby_apply_result.stdout is search('ORA-')
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Report: apexdb_stby apply already running, skipped RECOVER MANAGED STANDBY DATABASE"
  debug:
    msg: "apexdb_stby MRP was already APPLYING_LOG — skipped."
  when: rpu_apexdb_stby_applying
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Remove apexdb_stby state-check SQL"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ groups['standby_node1'][0] }}"
  file:
    path: "{{ staging_dir }}/sql/rpu_apexdb_stby_state.sql"
    state: absent
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]

- name: "Post-normalization summary"
  debug:
    msg: >-
      apexdb is PRIMARY, apexdb_stby is STANDBY (OPEN READ ONLY, apply
      running) — original configuration restored. Role-based service flip
      already verified above by dataguard_switchover_test's own checks.
      Next: rolling-postupgrade.yml's second play (--tags
      rolling_postupgrade_fsfo) re-enables Fast-Start Failover against
      oemserver01, THEN its third play (--tags rolling_postupgrade_backup)
      takes the RMAN Level 0 baseline backup from apexdb_stby — in that
      order, deliberately, so the backup is taken once the whole HA
      configuration (role + FSFO + observer) is confirmed back to normal,
      not before.
  tags: [rolling_postupgrade, rolling_postupgrade_renormalize]
