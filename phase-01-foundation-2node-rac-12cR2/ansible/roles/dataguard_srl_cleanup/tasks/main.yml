---
# Data Guard Phase 5 — Remove the multiplexed +DATA01 copy of each standby
# redo log (SRL) group on apexdb_stby, leaving only the +RECO01 member —
# James's direct request, run only after the standby has been confirmed
# working (managed recovery applying, transport lag healthy). Sequenced
# before Phase 6 (RAC conversion) — this is basic Data Guard hygiene on the
# single-instance standby, no CRS registration required first.
#
# ROOT CAUSE, worth stating plainly rather than just fixing silently: this
# project's OWN design for standby redo logs is single-member, +RECO01 only
# — see group_vars/all.yml's dg_srl_* block and dataguard_primary_prep's own
# SOP 5.5 section, which builds the PRIMARY's own (future-switchback) SRLs
# exactly that way, one member, no multiplexing. apexdb_stby's SRLs were
# never built by that same explicit ADD STANDBY LOGFILE logic, though —
# Phase 4's RMAN DUPLICATE ... FOR STANDBY set standby_file_management='auto'
# AND set BOTH db_create_online_log_dest_1='+DATA01' and
# db_create_online_log_dest_2='+RECO01' (needed so DUPLICATE places the
# actual datafiles/online redo logs correctly across both diskgroups, a
# separate and correct requirement). Oracle's documented behavior for
# STANDBY_FILE_MANAGEMENT=AUTO with two DB_CREATE_ONLINE_LOG_DEST_n
# destinations set is to auto-create EVERY new redo-log-like file —
# standby redo logs included — multiplexed across both. That's what
# actually put a +DATA01 member on every apexdb_stby SRL group: a correct
# setting for the online redo logs, with an unintended side effect on the
# standby redo logs specifically. This role brings apexdb_stby's SRL layout
# back in line with the project's own already-documented, already-built
# design. See docs/known-risks.md #118.
#
# hosts: standby_node1 — same as dataguard_duplicate. v$logfile/v$standby_log
# read from the shared standby control file, so querying/dropping from
# oradbserv09 alone is sufficient regardless of which standby instance is
# currently up; delegate_to is only needed for the primary-side log-switch
# remedy below.
#
# Managed recovery is stopped for the whole drop operation — James's own
# procedure, added after the first version of this role (known-risks.md
# #120): STANDBY_FILE_MANAGEMENT=MANUAL, cancel MRP, confirm it's actually
# stopped (v$managed_standby returns no MRP rows) before touching anything,
# then restore AUTO and restart MRP once the drop is done. Wrapped in a
# block/always so the restore-and-restart step runs even if the drop itself
# ultimately fails after both attempts — leaving the standby with recovery
# stopped indefinitely would be a worse outcome than a few +DATA members
# still present.
#
# ORA-00261 handling (James's own documented remedy, followed literally):
# a standby redo log member can't be dropped while the redo transport
# service is actively writing to that group. The fix is to force the
# PRIMARY to roll off the busy group by switching logfile a few times on
# EACH primary node (not just one — thread 1 and thread 2 map to different
# SRL groups, so both primary instances need to cycle). This role attempts
# the drop once, and if any +DATA member is still present afterward, forces
# three log switches on each primary node and retries exactly once more. If
# members are still stuck after that, it stops and fails with the exact
# manual commands to finish this by hand — James asked explicitly for that
# fallback if the automation can't complete it. Note: stopping MRP only
# stops redo APPLY, not redo TRANSPORT (RFS still writes incoming redo into
# whichever SRL group is current) — that's why the log-switch remedy below
# is still needed even with recovery cancelled for the duration of the drop.

- name: "Ensure the SQL staging directory exists on {{ inventory_hostname }}"
  become: true
  become_user: "{{ oracle_user }}"
  file:
    path: "{{ staging_dir }}/sql"
    state: directory
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: "0750"

- name: "Ensure the local (control node) scratch directory exists"
  become: false
  file:
    path: "{{ dg_srl_cleanup_local_dir }}"
    state: directory
    mode: "0750"

- name: "SRL member cleanup — stop managed recovery, drop the +DATA members, always restore recovery afterward"
  block:

    # --- Baseline — record the SRL layout before touching anything ----------
    # tab off, and member format a65 (not a50) — James caught this from real
    # output: without `tab off`, SQL*Plus's default column padding uses
    # literal tab characters (showed up as "\t11 +DATA01/..." in the debug
    # output), and a50 wasn't wide enough for the real ASM path length, so it
    # wrapped onto a second physical line ("\t   155" — the tail end of a
    # truncated member value). Both fixed here and in the count/generate
    # scripts below.
    - name: "Write SQL script: list current standby redo log members (baseline)"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_list.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on heading on feedback off linesize 150 pagesize 100 tab off
          column member format a65
          select group#, member from v$logfile where type='STANDBY' order by 1,2;
          exit;

    - name: "List current standby redo log members (baseline, before any drop)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_list.sql
      register: dg_srl_cleanup_baseline
      changed_when: false

    - name: Show baseline standby redo log members
      debug:
        var: dg_srl_cleanup_baseline.stdout_lines

    # --- Stop managed recovery before dropping anything (James's procedure) -
    - name: "Write SQL script: set STANDBY_FILE_MANAGEMENT=MANUAL"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_manual.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on
          alter system set standby_file_management=manual scope=both sid='*';
          exit;

    - name: "Set STANDBY_FILE_MANAGEMENT=MANUAL before dropping standby redo log members"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_manual.sql
      register: dg_srl_cleanup_manual_result
      changed_when: true

    - name: Show STANDBY_FILE_MANAGEMENT=MANUAL output
      debug:
        var: dg_srl_cleanup_manual_result.stdout_lines

    - name: "Write SQL script: check whether managed recovery is currently running"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_mrp_check.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on heading off feedback off linesize 150 tab off
          select process, status, thread#, sequence# from v$managed_standby where process like '%MRP%';
          exit;

    - name: "Check whether managed recovery is currently running"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_mrp_check.sql
      register: dg_srl_cleanup_mrp_check
      changed_when: false

    # James's real run caught a genuine bug here: with `set echo on`, the
    # ECHOED query text itself ("SQL> select ... where process like
    # '%MRP%';") contains the literal substring "MRP" — so `'MRP' in
    # dg_srl_cleanup_mrp_check.stdout` was true unconditionally, regardless
    # of whether any row was actually returned. Same bug class as
    # known-risks.md #117's flashback-retention fix (matching against the
    # whole transcript instead of a real result line) — missed here despite
    # having already fixed it once elsewhere. Fixed the same way: a real
    # MRP result row is left-justified and starts with "MRP" (e.g. "MRP0
    # APPLYING_LOG ...", confirmed against James's own manual output); the
    # echoed command line starts with "SQL> select...". Matching `^MRP`
    # against stdout_lines catches only an actual row, never the echo.
    - name: "Set fact: is managed recovery actually running (parsed from a real result row, not the echoed query text)"
      set_fact:
        dg_srl_cleanup_mrp_running: "{{ (dg_srl_cleanup_mrp_check.stdout_lines | select('match', '^MRP') | list | length) > 0 }}"

    - name: "Write SQL script: cancel managed recovery"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_mrp_cancel.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on
          alter database recover managed standby database cancel;
          exit;
      when: dg_srl_cleanup_mrp_running

    - name: "Cancel managed recovery (only if it was actually running)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_mrp_cancel.sql
      register: dg_srl_cleanup_mrp_cancel
      changed_when: "'Database altered' in dg_srl_cleanup_mrp_cancel.stdout"
      when: dg_srl_cleanup_mrp_running

    - name: Show cancel-managed-recovery output
      debug:
        var: dg_srl_cleanup_mrp_cancel.stdout_lines
      when: dg_srl_cleanup_mrp_running

    - name: "Report: managed recovery was not running — nothing to cancel"
      debug:
        msg: "v$managed_standby showed no MRP process before this role ran — recovery was already stopped."
      when: not dg_srl_cleanup_mrp_running

    # James's explicit ask: verify MRP is actually stopped before proceeding,
    # not just assume the cancel worked.
    - name: "Verify MRP is stopped (re-runs the same check query — should return no rows)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_mrp_check.sql
      register: dg_srl_cleanup_mrp_verify
      changed_when: false

    - name: Show MRP-stopped verification output
      debug:
        var: dg_srl_cleanup_mrp_verify.stdout_lines

    - name: "Set fact: is MRP still running after cancel (same real-row parsing, not the echoed query text)"
      set_fact:
        dg_srl_cleanup_mrp_still_running: "{{ (dg_srl_cleanup_mrp_verify.stdout_lines | select('match', '^MRP') | list | length) > 0 }}"

    - name: "Fail if MRP is somehow still running after cancel — do not drop standby redo log members while it's active"
      fail:
        msg: >
          v$managed_standby still shows an MRP process after
          `recover managed standby database cancel` — see the output above.
          Refusing to proceed with dropping standby redo log members while
          managed recovery might still be using them. Investigate on
          {{ inventory_hostname }} before retrying this role.
      when: dg_srl_cleanup_mrp_still_running

    # --- Attempt 1 --------------------------------------------------------
    - name: "Attempt 1 — generate and run the +DATA member drop statements"
      include_tasks: drop_attempt.yml
      vars:
        dg_srl_cleanup_attempt: 1

    # --- Check what's left after attempt 1 ---------------------------------
    - name: "Write SQL script: count remaining +DATA standby redo log members"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_count.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on heading off feedback off linesize 150 pagesize 0 tab off
          select count(*) from v$logfile where type='STANDBY' and member like '+DATA%';
          exit;

    - name: "Count remaining +DATA standby redo log members (after attempt 1)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_count.sql
      register: dg_srl_cleanup_count_1
      changed_when: false

    # James's real run caught another live bug here: '^[0-9]+$' requires the
    # WHOLE line to be nothing but digits, but count(*) with no explicit
    # `column ... format` prints right-justified within its default NUMBER
    # column width — the real line is "         1", not "1". The old regex
    # never matched that, silently fell through to the '-1' default, and
    # `-1 > 0` is false — so the retry logic (log switches + attempt 2)
    # never fired even though group 15 was still stuck on ORA-00261.
    # `\s*` on both sides tolerates the padding; `| int` on the leftover
    # "         1" still parses correctly regardless of leading whitespace.
    - name: "Set fact: how many +DATA members are still left after attempt 1"
      set_fact:
        dg_srl_cleanup_remaining_1: "{{ (dg_srl_cleanup_count_1.stdout_lines | select('match', '^\\s*[0-9]+\\s*$') | list | first | default('-1')) | int }}"

    - name: "Report: all +DATA standby redo log members already removed — no retry needed"
      debug:
        msg: "No +DATA members remain on any standby redo log group — cleanup complete after the first attempt."
      when: dg_srl_cleanup_remaining_1 == 0

    # --- Retry — only if something is still stuck (ORA-00261) -------------
    - name: "{{ dg_srl_cleanup_remaining_1 }} +DATA member(s) still present — forcing log switches on the primary before retrying"
      debug:
        msg: >
          dropping at least one standby redo log member failed (almost certainly
          ORA-00261 — the redo transport service is still using it). Forcing 3
          log switches on each primary node ({{ groups['rac_nodes'] | join(', ') }})
          to roll redo transport off the busy group(s), then retrying the drop
          once more.
      when: dg_srl_cleanup_remaining_1 | int > 0

    - name: "Write SQL script: switch logfile"
      become: true
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ item }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_switch.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on
          alter system switch logfile;
          exit;
      loop: "{{ groups['rac_nodes'] }}"
      loop_control:
        label: "{{ item }}"
      when: dg_srl_cleanup_remaining_1 | int > 0

    - name: "Switch logfile 3 times on each primary node (James's documented ORA-00261 remedy)"
      become: true
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ item.0 }}"
      # primary_nodes, not nodes — this play runs on a standby_node1 host, and
      # group_vars/standby_nodes.yml redirects `nodes` to mean usatclust2's own
      # node list on that host. primary_nodes is the stable, never-overridden
      # duplicate kept in group_vars/all.yml specifically for this situation —
      # same reasoning as known-risks.md #86 (the primary_scan_ips/primary_nodes
      # split), same bug class, avoided here rather than repeated.
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}{{ (primary_nodes | map(attribute='name') | list).index(item.0) + 1 }}
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_switch.sql
      loop: "{{ groups['rac_nodes'] | product(range(1, 4) | list) | list }}"
      loop_control:
        label: "{{ item.0 }} iteration {{ item.1 }}"
      register: dg_srl_cleanup_switch_result
      changed_when: "'System altered' in dg_srl_cleanup_switch_result.stdout"
      when: dg_srl_cleanup_remaining_1 | int > 0

    - name: "Attempt 2 — regenerate and run the drop statements for whatever's still left"
      include_tasks: drop_attempt.yml
      vars:
        dg_srl_cleanup_attempt: 2
      when: dg_srl_cleanup_remaining_1 | int > 0

    - name: "Count remaining +DATA standby redo log members (after attempt 2)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_count.sql
      register: dg_srl_cleanup_count_2
      changed_when: false
      when: dg_srl_cleanup_remaining_1 | int > 0

    # Same whitespace-tolerant pattern as remaining_1 above — same bug,
    # same fix.
    - name: "Set fact: how many +DATA members are still left after attempt 2"
      set_fact:
        dg_srl_cleanup_remaining_2: "{{ (dg_srl_cleanup_count_2.stdout_lines | select('match', '^\\s*[0-9]+\\s*$') | list | first | default('-1')) | int }}"
      when: dg_srl_cleanup_remaining_1 | int > 0

    - name: "Fail with manual-intervention info if +DATA members are still present after two attempts"
      fail:
        msg: >
          {{ dg_srl_cleanup_remaining_2 | default(0) }} standby redo log
          member(s) under +DATA are still present after two drop attempts and 3
          rounds of log switches on each primary node — see the member list
          shown by the next task (final verification, runs regardless of this
          failure) for exactly which ones. Manual recovery: on oradbserv09
          (or oradbserv10), as oracle,
          `sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_drop_exec.sql`
          to retry the same drop statements directly; if ORA-00261 persists on a
          specific member, that group is still actively receiving redo — keep
          running `alter system switch logfile;` on BOTH primary nodes
          (oradbserv05 AND oradbserv06 — thread 1 and thread 2 use different SRL
          groups) until it clears, then retry the drop for just that member. The
          exact `alter database drop standby logfile member '...';` statements
          for whatever's still left are always available by re-running
          {{ staging_dir }}/sql/dg_srl_cleanup_generate.sql on oradbserv09/10 and
          reading {{ staging_dir }}/sql/dg_srl_cleanup_drop_generated.sql
          afterward. STANDBY_FILE_MANAGEMENT is being restored to AUTO and
          managed recovery restarted automatically below, regardless of this
          failure — the standby is not being left in a stopped-recovery state.
      when: dg_srl_cleanup_remaining_1 | int > 0 and dg_srl_cleanup_remaining_2 | int > 0

  always:

    # --- Restore settings and restart recovery — runs even if the drop -----
    #     above ultimately failed (block/always), so the standby is never
    #     left with recovery stopped and file management manual just because
    #     a stuck +DATA member needed manual follow-up.
    - name: "Write SQL script: set STANDBY_FILE_MANAGEMENT=AUTO"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_auto.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on
          alter system set standby_file_management=auto scope=both sid='*';
          exit;

    - name: "Restore STANDBY_FILE_MANAGEMENT=AUTO"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_auto.sql
      register: dg_srl_cleanup_auto_result
      changed_when: true

    - name: Show STANDBY_FILE_MANAGEMENT=AUTO output
      debug:
        var: dg_srl_cleanup_auto_result.stdout_lines

    - name: "Write SQL script: restart managed recovery"
      become: true
      become_user: "{{ oracle_user }}"
      copy:
        dest: "{{ staging_dir }}/sql/dg_srl_cleanup_mrp_restart.sql"
        owner: "{{ oracle_user }}"
        group: oinstall
        mode: "0640"
        content: |
          set echo on
          alter database recover managed standby database disconnect from session;
          exit;

    - name: "Restart managed recovery"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_mrp_restart.sql
      register: dg_srl_cleanup_mrp_restart
      changed_when: "'Database altered' in dg_srl_cleanup_mrp_restart.stdout"
      failed_when: >
        dg_srl_cleanup_mrp_restart.rc != 0 or
        ('ORA-' in dg_srl_cleanup_mrp_restart.stdout and 'Database altered' not in dg_srl_cleanup_mrp_restart.stdout)

    - name: Show restart-managed-recovery output
      debug:
        var: dg_srl_cleanup_mrp_restart.stdout_lines

    # --- Final verification (always runs) -----------------------------------
    - name: "List current standby redo log members (final state)"
      become: true
      become_user: "{{ oracle_user }}"
      shell: |
        export ORACLE_HOME={{ db_home }}
        export ORACLE_SID={{ sid_prefix }}1
        {{ db_home }}/bin/sqlplus / as sysdba @{{ staging_dir }}/sql/dg_srl_cleanup_list.sql
      register: dg_srl_cleanup_final
      changed_when: false

    - name: Show final standby redo log members
      debug:
        var: dg_srl_cleanup_final.stdout_lines

    - name: "Report: SRL cleanup complete — every group now has a single member on +{{ dg_srl_diskgroup }} only"
      debug:
        msg: "Confirmed clean — see the final member list above. No +DATA members remain on any standby redo log group. Managed recovery has been restarted."
      when: >
        (dg_srl_cleanup_remaining_1 is defined and dg_srl_cleanup_remaining_1 | int == 0) or
        (dg_srl_cleanup_remaining_2 is defined and dg_srl_cleanup_remaining_2 | int == 0)
