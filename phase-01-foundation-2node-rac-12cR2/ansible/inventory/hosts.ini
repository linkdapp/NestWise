[rac_nodes]
oradbserv05 ansible_host=192.168.56.181
oradbserv06 ansible_host=192.168.56.182

[rac_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

# DBCA and any single-node-only tasks target node 1 only
[rac_node1]
oradbserv05

# OEM VM — already exists per the project baseline (see ../../02-roadmap-skeleton.md);
# only added here as the chrony time master, not otherwise managed by this phase.
[time_master]
oemserver01 ansible_host=192.168.56.65

[time_master:vars]
ansible_python_interpreter=/usr/bin/python3

# chrony_targets is currently UNUSED — ansible/site.yml's chrony play targets
# rac_nodes directly (oemserver01 already runs a working, manually-configured NTP
# server outside this project's management; no appetite for bootstrapping ansible
# SSH access to it). Left defined here, harmless, in case oemserver01 is ever
# brought under Ansible management later — the chrony role's own "server" branch
# still exists for that.
[chrony_targets:children]
rac_nodes
time_master

# Standby cluster (Phase 2, Data Guard target) — hosts don't exist yet, listed here so
# the inventory shape is ready when that phase starts. Not targeted by site.yml today.
[standby_nodes]
oradbserv09 ansible_host=192.168.56.184
oradbserv10 ansible_host=192.168.56.185

# RMAN DUPLICATE (Data Guard Phase 4) and any other single-standby-node-only tasks
# target node 1 only — same reasoning/pattern as [rac_node1] above. oradbserv09 is
# also the node dataguard_standby_prep (Phase 3) already started the apexdb1
# auxiliary instance on in NOMOUNT, so it's the natural RMAN AUXILIARY target too.
[standby_node1]
oradbserv09

# All 4 database nodes across BOTH clusters — used only by dataguard_net_config
# (Data Guard Phase 2, Oracle Net configuration), the one role in this project that
# genuinely needs to touch primary and standby nodes in the same play: every node on
# both sides needs the SAME tnsnames.ora (both clusters' SCAN aliases), and each
# node needs its OWN static _DGMGRL listener.ora entry. Every other role stays
# scoped to rac_nodes or standby_nodes individually — this group exists specifically
# because Oracle Net configuration is inherently cross-cluster, not a modeling
# shortcut for anything else.
[dg_db_nodes:children]
rac_nodes
standby_nodes

# Data Guard Phase 9 (Fast-Start Failover) target — oemserver01 hosts the Observer.
# Same physical host as [time_master] above, but a DIFFERENT group deliberately: this
# host was never brought under Ansible management before (its own comment on the
# [time_master] block above says so explicitly — "not otherwise managed by this
# phase"), so dataguard_fsfo is the first role to actually touch it. Kept as its own
# group rather than folded into time_master because it needs its own group_vars
# redirection (see group_vars/observer_nodes.yml) — oemserver01 runs a completely
# different, unrelated Oracle install (19.3.0 DB Home, used only for its dgmgrl
# client — no RAC, no ASM, nothing this project's os_prep/db_silent_install roles
# would recognize) from the 12.2.0.1 db_home every other group in this inventory
# shares.
[observer_nodes]
oemserver01 ansible_host=192.168.56.65

[observer_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
