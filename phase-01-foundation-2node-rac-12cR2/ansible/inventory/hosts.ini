[rac_nodes]
oradbserv05 ansible_host=192.168.56.181
oradbserv06 ansible_host=192.168.56.182

[rac_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

# DBCA and any single-node-only tasks target node 1 only
[rac_node1]
oradbserv05

# OEM VM — already exists per the project baseline (see ../../02-roadmap-skeleton.md);
# only added here as the chrony time master, not otherwise managed by this phase.
[time_master]
oemserver01 ansible_host=192.168.56.65

[time_master:vars]
ansible_python_interpreter=/usr/bin/python3

# chrony_targets is currently UNUSED — ansible/site.yml's chrony play targets
# rac_nodes directly (oemserver01 already runs a working, manually-configured NTP
# server outside this project's management; no appetite for bootstrapping ansible
# SSH access to it). Left defined here, harmless, in case oemserver01 is ever
# brought under Ansible management later — the chrony role's own "server" branch
# still exists for that.
[chrony_targets:children]
rac_nodes
time_master

# Standby cluster (Phase 2, Data Guard target) — hosts don't exist yet, listed here so
# the inventory shape is ready when that phase starts. Not targeted by site.yml today.
[standby_nodes]
oradbserv07 ansible_host=192.168.56.184
oradbserv08 ansible_host=192.168.56.185
