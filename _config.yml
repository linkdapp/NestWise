theme: minima
title: NestWise
description: Oracle DBA POC and learning resources

# Every page title was rendering twice. GitHub Pages runs
# jekyll-titles-from-headings, which sets page.title from a file's first heading
# when there is no front matter. Minima then renders page.title as the page
# header, while the file's own "# Heading" renders again as the first line of
# content. The plugin defaults to strip_title: false, which leaves both.
#
# strip_title: true removes the heading from the content after using it for the
# title, so each page shows its title once. This is the plugin's documented fix
# for exactly this case.
#
# Site-wide effect: every markdown file without front matter loses its first H1
# from the rendered body. Nothing else changes. Files that need their heading in
# the body must declare an explicit `title:` in front matter instead.
titles_from_headings:
  strip_title: true

# The home page is README.md itself, carrying `layout: home` and `permalink: /`
# in its own front matter.
#
# It deliberately carries no `title:`. minima's home layout prints page.title as
# an h1 above the content, so an explicit title rendered "NestWise" directly above
# the README's own H1, twice over. With no title declared, titles_from_headings
# derives one from the H1 and strip_title above removes it from the body, which is
# how every other page here already behaves.
#
# HISTORY, because deleting the wrong file here takes the site down. In August
# 2026 this site returned "404 File not found ... For root URLs you must provide
# an index.html file." Cause: README.md carried `title: ""` front matter, and
# jekyll-readme-index skips any README that already has front matter, so nothing
# was ever written to /index.html. Two fixes were on the table. A separate
# index.md holding an include_relative call, which is what was used, and
# `permalink: /` on README's own front matter, which is what is used now. Both
# produce /index.html. `baseurl` below was the other half of that fix and is not
# optional for a project site.
#
# index.md was replaced because include_relative broke every link on the home
# page, for three weeks, before anyone clicked one.
#
# GitHub Pages runs jekyll-relative-links, which rewrites a relative `.md` link
# into the URL Jekyll actually publishes: `part1-active-data-guard.md` becomes
# `part1-active-data-guard.html`, and `installation/README.md` becomes
# `installation/`. That rewrite runs against a page's own content, in the
# pre_render hook. The content of index.md was the include tag and nothing else,
# so there was never a link in it to rewrite; README's body arrived later, during
# Liquid rendering. Every link on the home page kept its `.md` target and served
# the raw markdown source. Pages reached from the top nav looked right because
# they are real pages and did get rewritten.
#
# Confirmed on the live site before this change: swapping one link by hand made
# it render, while the identical old-form link to the same destination, on the
# same page, stayed raw. Two other content-phase plugins show the same
# fingerprint, titles_from_headings never stripped README's H1 on the home page
# while stripping it everywhere else.
#
# Do not reintroduce index.md. A page whose links must work has to be a page in
# its own right, not a fragment included into one.
#
# The explicit `permalink: /` is required. jekyll-readme-index is what maps a
# README to its directory URL, and it skips a README that already has front
# matter. That is why nestwise-app/ and backup-recovery/ publish as
# `README.html` while installation/ and high-availability/ publish as
# directories. Front matter here without a permalink would publish the home page
# at /README.html and leave the site root empty.
url: "https://linkdapp.github.io"
baseurl: "/NestWise"

# Curated top-nav. Without this, minima defaults to listing every markdown file
# in the repo that Jekyll treats as a page (GitHub Pages auto-derives a title from
# each file's first heading via jekyll-titles-from-headings even with no front
# matter), which was dumping internal drafts and a literal post-template placeholder
# into the public nav alongside real docs. Each entry below is a real, built entry
# point; each one links out to its own sub-pages (HA parts 1-3, maintenance parts 1-2,
# tools/swingbench) rather than flattening everything into the global bar.
#
# phase-01-foundation-2node-rac-12cR2/README.md and its docs/known-risks.md were
# both dropped from the top nav on purpose (they don't map to one of this bar's
# section headers) — not orphaned, though: installation/README.md links to both
# repeatedly (know-risks.md alone 25+ times), and the phase-01 README links back to
# installation/README.md itself, so the content stays reachable, just not duplicated
# in the top bar.
#
# tools/README.md (not tools/swingbench/README.md directly) is the header entry so
# "Tools" has a real landing page — Swingbench is linked from there, plus any future
# standing tools (AHF, SQL Developer) as their own pages get built.
#
# nestwise-app/README.md sits second, directly after Installation: the
# infrastructure gets built first, then the application that runs on it and
# proves it works. It carries explicit `title: NestWise App` front matter —
# without it, jekyll-titles-from-headings would derive "NestWise" from the
# file's first heading and the nav entry would collide with the site title.
# Its own sub-documents (page_plan, install, demo-script, the load-test
# write-ups) are reachable from that page rather than duplicated in this bar,
# same principle as HA parts 1-3 and maintenance parts 1-2.
header_pages:
  - installation/README.md
  - nestwise-app/README.md
  - high-availability/README.md
  - monitoring/README.md
  - backup-recovery/README.md
  - maintenance/README.md
  - performance-tuning/README.md
  - tools/README.md

# Keep Jekyll from parsing/publishing the Ansible automation. These files
# start with "---" (plain YAML document markers) and contain Jinja2 syntax
# (e.g. `| join(',')`, `{% if not loop.last %}`) that Jekyll's Liquid engine
# misreads as front matter + template tags, which breaks the whole Pages build.
#
# EXCLUSION ONLY COVERS THESE PATHS. A markdown file anywhere else that quotes
# Jinja syntax — even inside a fenced code block, which Liquid does not respect —
# will take the whole build down the same way. Two of them did in Sept 2026; see
# docs/known-risks.md #157. Such files use a Liquid raw block instead, either
# wrapping the whole file right after the front matter (known-risks.md,
# monitoring/phase-7a-ansible.md) or guarding each occurrence inline
# (docs/ansible-architecture-and-debugging.md, high-availability/part1 and part2).
#
# Three mechanisms, all already in use. A new document that needs to show Jinja
# picks one of them; there is nothing else to invent.
#
# Also excludes root-level working/draft files (gap analysis, roadmap skeleton,
# skill-content draft, rebrand notes, and the showcase-post template) so they
# don't get swept into site.pages and appear in the nav — they're planning
# documents, not published pages. The showcase-post template in particular has
# `layout: post` and a literal placeholder title; it belongs in _posts/ once
# real posts exist, not at the repo root.
#
# ansible-preflight-checklist.md joins them for the same reason, with an extra
# one: this site is about Oracle. That checklist is Ansible engineering hygiene —
# block scalars, become_user inheritance, argument splitting — and teaches nothing
# about databases. It stays in the repo and stays linked from the phase-01 README
# for anyone reading the automation; it is not a page a DBA came here to read.
# (It is also the file whose `{% if %}` example took the build down in #157.)
exclude:
  - phase-01-foundation-2node-rac-12cR2/ansible
  - phase-01-foundation-2node-rac-12cR2/response-files
  - phase-01-foundation-2node-rac-12cR2/scripts
  - phase-01-foundation-2node-rac-12cR2/docs/ansible-preflight-checklist.md
  - 01-gap-analysis-and-questions.md
  - 02-roadmap-skeleton.md
  - 03-showcase-post-template.md
  - 04-skill-content-draft.md
  - 05-repo-rebrand-and-metadata.md
